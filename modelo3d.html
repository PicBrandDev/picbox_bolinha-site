<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICBOX — modelo 3D</title>
<style>
:root{
  --bg:#0e1113; --bg2:#15191c; --bg3:#1c2226; --line:#2a3238; --line2:#384249;
  --fg:#e6ecef; --fg2:#9aa7ae; --acc:#2ad3d3; --cat:#9aa3ab; --err:#ff4d4d; --ok:#7bd88f;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#top{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;flex-wrap:nowrap;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:20}
#top::-webkit-scrollbar{display:none}
#brand{font-weight:700;letter-spacing:.14em;font-size:15px}
#brand span{color:var(--acc)}
.xlink{color:var(--acc);text-decoration:none;font-size:12px;white-space:nowrap;
  padding:4px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--bg3)}
.xlink:hover{color:var(--fg);border-color:var(--acc)}
#camBar{display:flex;gap:2px;flex-wrap:nowrap}
.btn{font:inherit;font-size:12px;color:var(--fg2);background:var(--bg3);
  border:1px solid var(--line2);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--fg);border-color:var(--acc)}
.btn.on{color:#06232a;background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.sm{padding:3px 7px;font-size:11px}
#wrap{position:absolute;inset:46px 0 0 0}
canvas{display:block}
.panel{position:absolute;background:rgba(21,25,28,.94);border:1px solid var(--line);
  border-radius:8px;padding:9px 10px;backdrop-filter:blur(3px)}
#left{left:10px;top:10px;bottom:124px;width:284px;overflow-y:auto;z-index:10}
#right{right:10px;top:10px;width:268px;max-height:calc(60% - 20px);overflow-y:auto;z-index:10}
#legend{left:10px;bottom:10px;width:284px;max-height:46%;overflow-y:auto;z-index:11}
#legend .kv{font-size:11px}
#coll{right:10px;bottom:10px;width:268px;max-height:36%;overflow-y:auto;z-index:10}
#ficha{left:304px;right:288px;bottom:10px;max-height:40%;overflow-y:auto;z-index:12}
#etapas{position:absolute;left:0;right:0;bottom:0;display:flex;gap:0;z-index:13;
  background:linear-gradient(to top,rgba(14,17,19,.92),rgba(14,17,19,0));padding:22px 12px 10px}
#etapas .et{flex:1;min-width:0;padding:6px 4px 5px;border-top:2px solid var(--line);
  font-size:10.5px;color:var(--fg2);text-align:center;line-height:1.25;transition:color .2s,border-color .2s}
#etapas .et b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;opacity:.6}
#etapas .et.on{color:var(--fg);border-top-color:var(--acc)}
#etapas .et.on b{color:var(--acc);opacity:1}
#etapas .et.feito{border-top-color:var(--line2);color:var(--fg2)}
body.demo #left,body.demo #coll,body.demo #legend,body.demo #ficha{display:none}
body.demo #right{max-height:calc(100% - 150px);width:236px;font-size:11.5px}
body.demo #right h4:first-child{margin-top:0}
#ficha h4{margin-top:0}
#ficha .cab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#ficha .nome{font-size:14px;font-weight:600}
#ficha .chip{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--fg2)}
#ficha .chip.cat{color:#0e1113;background:var(--cat);border-color:var(--cat)}
#ficha .chip.est{color:#06232a;background:var(--acc);border-color:var(--acc)}
#ficha .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px 18px}
#ficha .fechar{position:absolute;top:6px;right:8px}
#ficha .fn{margin-top:6px;line-height:1.45}
h4{margin:2px 0 7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);
  font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
h4:not(:first-child){margin-top:12px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row label{flex:0 0 96px;color:var(--fg2);font-size:11.5px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.row select,.row input[type=number]{flex:1;min-width:0;font:inherit;font-size:11.5px;
  background:var(--bg3);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:2px 4px}
.val{flex:0 0 66px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--fg)}
.kv{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;padding:1px 0}
.kv b{font-weight:600}
.kv .u{color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.note{color:var(--fg2);font-size:11px;margin-top:6px;line-height:1.35}
.errline{color:var(--err);font-family:var(--mono);font-size:11px;padding:1px 0}
.lbl{font-family:var(--mono);font-size:10.5px;color:#cfe9e9;background:rgba(10,14,16,.72);
  padding:0 3px;border-radius:3px;white-space:nowrap;pointer-events:none}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;z-index:30;background:var(--bg);color:var(--fg2)}
#textOverlay{position:fixed;inset:6% 8%;background:var(--bg2);border:1px solid var(--line2);
  border-radius:10px;display:none;flex-direction:column;z-index:40;padding:10px}
#textOverlay.open{display:flex}
#wrap.sempaineis .panel{display:none}
@media (max-width:860px){
  #ficha{left:10px;right:10px;max-height:46%}
  #left,#legend{width:min(46vw,260px)}
  #right,#coll{width:min(46vw,240px)}
  .panel{padding:7px 8px;font-size:11.5px}
  .row label{flex-basis:76px;font-size:10.5px}
  #left{bottom:10px}
  #legend{display:none}
  #left .val{flex-basis:54px}
}
#textOverlay header{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#textOverlayBody{flex:1;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;font-family:var(--mono);font-size:11.5px;padding:8px;resize:none}
</style>
</head>
<body>

<div id="top">
  <div id="brand">PIC<span>BOX</span> &nbsp;<span style="font-weight:400;font-size:11px;color:var(--fg2);letter-spacing:0">modelo 3D</span></div>
  <div id="camBar"></div>
  <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
    <button class="btn" id="btnDemo" title="roda o ciclo inteiro da bola, do lançamento até o carro A pegar a próxima">demonstração</button>
    <button class="btn" id="btnCam" hidden title="a câmera volta a acompanhar a etapa corrente">câmera auto</button>
    <button class="btn" id="btnPaineis" title="esconder os painéis (tecla H)">painéis</button>
    <button class="btn" id="btnGltf">GLTF</button>
    <button class="btn" id="btnCsv">CSV peças</button>
    <a class="xlink" href="index.html">simulador &#8599;</a>
  </div>
</div>

<div id="wrap">
  <div id="boot">carregando three.js do CDN&hellip;<br><span style="font-size:11px">se esta mensagem não sair, a página não tem acesso à internet — o three.js vem de CDN e é o único requisito externo</span></div>
  <div class="panel" id="left"></div>
  <div class="panel" id="right"></div>
  <div class="panel" id="legend"></div>
  <div class="panel" id="coll"></div>
  <div class="panel" id="ficha" hidden></div>
  <div id="etapas" hidden></div>
</div>

<div id="textOverlay">
  <header>
    <div id="textOverlayTitle" style="font-family:var(--mono);font-size:12px"></div>
    <span style="flex:1"></span>
    <button class="btn" id="btnCopyText">Copiar</button>
    <button class="btn" id="btnCloseText">Fechar</button>
  </header>
  <textarea id="textOverlayBody" spellcheck="false"></textarea>
</div>

<script src="js/util.js"></script>
<script src="js/params.js"></script>
<script src="js/physics.js"></script>
<script src="js/model.js"></script>
<script src="js/catalog.js"></script>

<!-- three.js 0.147: ultima versao com build classico (nao-modulo). E de proposito:
     modulo ES carregado de file:// e bloqueado por CORS, e o requisito e abrir
     com duplo clique. Script classico de CDN https funciona nos dois casos. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/math/OBB.js"></script>

<script>
(function () {
'use strict';
if (!window.THREE || !THREE.OrbitControls || !THREE.OBB) {
  document.getElementById('boot').innerHTML =
    'three.js não carregou.<br><span style="font-size:11px">esta página busca a biblioteca em cdn.jsdelivr.net; ' +
    'sem acesso à internet ela não monta. O simulador, esse sim, funciona offline.</span>';
  return;
}
const OrbitControls = THREE.OrbitControls, GLTFExporter = THREE.GLTFExporter,
      CSS2DRenderer = THREE.CSS2DRenderer, CSS2DObject = THREE.CSS2DObject;

const U = window.PB.util, P = window.PB.params, PH = window.PB.physics,
      M = window.PB.model, CT = window.PB.catalog;

/* ============================================================================
   GEOM — constantes puramente geometricas, que o simulador nao usa.
   Unidade de cena: MILIMETRO. Origem no centro do piso do gabinete.
   Eixos: +X largura (direita do jogador), +Y para cima, +Z para o jogador.
   Toda cota tem procedencia propria: CAT = dimensao publicada em catalogo,
   EST = dimensao de projeto, estimada. Uma cota nunca mistura as duas.
   O que o simulador TAMBEM usa nao mora aqui: vem de params.js (P.num) ou,
   no caso de peca com alternativa, de catalog.js (CT.geom).
   ========================================================================== */
const CAT = 'cat', EST = 'est';
const mm  = (v, s) => ({ v, s, u: 'mm' });
const un  = (v, s, u) => ({ v, s, u });

const GEOM = {
  gabinete: {
    parede:      mm(18, EST),            // chapa de MDF estrutural
    campoY0:     mm(1100, EST),          // piso do campo de jogo (orcamento vertical)
    painelY0:    mm(1050, EST),          // painel de botoes comeca aqui
    bandaEixoSup: mm(80, EST),           // trilho + carro + soltura
    bandaEixoInf: mm(70, EST),           // trilho + carro + boca
    bandaBandeja: mm(50, EST),           // bandeja de captura + retorno
    planoTrilhoZ: mm(0, EST),            // plano vertical dos dois trilhos; a bola cai nele
    vidroE:      mm(6, EST),             // vidro frontal do campo
    ledFitaL:    mm(10, CAT),            // WS2812B
    ledFitaE:    mm(3, EST),
    folga:       mm(2, EST)              // folga de montagem padrao
  },
  eixo: {
    trilhoComp:  mm(350, CAT),           // MGN12 350 mm
    trilhoLarg:  mm(12, CAT),
    trilhoAlt:   mm(8, CAT),
    carroComp:   mm(45.4, CAT),          // MGN12H
    carroLarg:   mm(27, CAT),
    carroAlt:    mm(13, CAT),
    vigaZ:       mm(40, EST),            // perfil de aluminio que carrega o trilho
    suporteX:    mm(15, EST),            // suporte de extremidade
    suporteY:    mm(32, EST),         // baixo de proposito: acima disto o mancal
                                      // fecha a janela por onde o tubo de carga
                                      // atravessa o plano dos trilhos
    placaE:      mm(3, EST),             // placa do carro montado
    placaXY:     mm(64, EST),
    recuoSup:    mm(60, EST),            // eixo do trilho superior -> centro da bola no berco
    recuoInf:    mm(45, EST),            // boca do buraco -> eixo do trilho inferior
    sensorOptC:  mm(12, EST),            // sensor optico: 2 de fim de curso por eixo e
    sensorOptL:  mm(8, EST),             // a barreira na boca do lancador usam o mesmo
    sensorOptA:  mm(6, EST),             // encapsulamento
    as5600:      mm(15, CAT),            // PCB do encoder magnetico da polia tensora
    vMin:        un(0.2, EST, 'm/s'),    // envelope de velocidade de pico do carro
    vMax:        un(0.8, EST, 'm/s')
  },
  boca: {
    parede:      mm(3, EST),             // paredes do bocal que forma o buraco
    flange:      mm(10, EST),            // aba de fixacao na placa do carro
    chapaE:      mm(4, EST),             // chapa-alvo: e nela que fica o furo
    chapaSobra:  mm(26, EST),            // material em volta do furo, de cada lado
    raioCanto:   mm(8, EST),             // canto arredondado do furo
    anelFio:     mm(4, EST),             // anel que marca a area de acerto
    gargantaAlt: mm(46, EST),            // garganta sob o furo: conduz a bola para dentro
    funilAlt:    mm(34, EST),            // funil sob o furo, ate a saida
    funilSaida:  mm(14, EST),            // folga da saida do funil sobre a bola
    portaE:      mm(2, EST),             // portinhola que a bola empurra ao passar
    portaGiro:   un(62, EST, 'graus'),
    acusoT:      un(0.9, EST, 's')       // quanto tempo o alvo fica aceso no acerto
  },
  tremonha: {
    parede:      mm(2.5, EST),
    incl:        un(4.5, EST, 'graus'),  // caimento PRINCIPAL: leva a bola ate a parede
                                         // de +X da bandeja. Os dois caimentos somados
                                         // tem que caber na banda de 50 mm da bandeja,
                                         // senao a chapa desce dentro da divisoria do campo
    inclZ:       un(3, EST, 'graus'),    // caimento SECUNDARIO: ao longo daquela parede,
                                         // ate o canto de tras. E ele que faz a bola sair
                                         // da bandeja ja andando na direcao do elevador
    borda:       mm(26, EST)             // aba que impede a bola de saltar para fora
  },
  soltura: {
    tAssento:    un(0.14, EST, 's'),     // a bola rola da aba para o fundo do copo
    bercoParede: mm(2.5, EST),
    bercoAbraco: un(150, EST, 'graus'),  // arco do copo que retem a bola
    bracoE:      mm(4, EST),             // braco que desce da placa ate o berco
    bracoL:      mm(26, EST),
    pcbC:        mm(40, EST),            // PCB do carro (capacitor + MOSFET)
    pcbL:        mm(30, EST),
    pcbE:        mm(1.6, EST),
    capD:        mm(18, EST),            // capacitor 2200 uF
    capA:        mm(35, EST),
    mosfetC:     mm(6, EST),
    mosfetL:     mm(5, EST),
    mosfetA:     mm(9, EST)
  },
  magazine: {
    bolas:       un(15, EST, 'bolas'),   // capacidade alvo
    passos:      un(3, EST, 'passes'),   // serpentina. Numero IMPAR de proposito: o
                                         // magazine entra pelo lado do elevador (+X) e
                                         // tem que terminar do lado do berco (-X), senao
                                         // a ultima calha atravessa a maquina inteira
    z:           mm(-63, EST),           // entre a coluna do elevador (atras) e o plano
                                         // da correia do eixo A (a frente). Os dois
                                         // limites sao verificados em checkCoerencia.
    y:           mm(1485, EST),          // altura do passe de SAIDA, logo acima do
                                         // berco. Os outros passes ficam acima deste,
                                         // e o elevador entrega no mais alto de todos.
    dy:          mm(42, EST),            // desnivel entre passes: menos que isto e as
                                         // paredes de dois passes se cruzam
    incl:        un(6, EST, 'graus'),    // inclinacao de escoamento por gravidade
    tuboParede:  mm(2.5, EST),
    servoC:      mm(23, CAT),            // SG90 do escapement
    servoL:      mm(12, CAT),
    servoA:      mm(29, CAT),
    cameR:       mm(11, EST),
    cameE:       mm(4, EST),
    sensorNivel: mm(10, EST),
    vFila:       un(140, EST, 'mm/s'),   // a fila avanca rolando, nao pulando um passo
    tCame:       un(0.30, EST, 's'),     // meia volta da came: libera UMA bola
    comportaE:   mm(2.5, EST),           // chapa da comporta de carga
    comportaAlt: mm(19, EST),            // altura da lamina: quanto ela desce para abrir
    tComporta:   un(0.16, EST, 's'),     // tempo de abertura/fechamento
    rampaQueda:  mm(16, EST),            // desnivel do tubo ao entrar no plano de jogo
    rampaCarga:  mm(5, EST),             // desnivel do ultimo trecho: e ele que faz a
                                         // bola ROLAR para dentro do berco
    tolCarga:    mm(8, EST),             // janela de alinhamento carro/comporta
    vCarga:      un(80, EST, 'mm/s')     // o carro tem que estar praticamente parado:
                                         // a comporta abre na inversao do curso
  },
  elevador: {
    colunaX:     mm(70, EST),            // a profundidade da coluna (Z) NAO e escolhida:
                                         // sai de D.elevZ, porque tem que caber dois
                                         // ramos da esteira + cacamba com a bola dentro
                                         // o PE do elevador tambem nao e cota livre:
                                         // sai de D.yElevPe, logo abaixo da bandeja
    esteiraL:    mm(50, EST),
    esteiraE:    mm(2, EST),
    taliscaL:    mm(24, EST),            // altura da parede de tras da cacamba
    taliscaE:    mm(3, EST),             // chapa da cacamba
    labio:       mm(13, EST),            // aba na ponta da cacamba: retem a bola na
                                         // subida e a libera quando o copo tomba
    poliaD:      mm(28, EST),
    motorD:      mm(37, EST),
    motorC:      mm(62, EST),
    conchaIni:   un(-20, EST, 'graus'),  // a concha do fundo comeca aqui (0 = ramo que
                                         // desce) e termina no ramo que sobe
    despejoAng:  un(45, EST, 'graus'),   // angulo, depois do topo, em que a capa acaba
                                         // e a bola rola para fora do copo
    rpm:         un(90, EST, 'rpm')      // motor DC 12 V com redutor: com polia de 28 mm
                                         // da ~132 mm/s, e a subida leva ~4 s
  },
  calha: {
    parede:      mm(2.5, EST),
    folgaLat:    mm(6, EST),             // largura = diametro da bola + 2x esta folga
    vBola:       un(300, EST, 'mm/s'),   // velocidade de entrada da bola numa calha
    vMax:        un(1400, EST, 'mm/s'),  // teto de velocidade nas calhas (atrito de rolagem)
    atrito:      un(0.06, EST, '—'),     // resistencia de rolagem equivalente (aco/acrilico)
    restImpacto: un(0.45, EST, '—'),     // fracao da velocidade que sobrevive ao impacto
                                         // na chapa/bandeja e vira marcha na calha. O
                                         // que se perde e o componente normal.
    quedaRetorno: mm(22, EST)            // queda da calha de retorno, do canto da bandeja
                                         // ate o labio da concha. E so isto que o retorno
                                         // gasta de altura: o resto e curso de elevador.
                                         // Sobre 67 mm de percurso da ~18 graus.
  },
  botoes: {
    dGrande:     mm(60, EST),
    dPequeno:    mm(30, EST),
    corpoA:      mm(32, EST),
    aro:         mm(6, EST),             // anel entre a capa e o corpo roscado
    capaE:       mm(8, EST),             // altura da capa translucida
    incl:        un(12, EST, 'graus'),
    nPequenos:   un(4, EST, 'botoes')
  },
  telas: {
    campoMoldC:  mm(360, CAT),           // LCD 15,6": moldura
    campoMoldA:  mm(215, CAT),
    campoMoldE:  mm(6, CAT),
    campoAtivaC: mm(345, CAT),           // area ativa
    campoAtivaA: mm(194, CAT),
    campoRecuo:  mm(30, EST),            // atras do plano dos trilhos
    acrilicoE:   mm(3, EST),
    acrilicoFolga: mm(20, EST),          // sobra lateral em volta da moldura
    barraAtivaC: mm(310, CAT),           // testeira 12,6" 1920x515
    barraAtivaA: mm(85, CAT),
    barraMoldC:  mm(340, EST),
    barraMoldA:  mm(110, EST),
    barraMoldE:  mm(8, EST)
  },
  eletronica: {
    rpiC:        mm(85, CAT), rpiL: mm(56, CAT), rpiA: mm(17, CAT),
    rpiFuroX:    mm(58, CAT), rpiFuroY: mm(49, CAT),
    picoC:       mm(51, CAT), picoL: mm(21, CAT), picoA: mm(4, EST),
    tmcC:        mm(20, CAT), tmcL: mm(15, CAT), tmcA: mm(12, EST),
    fonteC:      mm(199, CAT), fonteL: mm(99, CAT), fonteA: mm(30, CAT),
    dcdcC:       mm(60, EST), dcdcL: mm(45, EST), dcdcA: mm(25, EST),
    pcbC:        mm(150, EST), pcbL: mm(100, EST), pcbA: mm(16, EST),
    dinC:        mm(160, EST), dinL: mm(60, EST), dinA: mm(80, EST),
    falanteD:    mm(50, EST), falanteA: mm(26, EST),
    ampC:        mm(50, EST), ampL: mm(40, EST), ampA: mm(12, EST),
    prateleiraE: mm(15, EST),
    corredor:    mm(90, EST),            // faixa livre em +X para a calha de retorno
                                         // descer da bandeja ate o elevador sem
                                         // atravessar as prateleiras

/* --------------------------------------------------------------------------
   Cotas derivadas: nao sao escolha, sao consequencia. Recalculadas a cada
   rebuild porque geo.h, geo.sep e ball.d sao parametros vivos.
   -------------------------------------------------------------------------- */
function derive() {
  const g = GEOM.gabinete, e = GEOM.eixo;
  const h = P.num('geo.h'), sep = P.num('geo.sep');
  const d = {
    lado: P.num('geo.floor'), alturaExt: P.num('geo.height'), interna: P.num('geo.inner'),
    h: h, sep: sep, curso: P.num('A.stroke'), bolaR: P.num('ball.d') / 2,
    yBandeja0: g.campoY0.v,
    yBandeja1: g.campoY0.v + g.bandaBandeja.v
  };
  d.yBoca    = d.yBandeja1 + g.bandaEixoInf.v;          // plano da boca do buraco
  d.ySoltura = d.yBoca + h;                             // centro da bola ao soltar
  d.yCampo1  = d.ySoltura + g.bandaEixoSup.v;           // teto do campo de jogo
  d.yTrilhoB = d.yBoca - e.recuoInf.v;
  d.yTrilhoA = d.yTrilhoB + sep;                        // geo.sep manda, sempre
  d.recuoSupReal = d.yTrilhoA - d.ySoltura;             // = recuoSup se geo.sep coerente
  d.vigaAltSup = d.yCampo1 - (d.yTrilhoA + e.trilhoAlt.v / 2);
  d.vigaAltInf = (d.yTrilhoB - e.trilhoAlt.v / 2) - d.yBandeja1;
  d.bracoH   = d.recuoSupReal - e.trilhoAlt.v / 2 - e.carroAlt.v - e.placaE.v;
  d.bocaH    = e.recuoInf.v - e.trilhoAlt.v / 2 - e.carroAlt.v - e.placaE.v;
  // plano da transmissao de cada eixo: tem que ficar atras do que o carro carrega,
  // senao o corpo do motor entra no volume varrido pela peca do carro
  // A bola nao cai no plano dos trilhos: ali estao os dois carros. Ela cai num
  // plano a frente deles, que e o unico lugar por onde ela passa pelo furo do
  // eixo B e continua caindo sem bater em nada.
  // o plano tem que limpar o que e mais largo atras dele (carro ou viga do trilho)
  // e comportar o que e mais largo nele (a bola ou a garganta do buraco)
  d.zJogo = g.planoTrilhoZ.v
    + Math.max(e.carroLarg.v / 2, e.vigaZ.v / 2) + g.folga.v
    + Math.max(d.bolaR, P.num('geo.depth') / 2 + GEOM.boca.parede.v) + g.folga.v;
  d.trnZ = id => -(fundoDoCarro(id) + g.folga.v + trnRaio());
  d.xRail    = e.trilhoComp.v / 2;

  /* ---- elevador: a coluna nao tem cota propria em Z. A bola tem 35 mm e tem que
     caber DENTRO da cacamba, encostada na tampa externa. Dai sai todo o resto. */
  const el = GEOM.elevador, m = GEOM.magazine, pw = GEOM.calha.parede.v;
  d.elevR     = el.poliaD.v / 2 + el.esteiraE.v / 2;       // linha da esteira
  d.baldeOff  = d.bolaR + g.folga.v;                       // esteira -> centro da bola
  d.bolaRaio  = d.elevR + d.baldeOff;                      // raio do centro da bola
  d.baldeProf = d.baldeOff + d.bolaR;                      // fundo do copo: contem a bola
  d.tampaRaio = d.elevR + d.baldeProf;                      // face interna da tampa externa
  d.elevZ     = 2 * (d.tampaRaio + pw + g.folga.v);        // profundidade da coluna
  d.elevX     = P.num('geo.floor') / 2 - g.parede.v - el.colunaX.v / 2;
  d.elevZc    = -(P.num('geo.floor') / 2 - g.parede.v - d.elevZ / 2);
  d.elevV     = el.rpm.v / 60 * Math.PI * el.poliaD.v;     // velocidade linear da esteira

  /* ---- bandeja, retorno e PE do elevador.
     A bandeja escoa em DOIS caimentos: o principal (tremonha.incl) leva a bola ate a
     parede de +X; o secundario (tremonha.inclZ) a leva, ao longo dessa parede, ate o
     canto de tras. Ela sai do canto ja andando em -Z, que e a direcao da concha: e por
     isso que a calha de retorno e um trecho reto e curto, sem curva fechada e sem
     queda livre. O pe do elevador e o que sobra depois dessa queda. */
  const tr = GEOM.tremonha;
  d.zBandeja     = d.zJogo;                                // centro da bandeja em Z
  d.profBandeja  = d.lado / 2;
  d.xIniBandeja  = -d.interna / 2 + tr.parede.v;           // ponta alta
  d.xSaiBandeja  = d.elevX;                                // linha que a bola segue
  d.xBandejaFim  = d.xSaiBandeja + d.bolaR + g.folga.v;    // parede de +X: e ela que
                                                           // alinha a bola com a coluna
  d.zSaiBandeja  = d.zBandeja - d.profBandeja / 2;         // borda de tras = a saida
  d.kxBandeja    = Math.tan(tr.incl.v * Math.PI / 180);
  d.kzBandeja    = Math.tan(tr.inclZ.v * Math.PI / 180);
  d.nyBandeja    = 1 / Math.sqrt(1 + d.kxBandeja * d.kxBandeja + d.kzBandeja * d.kzBandeja);
  // superficie da chapa em qualquer ponto, medida da ponta alta
  d.ySupBandeja  = (x, z) => d.yBandeja1
    - d.kxBandeja * (x - d.xIniBandeja)
    - d.kzBandeja * (d.zBandeja + d.profBandeja / 2 - z);
  d.yBolaBandeja = (x, z) => d.ySupBandeja(x, z) + d.bolaR / d.nyBandeja;
  d.ySaiBandeja  = d.yBolaBandeja(d.xSaiBandeja, d.zSaiBandeja);   // centro da bola ao sair
  // a bola entra na concha exatamente no LABIO dela: nao ha trecho sem apoio entre a
  // calha e a chapa curva do elevador.
  d.aBocaConcha  = el.conchaIni.v * Math.PI / 180;
  d.yBocaConcha  = d.ySaiBandeja - GEOM.calha.quedaRetorno.v;
  d.yElevPe      = d.yBocaConcha - d.bolaRaio * Math.sin(d.aBocaConcha);

  /* ---- estacao de carga: e o BERCO que manda. Nada fixo pode entrar no volume que
     ele varre, e a bola entra rolando pelo lado aberto do copo, que e o lado -X. */
  d.rBerco = d.bolaR + g.folga.v + GEOM.soltura.bercoParede.v;
  d.xLoad  = -d.curso / 2;                                 // o carro A inverte aqui
  d.xComporta = d.xLoad - d.rBerco - g.folga.v;            // limite do que pode ser fixo
  d.magLargCarga = P.num('ball.d') + g.folga.v;            // tubo mais justo no ramo de
                                                           // carga: a parede de +X dele
                                                           // tem que morrer no limite
  d.xQueda = d.xComporta - (d.magLargCarga / 2 + m.tuboParede.v);
  d.yCarga = d.ySoltura + m.rampaCarga.v;                  // bola parada na comporta
  d.yMagSai = d.yCarga + m.rampaQueda.v;                   // saida do magazine

  /* ---- magazine: passo, passe e desnivel de escoamento saem da bola e da fila.
     O ultimo passe e mais longo que os outros: ele vai ate a vertical da comporta,
     e e esse comprimento que da o caimento para a bola rolar ate lá. */
  // abaixo de ~0,94·Ø a corda entre duas bolas da fila fica menor que o diametro
  // delas e a fila se interpenetra na curva. Ver arredonda().
  d.rCurva     = P.num('ball.d');
  d.magPasso   = P.num('ball.d') + g.folga.v;
  d.magPorPasse = Math.ceil(m.bolas.v / m.passos.v);
  d.magPasseL  = d.magPorPasse * d.magPasso;
  d.magDh      = L => L * Math.tan(m.incl.v * Math.PI / 180);
  d.magLarg    = P.num('ball.d') + 2 * GEOM.calha.folgaLat.v;   // vao interno do tubo
  // o +X do magazine para antes do motor do eixo A: os passes de baixo passam na
  // altura dele
  const md = CT.geom('motor').d;
  d.xMag = Math.min(d.elevX, d.xRail - (md.flange ? md.flange.v : md.corpoD.v) / 2 - g.folga.v
    - (P.num('ball.d') / 2 + m.tuboParede.v));
  d.magPasse0 = d.xMag - d.xQueda;                              // ultimo passe, mais longo
  d.yMagEntra = d.yMagSai + m.dy.v * (m.passos.v - 1) + d.magDh(d.magPasseL);
  /* o copo tomba em despejoAng e a bola sai um raio ACIMA do eixo da polia: e por isso
     que o topo do elevador pode ficar mais baixo que a entrada do tubo. */
  const aD = el.despejoAng.v * Math.PI / 180;
  d.yElevTopo = d.yMagEntra + P.num('ball.d') * 0.6 - d.bolaRaio * Math.sin(aD);
  return d;
}
// meia-altura da transmissao selecionada: a correia, o fuso e a cremalheira
// ocupam espessuras diferentes atras do carro. Sai do catalogo, nao daqui.
// quanto o carro avanca para tras do plano do trilho, por eixo
function fundoDoCarro(id) {
  return GEOM.eixo.carroLarg.v / 2;      // os dois carros levam a carga toda a frente
}
function trnRaio() {
  const t = CT.geom('transmissao'), d = t.d;
  if (t.kind === 'correia') return d.poliaFlange.v / 2;
  if (t.kind === 'fuso') return d.castanhaD.v / 2;
  return d.barraE.v / 2 + d.pinhaoDp.v / 2;
}
let D = derive();

/* --------------------------------------------------------------------------
   Materiais: CINZA = catalogo, CIANO = estimado. Sem textura, sem PBR.
   -------------------------------------------------------------------------- */
const COR = { cat: 0x9aa3ab, est: 0x2ad3d3, err: 0xff3b3b, vidro: 0x7fb6c4, sel: 0xffb020 };
const matCache = {};
function matFor(src, opts) {
  const key = src + '|' + JSON.stringify(opts || {});
  if (!matCache[key]) {
    matCache[key] = new THREE.MeshLambertMaterial(Object.assign({
      color: src === CAT ? COR.cat : COR.est
    }, opts || {}));
  }
  return matCache[key];
}
const matErr = new THREE.MeshLambertMaterial({ color: COR.err });
const matEdge = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
// a bola e peca estimada: entra no codigo de cor como qualquer outra

/* ---------------------------------------------------------------------------
   MODOS DE COR. O modo ENGENHEIRO-PROCEDENCIA e o codigo obrigatorio do projeto
   (cinza = cota publicada, ciano = cota estimada) e e o padrao. Os outros dois
   existem para ler a maquina de outro jeito e dizem, na legenda, que o codigo
   de procedencia esta desligado ali — quem manda na procedencia e o CSV.
   Cor nao e cota: estas tabelas nao levam flag CATALOGO/ESTIMADO.
   -------------------------------------------------------------------------- */
const PALETA_SUB = {
  'Gabinete': 0x7c8794, 'Eixo A': 0x38bdf8, 'Eixo B': 0xa78bfa, 'Soltura': 0xf472b6,
  'Buraco': 0xfb923c, 'Magazine': 0xfacc15, 'Elevador': 0x4ade80, 'Retorno de bolas': 0x2dd4bf,
  'Botões': 0xf87171, 'Telas': 0x94a3b8, 'Eletrônica': 0xc084fc, 'Iluminação': 0xfde68a,
  'Chicote': 0xfca5a5, 'Bolas': 0xf8fafc
};
// material real: [regex no nome da peca, cor, rotulo do material]
const MAT_REAL = [
  [/^Bola/, 0xeef6fa, 'bola'],
  [/^Vidro/, 0x8fb9cc, 'vidro'],
  [/Acrílico|Tubo do magazine|Calha de retorno/, 0xa9ccd8, 'acrílico'],
  [/Trilho linear|Carro MGN12H|Viga|Suporte de extremidade|Polia|Fuso|Mancal|Castanha|Cremalheira|Pinhão|Coluna do elevador/, 0xb7bec6, 'alumínio'],
  [/Motor|Solenoide|Micro-servo|Came|Falante|Amplificador/, 0x2f343a, 'corpo preto'],
  [/Correia|Esteira|Talisca|Chicote/, 0x1b1e22, 'borracha'],
  [/PCB|Raspberry|Pico|TMC2209|Encoder|Barreira|Sensor|Microswitch|MOSFET/, 0x176b3f, 'placa'],
  [/Capacitor/, 0x2f5fa8, 'capacitor'],
  [/Fonte Meanwell|Trilho DIN|Conversor/, 0xcfd4d9, 'aço'],
  [/Botão arcade Ø60/, 0xe0372c, 'botão de soltar'],
  [/Botão arcade Ø30/, 0xe8eef2, 'botão lateral'],
  [/Fita WS2812B/, 0xfff3cf, 'LED'],
  [/área ativa/, 0x12303a, 'tela'],
  [/Lateral|Fundo do gabinete|Teto|Piso|Frente da coluna|Testeira|Divisória|Painel de botões|Prateleira/, 0x262b31, 'gabinete'],
  [/moldura|Berço|Braço|Placa do carro|Garra|Boca|Flange|Rampa|Pino|Bandeja/, 0x3b4248, 'peça impressa'],
  [/./, 0x4a5157, 'chapa']
];
const TRANSP = { 'Vidro do campo de jogo': 0.14 };
const TRANSP_APRES = { vidro: /^Vidro/, chapa: /Acrílico|Tubo do magazine|Calha de retorno/ };
const LUZ_APRES = /área ativa|Fita WS2812B/;   // tela e LED sao fonte, nao superficie
let modoCor = 'procedencia';

function matDaPeca(part) {
  let cor, op = TRANSP[part.nome];
  if (modoCor === 'procedencia') cor = part.src === CAT ? COR.cat : COR.est;
  else if (modoCor === 'subsistema') cor = PALETA_SUB[part.sub] || COR.est;
  else {
    cor = (MAT_REAL.find(r => r[0].test(part.nome)) || [null, COR.cat])[1];
    if (TRANSP_APRES.vidro.test(part.nome)) op = 0.12;
    else if (TRANSP_APRES.chapa.test(part.nome)) op = 0.22;
  }
  const luz = modoCor === 'apresentacao' && LUZ_APRES.test(part.nome);
  const k = modoCor + '|' + cor + '|' + (op || 1) + (luz ? '|luz' : '');
  if (!matCache[k]) {
    const def = op ? { color: cor, transparent: true, opacity: op, side: THREE.DoubleSide }
                   : { color: cor, side: THREE.DoubleSide };
    matCache[k] = luz ? new THREE.MeshBasicMaterial(def) : new THREE.MeshLambertMaterial(def);
  }
  return matCache[k];
}
function aplicaModo() {
  PARTS.forEach(p => p.obj.traverse(m => {
    if (!m.isMesh) return;
    m.userData.matBase = matDaPeca(p);
    m.material = m.userData.matBase;
  }));
  const mb = matDaPeca({ nome: 'Bola acrílica', sub: 'Bolas', src: EST });
  BOLAS.forEach(b => { b.mesh.material = mb; b.mesh.userData.matBase = mb; });
  matEdge.opacity = modoCor === 'apresentacao' ? 0.18 : 0.35;
  aplicaDestaque();
  pintaLegenda();
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1113);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 20000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const wrap = document.getElementById('wrap');
wrap.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5';
wrap.appendChild(labelRenderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.09;
controls.screenSpacePanning = true;

/* ---- controle de camera para uma maquina de 1,7 m -------------------------------
   O padrao do OrbitControls e feito para dar a volta num objeto pequeno, e aqui ele
   atrapalhava de tres jeitos:
   1. sem limite de angulo, um arrasto de 200 px levava a camera de 72 para 165 graus,
      ou seja, 1,4 m ABAIXO do piso, olhando o fundo do gabinete. Na tela isso parece
      zoom, nao rotacao;
   2. a volta inteira cabia em uma altura de tela (2*pi por clientHeight), o que torna
      impossivel ajustar a vista com precisao;
   3. o arrasto vertical e invertido em relacao ao que se espera de um visualizador de
      maquina: arrastar para CIMA baixava a camera.
   Os dois primeiros sao opcao do proprio controle. O terceiro nao tem opcao: o evento
   e espelhado na vertical antes de o controle ve-lo. */
controls.minPolarAngle = 0.12;                 // 7 graus: nunca olhando de cima a pino
controls.maxPolarAngle = 1.52;                 // 87 graus: nunca por baixo do piso
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.8;
controls.panSpeed = 0.9;
controls.minDistance = P.num('geo.height') * 0.10;
controls.maxDistance = P.num('geo.height') * 4;
(function inverteArrastoVertical() {
  const el = renderer.domElement, meus = new WeakSet();
  let y0 = null;
  el.addEventListener('pointerdown', e => { if (e.button === 0) y0 = e.clientY; }, true);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
    el.addEventListener(t, () => { y0 = null; }, true));
  el.addEventListener('pointermove', e => {
    if (meus.has(e) || y0 === null || e.buttons !== 1) return;
    e.stopImmediatePropagation();              // o controle nao ve o original
    const espelhado = new PointerEvent('pointermove', {
      pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary,
      clientX: e.clientX, clientY: 2 * y0 - e.clientY, buttons: e.buttons,
      bubbles: true, cancelable: true
    });
    meus.add(espelhado);
    el.dispatchEvent(espelhado);
  }, true);
})();
/* A maquina e alta e o que interessa muda de altura: girar nao substitui subir a vista.
   Shift + roda e as setas deslocam camera e alvo juntos, sem mexer no angulo. */
function sobeVista(passo) {
  camera.position.y += passo; controls.target.y += passo;
  camManual(); controls.update();
}
renderer.domElement.addEventListener('wheel', e => {
  if (!e.shiftKey) return;
  e.preventDefault(); e.stopImmediatePropagation();
  sobeVista((e.deltaY > 0 ? -1 : 1) * D.alturaExt * 0.05);
}, { capture: true, passive: false });
