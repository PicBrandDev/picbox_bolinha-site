function buildEletronica() {
  const el = GEOM.eletronica, g = GEOM.gabinete;
  const larg = D.interna - el.corredor.v - el.corredorCabo.v, zc = 0;
  const cx = (el.corredorCabo.v - el.corredor.v) / 2;
  const add = (m, nome, src, dims) => { G.eletronica.add(reg(m, nome, 'Eletrônica', src, dims)); return m; };
  const prat = y => add(at(box(larg, el.prateleiraE.v, D.lado - 2 * g.parede.v, EST), cx, y - el.prateleiraE.v / 2, 0),
    'Prateleira da coluna', EST, dimsOf(larg, D.lado - 2 * g.parede.v, el.prateleiraE.v));

  prat(el.yFonte.v);
  add(at(box(el.fonteC.v, el.fonteA.v, el.fonteL.v, CAT), cx - larg / 2 + el.fonteC.v / 2 + g.folga.v,
    el.yFonte.v + el.fonteA.v / 2, zc), 'Fonte Meanwell LRS-150', CAT,
    dimsOf(el.fonteC.v, el.fonteL.v, el.fonteA.v));
  add(at(box(el.dinC.v, el.dinA.v, el.dinL.v, EST), cx + larg / 2 - el.dinC.v / 2 - g.folga.v,
    el.yFonte.v + el.dinA.v / 2, zc), 'Trilho DIN (disjuntor, fusíveis, filtro de linha)', EST,
    dimsOf(el.dinC.v, el.dinL.v, el.dinA.v));

  prat(el.yLogica.v);
  add(at(box(el.pcbC.v, el.pcbA.v, el.pcbL.v, EST), cx, el.yLogica.v + el.pcbA.v / 2, zc),
    'PCB de interface', EST, dimsOf(el.pcbC.v, el.pcbL.v, el.pcbA.v));
  add(at(box(el.rpiC.v, el.rpiA.v, el.rpiL.v, CAT), cx - el.pcbC.v / 2 - el.rpiC.v / 2 - g.folga.v,
    el.yLogica.v + el.rpiA.v / 2, zc), 'Raspberry Pi 4', CAT,
    dimsOf(el.rpiC.v, el.rpiL.v, el.rpiA.v) + ' (furos ' + U.fmt(el.rpiFuroX.v, 0) + ' × ' + U.fmt(el.rpiFuroY.v, 0) + ')');
  add(at(box(el.picoC.v, el.picoA.v, el.picoL.v, CAT), cx, el.yLogica.v + el.pcbA.v + el.picoA.v / 2,
    zc - el.pcbL.v / 4), 'Pico RP2040', CAT, dimsOf(el.picoC.v, el.picoL.v, el.picoA.v));
  [-1, 1].forEach(sx => add(at(box(el.tmcC.v, el.tmcA.v, el.tmcL.v, CAT), cx + sx * el.pcbC.v / 4,
    el.yLogica.v + el.pcbA.v + el.tmcA.v / 2, zc + el.pcbL.v / 4), 'Driver TMC2209', CAT,
    dimsOf(el.tmcC.v, el.tmcL.v, el.tmcA.v)));

  prat(el.yPotencia.v);
  [-1, 1].forEach(sx => add(at(box(el.dcdcC.v, el.dcdcA.v, el.dcdcL.v, EST),
    cx + sx * (el.dcdcC.v / 2 + g.folga.v), el.yPotencia.v + el.dcdcA.v / 2, zc),
    'Conversor DC-DC', EST, dimsOf(el.dcdcC.v, el.dcdcL.v, el.dcdcA.v)));
  add(at(box(el.ampC.v, el.ampA.v, el.ampL.v, EST), cx + larg / 2 - el.ampC.v / 2 - g.folga.v,
    el.yPotencia.v + el.ampA.v / 2, zc), 'Amplificador classe D', EST,
    dimsOf(el.ampC.v, el.ampL.v, el.ampA.v));
  [-1, 1].forEach(sx => add(at(cyl(el.falanteD.v, el.falanteA.v, EST, 'z'),
    cx + sx * (larg / 2 - el.falanteD.v), el.yFalante.v, D.lado / 2 - g.parede.v - el.falanteA.v / 2),
    'Falante Ø50', EST, dimsOf(el.falanteD.v, el.falanteD.v, el.falanteA.v)));
}

/* ============================================================================
   CHICOTE — so os troncos, sem terminal e sem trilho de cabo
   ========================================================================== */
function buildChicote() {
  const el = GEOM.eletronica, g = GEOM.gabinete;
  const lim = D.lado / 2 - g.parede.v - el.chicoteD.v;    // limite util para o tronco
  const cl = p => new THREE.Vector3(U.clamp(p[0], -lim, lim), U.clamp(p[1], el.chicoteD.v, D.alturaExt - el.chicoteD.v), U.clamp(p[2], -lim, lim));
  // sobe pelo corredor de cabo (-X), colado na parede de tras, e so depois cruza
  const xc = -(D.interna / 2 - el.corredorCabo.v / 2);
  const zc2 = -(D.lado / 2 - g.parede.v - el.chicoteD.v);
  const rotas = [
    [[xc, el.yLogica.v, 0], [xc, D.yTrilhoA, zc2], [D.xRail, D.yTrilhoA, D.trnZ('A')]],
    [[xc, el.yLogica.v, 0], [xc, D.yTrilhoB, zc2], [-D.xRail, D.yTrilhoB, D.trnZ('B')]],
    [[xc, el.yFonte.v, 0], [xc, (el.yFonte.v + g.painelY0.v) / 2, D.lado / 5], [0, g.painelY0.v - el.chicoteD.v, D.lado / 5]],
    [[xc, el.yLogica.v, 0], [xc, TELA.yc, zc2], [-TELA.mc / 2, TELA.yc, TELA.zFrente]]
  ];
  rotas.forEach(r => {
    // tensao zero = poligonal: a curva nao passa por fora dos pontos, e o tronco
    // fica dentro do envelope sem depender de sorte
    const curva = new THREE.CatmullRomCurve3(r.map(cl), false, 'catmullrom', 0);
    const m = new THREE.Mesh(new THREE.TubeGeometry(curva, 24, el.chicoteD.v / 2, 8, false), matFor(EST));
    G.chicote.add(reg(m, 'Tronco de chicote', 'Chicote', EST,
      dimsOf(el.chicoteD.v, el.chicoteD.v, curva.getLength())));
  });
}

/* ============================================================================
   ENVELOPE 450 x 450 x 1700 E VERIFICACAO DE INVASAO
   ========================================================================== */
const matEnv = new THREE.LineBasicMaterial({ color: 0x5a6a72 });
let envBox = null, OFENSORES = [], CHOQUES = [];
function buildEnvelope() {
  const w = D.lado, h = D.alturaExt;
  const geo = new THREE.BoxGeometry(w, h, w);
  const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geo), matEnv);
  wire.position.y = h / 2;
  G.envelope.add(wire);
  envBox = new THREE.Box3(new THREE.Vector3(-w / 2, 0, -w / 2), new THREE.Vector3(w / 2, h, w / 2));
  const lab = new CSS2DObject(rotulo('envelope ' + U.fmt(w, 0) + ' × ' + U.fmt(w, 0) + ' × ' + U.fmt(h, 0) + ' mm'));
  lab.position.set(0, h + GEOM.vista.cotaSeta.v * 3, 0); G.envelope.add(lab);
}
function rotulo(txt) { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = txt; return d; }

const TOL_ENV = 0.5;   // mm: abaixo disto e ruido de montagem, nao invasao
function checkEnvelope() {
  const found = {};
  // a verificacao mede a maquina montada: vista explodida nao conta como invasao
  const desloc = Object.keys(G).map(k => [G[k], G[k].position.clone()]);
  desloc.forEach(([g2]) => g2.position.set(0, 0, 0));
  [-D.curso / 2, D.curso / 2].forEach(x => {
    setCarros(x, x); root.updateMatrixWorld(true);
    PARTS.forEach(p => {
      const b = new THREE.Box3().setFromObject(p.obj);
      if (!isFinite(b.min.x)) return;
      const over = Math.max(
        envBox.min.x - b.min.x, b.max.x - envBox.max.x,
        envBox.min.y - b.min.y, b.max.y - envBox.max.y,
        envBox.min.z - b.min.z, b.max.z - envBox.max.z);
      if (over > TOL_ENV) {
        const k = p.nome;
        if (!found[k] || found[k].over < over) found[k] = { p, over };
      }
    });
  });
  desloc.forEach(([g2, pos]) => g2.position.copy(pos));
  root.updateMatrixWorld(true);
  OFENSORES = Object.keys(found).map(k => found[k]).sort((a, b) => b.over - a.over);
  return OFENSORES;
}

/* Interferencia peca-a-peca: duas pecas de subsistemas diferentes ocupando o
   mesmo volume. Encostar nao conta — so penetracao acima da tolerancia nos TRES
   eixos ao mesmo tempo, que e o que caracteriza volume comum. Peca do mesmo
   subsistema nao entra: ali o contato e de projeto (carro no trilho, componente
   na placa). Avaliado com os carros nos dois extremos do curso, como o envelope. */
const TOL_CHOQUE = 1.0;   // mm de penetracao a partir do qual e furo, nao encosto
// Dois subsistemas ficam fora da conta, e por motivo, nao por conveniencia:
// a bola tem que estar dentro de alguma guia o tempo todo — e o trabalho dela;
// o chicote e flexivel, a rota e indicativa e passa por onde o projeto abrir furo.
const SEM_CHOQUE = { 'Bolas': 1, 'Chicote': 1 };

// Caixa alinhada ao MUNDO nao serve aqui: calha, tubo e chicote sao diagonais, e a
// caixa de um diagonal longo cobre meia maquina. Cada malha vira uma caixa orientada
// (OBB) no seu proprio referencial; encolher a meia-dimensao em TOL/2 de cada lado
// transforma "intersecta" em "penetra mais de TOL".
function obbsDe(part) {
  const out = [];
  part.obj.traverse(m => {
    if (!m.isMesh) return;
    if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb = m.geometry.boundingBox;
    const meia = bb.getSize(new THREE.Vector3()).multiplyScalar(0.5).addScalar(-TOL_CHOQUE / 2);
    meia.set(Math.max(meia.x, 0.01), Math.max(meia.y, 0.01), Math.max(meia.z, 0.01));
    out.push(new THREE.OBB(bb.getCenter(new THREE.Vector3()), meia).applyMatrix4(m.matrixWorld));
  });
  return out;
}
function checkInterferencia() {
  const desloc = Object.keys(G).map(k => [G[k], G[k].position.clone()]);
  desloc.forEach(([g2]) => g2.position.set(0, 0, 0));
  const achados = {};
  [-D.curso / 2, D.curso / 2].forEach(x => {
    setCarros(x, x); root.updateMatrixWorld(true);
    const cx = PARTS.map(p => ({ p, b: new THREE.Box3().setFromObject(p.obj), obbs: null }))
      .filter(o => isFinite(o.b.min.x));
    for (let i = 0; i < cx.length; i++) {
      for (let j = i + 1; j < cx.length; j++) {
        const A = cx[i], B = cx[j];
        if (A.p.sub === B.p.sub) continue;
        if (SEM_CHOQUE[A.p.sub] || SEM_CHOQUE[B.p.sub]) continue;
        if (!A.b.intersectsBox(B.b)) continue;          // filtro barato antes do SAT
        if (!A.obbs) A.obbs = obbsDe(A.p);
        if (!B.obbs) B.obbs = obbsDe(B.p);
        const bate = A.obbs.some(oa => B.obbs.some(ob => oa.intersectsOBB(ob)));
        if (!bate) continue;
        const k = [A.p.nome, B.p.nome].sort().join(' × ');
        achados[k] = { k, a: A.p, b: B.p };
      }
    }
  });
  desloc.forEach(([g2, pos]) => g2.position.copy(pos));
  root.updateMatrixWorld(true);
  CHOQUES = Object.keys(achados).map(k => achados[k]).sort((a, b) => a.k.localeCompare(b.k));
  return CHOQUES;
}

/* Coerencia dimensional: o que nao e invasao de envelope mas torna a maquina
   impossivel de montar com os parametros correntes. */
function checkCoerencia() {
  const e = GEOM.eixo, g = GEOM.gabinete, av = [];
  if (Math.abs(D.recuoSupReal - e.recuoSup.v) > TOL_ENV)
    av.push('geo.sep (' + U.fmt(D.sep, 0) + ' mm) não fecha com geo.h (' + U.fmt(D.h, 0) +
      ' mm): recuo superior real ' + U.fmt(D.recuoSupReal, 1) + ' mm contra ' + U.fmt(e.recuoSup.v, 0) + ' mm de projeto.');
  if (D.bracoH <= 0) av.push('Recuo superior insuficiente: o berço não cabe abaixo do carro do eixo A.');
  if (D.vigaAltSup <= 0) av.push('Banda do eixo superior (' + U.fmt(g.bandaEixoSup.v, 0) +
    ' mm) não comporta trilho + carro + soltura com geo.sep atual.');
  if (D.vigaAltInf <= 0) av.push('Banda do eixo inferior (' + U.fmt(g.bandaEixoInf.v, 0) + ' mm) não comporta o conjunto.');
  if (D.yCampo1 > D.alturaExt) av.push('Campo de jogo ultrapassa a altura externa: reduza geo.h.');
  if (D.curso + e.carroComp.v > e.trilhoComp.v)
    av.push('Curso útil ' + U.fmt(D.curso, 0) + ' mm + carro não cabe no trilho de ' + U.fmt(e.trilhoComp.v, 0) + ' mm.');
  if (D.curso + P.num('geo.L') > D.interna)
    av.push('Curso útil + largura da boca (' + U.fmt(D.curso + P.num('geo.L'), 0) +
      ' mm) excede a largura interna útil de ' + U.fmt(D.interna, 0) + ' mm.');
  if (MAG && MAG.passeL > D.interna)
    av.push('Passe do magazine (' + U.fmt(MAG.passeL, 0) + ' mm) excede a largura interna útil.');
  // o tubo do magazine disputa profundidade com a coluna do elevador (atras) e com
  // o plano da correia do eixo A (a frente). As duas folgas sao verificadas aqui.
  const m = GEOM.magazine, meiaT = D.magLarg / 2 + m.tuboParede.v;
  const frenteColuna = D.elevZc + D.elevZ / 2;
  if (m.z.v - meiaT < frenteColuna + g.folga.v)
    av.push('Tubo do magazine invade a coluna do elevador: mova GEOM.magazine.z para ' +
      U.fmt(frenteColuna + g.folga.v + meiaT, 0) + ' mm ou mais.');
  if (m.z.v + meiaT > D.trnZ('A') + trnRaio() - g.folga.v)
    av.push('Tubo do magazine invade o plano da correia do eixo A: reduza GEOM.magazine.z.');
  if (m.dy.v < P.num('ball.d') + GEOM.calha.parede.v + g.folga.v)
    av.push('Desnível entre passes do magazine (' + U.fmt(m.dy.v, 0) +
      ' mm) menor que a altura do tubo: as paredes de dois passes se cruzam.');
  if (D.yElevTopo - D.yElevPe < P.num('ball.d') * 4)
    av.push('Curso do elevador (' + U.fmt(D.yElevTopo - D.yElevPe, 0) + ' mm) menor que ' +
      'quatro diâmetros: não sobra esteira útil entre as duas polias.');
  if (D.yElevPe - D.tampaRaio - GEOM.calha.parede.v < g.parede.v)
    av.push('Pé do elevador (' + U.fmt(D.yElevPe, 0) + ' mm) atravessa o piso do gabinete: ' +
      'reduza GEOM.calha.quedaRetorno.');
  if (D.yElevTopo + D.tampaRaio + GEOM.calha.parede.v > D.alturaExt - g.parede.v)
    av.push('Topo do elevador (' + U.fmt(D.yElevTopo, 0) + ' mm) mais a capa não cabem sob ' +
      'o teto: reduza GEOM.magazine.passos ou dy.');
  if (D.xQueda - (D.magLargCarga / 2 + m.tuboParede.v) < -D.interna / 2)
    av.push('Estação de carga fica fora da largura interna útil.');
  /* janela por onde o ramo de carga atravessa o plano dos trilhos: entre o topo do
     acrílico da tela e a base do mancal do trilho A. E a cota mais apertada do modelo. */
  if (TELA) {
    const topoAcr = TELA.yc + TELA.ma / 2;
    const baseMancal = D.yTrilhoA - e.suporteY.v / 2;
    const pisoTubo = D.yCarga - D.bolaR - GEOM.calha.parede.v;
    const tetoTubo = D.yCarga + D.bolaR;
    if (pisoTubo < topoAcr + g.folga.v)
      av.push('Ramo de carga (piso em ' + U.fmt(pisoTubo, 0) + ' mm) encosta no acrílico ' +
        'da tela (' + U.fmt(topoAcr, 0) + ' mm).');
    if (tetoTubo > baseMancal - g.folga.v)
      av.push('Ramo de carga (teto em ' + U.fmt(tetoTubo, 0) + ' mm) encosta no mancal do ' +
        'trilho A (' + U.fmt(baseMancal, 0) + ' mm): reduza GEOM.magazine.rampaQueda.');
  }
  /* Trechos que nao escoam. Com o piso de velocidade removido, a bola PARA onde a
     energia acaba — antes ela deslizava por cima do problema a 60 mm/s.
     O criterio NAO e geometrico: um trecho horizontal escoa se a bola chegar nele
     com velocidade sobrando, e e por isso que a travessia do plano dos trilhos
     funciona. Entao aqui se integra a MESMA fisica de avancaEmRota ao longo do
     caminho e se procura o ponto onde v chega a zero. */
  const gmm = P.num('env.g') * 1000, kIn = P.num('ball.ki'), mu = GEOM.calha.atrito.v;
  [[MAG && MAG.path, 'magazine', GEOM.calha.vBola.v],
   [CAL && CAL.path, 'calha de retorno', GEOM.calha.vBola.v]].forEach(function (par) {
    const pa = par[0], nome = par[1];
    if (!pa) return;
    let v = par[2], x = 0;
    const passo = Math.max(1, pa.total / 600);
    while (x < pa.total - passo) {
      const dir = pa.tangente(x), desce = -dir.y;
      const horiz = Math.sqrt(Math.max(0, 1 - desce * desce));
      const a = desce > 0.985 ? gmm : (gmm * desce - mu * gmm * horiz) / (1 + kIn);
      const v2 = v * v + 2 * a * passo;          // v² = v0² + 2·a·Δs
      if (v2 <= 0) {
        av.push('A bola para na ' + nome + ', a ' + U.fmt(x, 0) + ' mm do início do ' +
          'percurso (de ' + U.fmt(pa.total, 0) + ' mm): o caimento ali não vence a ' +
          'resistência de rolagem e não há velocidade sobrando da descida anterior.');
        return;
      }
      v = Math.sqrt(v2); x += passo;
    }
  });
  return av;
}

/* ============================================================================
   COTAS — linhas com valor em mm, vistas FRONTAL e CORTE_LATERAL
   ========================================================================== */
const cotaMat = new THREE.LineBasicMaterial({ color: 0x2ad3d3 });
let GF = null, GL = null;
function linha(pts) { return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), cotaMat); }
function cota(grp, a, b, txt, dir) {
  const A = new THREE.Vector3().fromArray(a), B = new THREE.Vector3().fromArray(b);
  const d = new THREE.Vector3().fromArray(dir).normalize().multiplyScalar(GEOM.vista.cotaSeta.v);
  grp.add(linha([A, B]));
  grp.add(linha([A.clone().add(d), A.clone().sub(d)]));
  grp.add(linha([B.clone().add(d), B.clone().sub(d)]));
  const lab = new CSS2DObject(rotulo(txt || (U.fmt(A.distanceTo(B), 0) + ' mm')));
  lab.position.copy(A).add(B).multiplyScalar(0.5); grp.add(lab);
}
function buildCotas() {
  const g = GEOM.gabinete, o = GEOM.vista.cotaOffset.v;
  GF = new THREE.Group(); GL = new THREE.Group();
  G.cotas.add(GF); G.cotas.add(GL);
  const zf = D.lado / 2 + o;                       // plano das cotas frontais
  cota(GF, [-D.lado / 2, -o / 2, zf], [D.lado / 2, -o / 2, zf], null, [0, 1, 0]);
  cota(GF, [-D.lado / 2 - o / 2, 0, zf], [-D.lado / 2 - o / 2, D.alturaExt, zf], null, [1, 0, 0]);
  cota(GF, [-D.interna / 2, D.yCampo1 + o / 3, zf], [D.interna / 2, D.yCampo1 + o / 3, zf],
    'largura interna útil ' + U.fmt(D.interna, 0) + ' mm', [0, 1, 0]);
  cota(GF, [-D.curso / 2, D.ySoltura + o / 6, zf], [D.curso / 2, D.ySoltura + o / 6, zf],
    'curso útil ' + U.fmt(D.curso, 0) + ' mm', [0, 1, 0]);
  cota(GF, [D.lado / 2 + o / 3, D.yBoca, zf], [D.lado / 2 + o / 3, D.ySoltura, zf],
    'queda ' + U.fmt(D.h, 0) + ' mm', [1, 0, 0]);
  cota(GF, [-D.lado / 2 - o / 2, D.yTrilhoB, zf], [-D.lado / 2 - o / 2, D.yTrilhoA, zf],
    'entre trilhos ' + U.fmt(D.sep, 0) + ' mm', [1, 0, 0]);
  cota(GF, [-D.lado / 2 - o / 5, g.campoY0.v, zf], [-D.lado / 2 - o / 5, D.yCampo1, zf],
    'campo ' + U.fmt(D.yCampo1 - g.campoY0.v, 0) + ' mm', [1, 0, 0]);

  const xl = -D.lado / 2 - o;                      // plano das cotas laterais
  cota(GL, [xl, -o / 2, -D.lado / 2], [xl, -o / 2, D.lado / 2], null, [0, 1, 0]);
  [[0, g.painelY0.v, 'coluna'], [g.painelY0.v, g.campoY0.v, 'painel'],
   [g.campoY0.v, D.yCampo1, 'campo'], [D.yCampo1, D.alturaExt, 'testeira']]
    .forEach((f, i) => cota(GL, [xl, f[0], -D.lado / 2 - (i % 2) * o / 3], [xl, f[1], -D.lado / 2 - (i % 2) * o / 3],
      f[2] + ' ' + U.fmt(f[1] - f[0], 0) + ' mm', [0, 0, 1]));
  cota(GL, [xl, D.ySoltura, g.planoTrilhoZ.v], [xl, D.ySoltura, TELA.zFrente],
    'recuo da tela ' + U.fmt(GEOM.telas.campoRecuo.v, 0) + ' mm', [0, 1, 0]);
  cota(GL, [xl, D.yBoca, -P.num('geo.depth') / 2], [xl, D.yBoca, P.num('geo.depth') / 2],
    'boca ' + U.fmt(P.num('geo.depth'), 0) + ' mm', [0, 1, 0]);
}

/* ============================================================================
   ESTADO — o mundo fisico e o MESMO do simulador: M.buildWorld / M.evalPress.
   Nada de formula reescrita aqui. Arrasto, latencia de cadeia e jitter entram
   porque estao no conjunto de parametros, nao porque este arquivo os repete.
   Nota de projeto: com esta geometria o arrasto vale ~0,4 % do peso da bola
   (a prova esta na aba Engenharia do simulador); o parametro sim.drag decide.
   ========================================================================== */
const SOL = {};
let ALVO = null;   // estado do alvo: anel, portinhola e instante do ultimo acerto
let W = null, EIXO_A = null, EIXO_B = null, SEL = null, selNome = null;
let tMaq = 0, TIRO = null, ULTIMO = null, BOLAS = [], rodando = true;
let orientTela = 'paisagem', explode = 0, mostraCotas = false;
const rnd = U.rng(P.num('sim.seed'));

function limparGrupo(g) {
  while (g.children.length) {
    const c = g.children[0]; g.remove(c);
    c.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
}
function setCarros(xA, xB) {
  if (EIXO_A) EIXO_A.carro.position.x = xA;
  if (EIXO_B) EIXO_B.carro.position.x = xB;
}

function rebuild() {
  D = derive();
  W = M.buildWorld();
  PARTS = [];
  Object.keys(G).forEach(k => limparGrupo(G[k]));
  buildGabinete(); buildVidro();
  EIXO_A = buildEixo('A'); EIXO_B = buildEixo('B');
  buildTelas(orientTela);
  buildMagazine(); buildElevador(); buildCalhas();
  buildBotoes(); buildEletronica(); buildChicote();
  buildEnvelope(); buildCotas();
  criarBolas();
  aplicaToggles(); aplicaExplode();
  passoBolas(0); moveCacambas();          // sem isto a verificacao mede a pose zero
  checkEnvelope(); checkInterferencia();
  setCarros(0, 0);
  SEL = selNome ? PARTS.filter(p => p.nome === selNome)[0] || null : null;
  aplicaModo(); pintaColisao(); pintaFicha();
}

/* ---- bolas em circulacao ---------------------------------------------------
   Estados: mag (fila do magazine) -> carga -> berco -> voo -> bandeja ->
   calha -> elev -> mag. So o estado 'voo' usa fisica; o resto e transporte. */
function criarBolas() {
  BOLAS.forEach(b => { if (b.mesh.parent) b.mesh.parent.remove(b.mesh); });
  BOLAS = [];
  const n = MAG.capacidade;
  for (let i = 0; i < n; i++) {
    const mesh = ball(P.num('ball.d'));
    root.add(mesh);
    BOLAS.push({ mesh, st: i === 0 ? 'berco' : 'mag', slot: i - 1, s: 0, t0: 0, balde: -1 });
    if (i) mesh.userData.p = BOLAS[0].mesh.userData.p;   // clicar em qualquer bola abre a mesma ficha
  }
  reg(BOLAS[0].mesh, 'Bola acrílica Ø' + U.fmt(P.num('ball.d'), 0), 'Bolas', EST,
    'Ø' + U.fmt(P.num('ball.d'), 0) + ' mm, ' + U.fmt(P.num('ball.m'), 0) + ' g', n);
}
function bolaNoBerco() { return BOLAS.filter(b => b.st === 'berco')[0]; }
function filaMag() { return BOLAS.filter(b => b.st === 'mag').sort((a, b) => a.slot - b.slot); }

function passoBolas(dt) {
  const xCarroA = EIXO_A.carro.position.x, xCarroB = EIXO_B.carro.position.x;
  const zJogo = D.zJogo, bolaD = P.num('ball.d'), m = GEOM.magazine;
  const fila = filaMag();
  fila.forEach((b, i) => { b.slot = i; });
  // quantas bolas ja ocupam o fundo do elevador: e o que limita quem vem na calha
  const nFila = BOLAS.filter(b => b.st === 'espera' || b.st === 'concha').length;
  const bercoPos = new THREE.Vector3(xCarroA, D.ySoltura, zJogo);

  BOLAS.forEach(b => {
    switch (b.st) {
      // fila do magazine: cada bola tem um lugar, e ROLA ate ele quando a fila
      // anda. Sem isso a fila inteira salta um passo a cada bola consumida.
      case 'mag': {
        const alvoS = MAG.sSaida - MAG.passo * (b.slot + 1.5);
        if (b.sFila === undefined) b.sFila = alvoS;
        const passo2 = m.vFila.v * dt;
        b.sFila += U.clamp(alvoS - b.sFila, -passo2, passo2);
        b.mesh.position.copy(MAG.path.at(b.sFila));
        break;
      }

      // a came do escapement gira meia volta: um dedo solta ESTA bola e o outro
      // segura a fila. A bola so anda depois que o dedo saiu da frente dela.
      case 'pronta': {
        if (b.sFila === undefined) b.sFila = MAG.sSaida - MAG.passo;
        if (tMaq - MAG.libera < m.tCame.v * 0.45) break;
        const passo3 = m.vFila.v * dt;
        b.sFila += U.clamp(MAG.sSaida - b.sFila, -passo3, passo3);
        b.mesh.position.copy(MAG.path.at(b.sFila));
        if (b.sFila >= MAG.sSaida - 0.5) {
          b.st = 'desce'; b.s = MAG.sSaida; b.v = 0; b.rota = MAG.path;
        }
        break;
      }

      // desce o tubo de carga por gravidade e PARA na comporta fechada
      case 'desce': {
        avancaEmRota(b, dt);
        if (b.s >= MAG.sComporta) {
          b.s = MAG.sComporta; b.v = 0; b.st = 'retido';
          b.mesh.position.copy(MAG.path.at(b.s));
        }
        break;
      }

      /* ESPERA NA COMPORTA — a bola fica visivel, encostada na chapa, ate o carro A
         inverter o curso logo abaixo dela. E o unico instante em que o berco esta
         parado o bastante para receber: e por isso que a maquina carrega no fim do
         curso, e nao em qualquer lugar. */
      case 'retido': {
        b.mesh.position.copy(MAG.pComporta);
        const alinhado = Math.abs(xCarroA - MAG.xLoad) <= m.tolCarga.v &&
                         Math.abs(velCarroA()) <= m.vCarga.v;
        if (alinhado && !bolaNoBerco() && !BOLAS.some(o => o.st === 'assento')) MAG.cmd = 1;
        if (MAG.gate > 0.7) { b.st = 'carga'; b.v = 0; }
        break;
      }

      /* CARGA — a comporta deitada e a rampa. A bola rola por cima dela, atravessa
         2 mm de vao e cai na aba do berco. Ninguem a move para lugar nenhum. */
      case 'carga': {
        const fim = avancaEmRota(b, dt);
        if (b.mesh.position.x >= xCarroA - D.bolaR || fim) {
          b.st = 'assento'; b.t0 = tMaq;
          b.off = b.mesh.position.clone().sub(bercoPos);
          SOL.travaEm = tMaq; MAG.cmd = 0;
        }
        break;
      }

      // assentamento: a bola rola da aba para o fundo do copo, que e o unico
      // deslocamento curto que sobra. Ela segue o carro desde o primeiro instante.
      case 'assento': {
        const f = U.clamp((tMaq - b.t0) / GEOM.soltura.tAssento.v, 0, 1);
        b.mesh.position.copy(bercoPos).addScaledVector(b.off, 1 - f * f * (3 - 2 * f));
        if (f >= 1) b.st = 'berco';
        break;
      }

      case 'berco':
        b.mesh.position.copy(bercoPos);
        break;

      case 'voo': {
        if (!TIRO) { b.st = 'trem'; iniciaTremonha(b); break; }
        const tau = tMaq - TIRO.ev.tRel;
        if (tau < 0) { b.mesh.position.copy(bercoPos); break; }
        const pt = TIRO.pos(tau);
        b.mesh.position.set(TIRO.x0 + pt.x, D.ySoltura - pt.y, zJogo);
        if (tau >= TIRO.ev.tf) {
          ULTIMO = TIRO.ev;
          // entrou: atravessa o furo e segue caindo, empurrando a portinhola.
          // errou: bate na chapa-alvo e escorrega pela borda antes de cair.
          if (TIRO.ev.hit) ALVO.aceso = tMaq;
          b.st = 'trem';
          iniciaTremonha(b, TIRO.ev.hit ? null : xCarroB, TIRO.vImpacto);
          TIRO = null; pintaHud();
        }
        break;
      }

      case 'trem':
        if (avancaEmRota(b, dt)) { b.st = 'calha'; b.s = 0; b.rota = CAL.path; }
        break;

      // a calha tambem e o acumulador: se ja ha bola esperando o copo, a que vem
      // atras PARA encostada nela, dentro da calha. Nao existe bola sobreposta.
      case 'calha': {
        const chegou = avancaEmRota(b, dt);
        const lim = nFila === 0 ? ELEV.rotaFila.total           // primeiro lugar livre
          : Math.max(0, ELEV.sFila1 - (nFila - 1) * D.magPasso);
        if (b.s > lim) { b.s = Math.max(0, lim); b.v = 0; b.mesh.position.copy(b.rota.at(b.s)); }
        else if (chegou) { b.st = 'concha'; b.s = 0; b.rota = ELEV.rotaConcha; }
        break;
      }

      // dentro da concha: rola pela chapa curva ate o fundo dela
      case 'concha':
        if (avancaEmRota(b, dt)) { b.st = 'espera'; b.v = 0; b.tEspera = tMaq; b.sFila = undefined; }
        break;

      // fundo da concha, exatamente na linha que o copo varre
      case 'espera':
        // A primeira fica no ponto de espera, que e onde o copo passa com velocidade
        // relativa zero. As que chegaram depois NAO podem ocupar o mesmo ponto:
        // ficam enfileiradas atras, na propria concha, e andam quando a da frente sai.
        {
          const fe = BOLAS.filter(q => q.st === 'espera')
            .sort((q, w2) => (q.tEspera || 0) - (w2.tEspera || 0));
          const j = Math.max(0, fe.indexOf(b));
          const rf = ELEV.rotaFila;
          const alvoS = j === 0 ? rf.total
            : Math.max(0, ELEV.sFila1 - (j - 1) * D.magPasso);
          if (b.sFila === undefined) b.sFila = alvoS;      // entrou ja no ponto de espera
          const passo2 = GEOM.magazine.vFila.v * dt;
          b.sFila += U.clamp(alvoS - b.sFila, -passo2, passo2);
          b.mesh.position.copy(rf.at(b.sFila));
        }
        break;

      /* VARRIDA E SUBIDA — a bola encosta na chapa de tras do copo e na capa
         externa. Nas curvas ela gira no mesmo angulo do copo, num raio maior:
         por isso ela nao atravessa a capa nem flutua dentro do copo. */
      case 'captura':
      case 'balde': {
        const c = ELEV.cacambas[b.balde];
        b.mesh.position.copy(pontoNaCacamba(c));
        const sc = c.userData.s;
        if (b.st === 'captura' && sc < ELEV.sTopo0) b.st = 'balde';
        // despejo: a capa do topo acaba, a aba do copo passa da horizontal e a bola
        // rola para fora. Quem solta e a geometria, nao um cronometro.
        if (b.st === 'balde' && sc >= ELEV.sDespejo && sc <= ELEV.sTopo1) {
          b.st = 'descarga'; b.s = 0; b.v = GEOM.calha.vBola.v * 0.3;
          b.rota = ELEV.rotaEntrega; b.balde = -1;
        }
        break;
      }

      case 'descarga':
        if (avancaEmRota(b, dt)) { b.st = 'mag'; b.slot = 1e6; b.sFila = MAG.path.acc[0]; }
        break;
    }
  });

  /* a bola do fundo da concha e recolhida pelo copo que PASSA por ela: o gatilho e
     o assento do copo cruzar o angulo em que ela esta parada, e nesse instante os
     dois pontos coincidem. Nao ha salto porque nao ha troca de posicao. */
  const esperando = BOLAS.filter(b => b.st === 'espera')
    .sort((a, b) => (a.tEspera || 0) - (b.tEspera || 0))[0];
  if (esperando) {
    for (let i = 0; i < ELEV.cacambas.length; i++) {
      const c = ELEV.cacambas[i];
      if (BOLAS.some(b => b.balde === i && (b.st === 'balde' || b.st === 'captura'))) continue;
      // o gatilho e o assento do copo COINCIDIR com a bola onde ela estiver — nao um
      // angulo fixo. Assim ela e recolhida mesmo ainda rolando para o fundo, e nao ha
      // salto: no quadro da troca os dois pontos ja sao o mesmo ponto.
      if (anguloDoAssento(c) !== null &&
          pontoNaCacamba(c).distanceTo(esperando.mesh.position) < D.bolaR * 0.6) {
        esperando.st = 'captura'; esperando.balde = i; break;
      }
    }
  }

  // escapement: libera UMA bola quando nao ha nenhuma no ramo de carga
  const noRamo = b => b.st === 'pronta' || b.st === 'desce' || b.st === 'retido' ||
                      b.st === 'carga' || b.st === 'assento';
  if (!bolaNoBerco() && !BOLAS.some(noRamo)) {
    const prox = filaMag()[0];
    if (prox) { prox.st = 'pronta'; prox.s = 0; MAG.libera = tMaq; }
  }
}

// velocidade instantanea do carro A, do MESMO perfil que o simulador usa
function velCarroA() {
  const h = 0.004;
  return (W.axA.pos(tMaq + h) - W.axA.pos(tMaq - h)) / (2 * h);
}
// angulo do assento do copo em torno da polia de baixo; null fora da curva de baixo
function anguloDoAssento(c) {
  if (c.userData.s === undefined || c.userData.s < ELEV.sFundo0) return null;
  const p = pontoNaCacamba(c);
  return Math.atan2(p.y - ELEV.y0, p.z - ELEV.z);
}

/* Percurso sobre uma rota: a velocidade NAO e constante. Ela sai da inclinacao
   local da rota, com atrito de rolagem — e o que faz a queda acelerar e o trecho
   quase horizontal arrastar. Deterministico e estavel: integra so v e s. */
function avancaEmRota(b, dt) {
  const c = GEOM.calha, g = P.num('env.g') * 1000;         // mm/s2, do conjunto de parametros
  const dir = b.rota.tangente(b.s);
  const desce = -dir.y;                                     // 1 = queda livre, 0 = plano
  const horiz = Math.sqrt(Math.max(0, 1 - desce * desce));
  // Trecho quase vertical a bola nao esta apoiada em nada: e queda livre, a = g.
  // Apoiada, ela ROLA — a inercia de rotacao divide a aceleracao por (1 + k), com
  // k = ball.ki (0,400 para esfera macica). Tratar bola como bloco deslizante a faz
  // descer 40 % rapido demais.
  const k = P.num('ball.ki');
  const a = desce > 0.985 ? g : (g * desce - c.atrito.v * g * horiz) / (1 + k);
  // teto so para manter a integracao estavel; sai da propria altura do gabinete
  b.v = Math.min((b.v === undefined ? c.vBola.v : b.v) + a * dt, Math.sqrt(2 * g * D.alturaExt));
  if (b.v <= 0) {                     // sem caimento que venca a resistencia de rolagem
    b.v = 0;                          // a bola PARA. checkCoerencia aponta o trecho.
    return b.s >= b.rota.total;
  }
  b.s += b.v * dt;
  b.mesh.position.copy(b.rota.at(b.s));
  return b.s >= b.rota.total;
}

// rota da bola ate a saida da tremonha. Se errou, ela primeiro escorrega pela
// chapa-alvo ate a borda — quem assiste ve a bola BATER, nao atravessar.
/* Onde a bola fica quando o copo a carrega. Dois regimes, porque sao duas
   restricoes fisicas diferentes:
   - nos trechos retos ela encosta na chapa de tras do copo e na tampa externa;
   - nas curvas a tampa e um arco, e a bola nao pode atravessa-la: a defasagem em
     relacao ao copo passa a ser ANGULAR, no raio dela.
   A troca entre os dois e gradual ao longo de 40 mm, que e a bola rolando para tras
   dentro do copo conforme ele entra na curva. */
function pontoNaCacamba(c) {
  const u = c.userData, dT = D.bolaR + GEOM.gabinete.folga.v, dR = D.bolaRaio - D.elevR;
  const reta = c.position.clone().addScaledVector(u.t, dT).addScaledVector(u.out, dR);
  if (!u.cen || !u.kArc) return reta;
  // A direcao radial sai da POSICAO do copo, nao da tangente da poligonal: a poligonal
  // tem canto a cada segmento, e usar a tangente dela faria a bola pular de canto em
  // canto. E o angulo vem do seno, porque o que vale bolaR e a distancia da bola ao
  // plano do fundo do copo, nao o arco.
  const rad = c.position.clone().sub(u.cen).normalize();
  const tang = new THREE.Vector3(0, -rad.z, rad.y);
  const da = Math.asin(U.clamp(dT / D.bolaRaio, -1, 1));
  const curva = u.cen.clone()
    .addScaledVector(rad, D.bolaRaio * Math.cos(da))
    .addScaledVector(tang, D.bolaRaio * Math.sin(da));
  return reta.lerp(curva, u.kArc);
}
function iniciaTremonha(b, xChapa, vChegada) {
  const p0 = b.mesh.position.clone(), pts = [];
  const naChapa = xChapa !== null && xChapa !== undefined && ALVO;
  if (naChapa) {
    // o voo termina com o CENTRO no plano da boca, que e onde o criterio e avaliado.
    // Quem erra pousa EM CIMA da chapa: sobe um raio, senao a bola escorrega com
    // meio corpo dentro do aluminio.
    p0.y = ALVO.yFuro + GEOM.boca.anelFio.v + D.bolaR;
  }
  pts.push(p0);
  if (naChapa) {
    const lado = p0.x >= xChapa ? 1 : -1;
    const xBorda = xChapa + lado * (ALVO.chapaC / 2 + D.bolaR);
    if (Math.abs(p0.x - xChapa) < ALVO.chapaC / 2 + D.bolaR) {
      pts.push(new THREE.Vector3(xBorda, p0.y - D.bolaR * 0.2, p0.z));
    }
  }
  const ult = pts[pts.length - 1];
  // pousa na bandeja onde caiu, atravessa ate a guia de +X e desce por ela ate o canto
  pts.push(TREM.ponto(ult.x, ult.z), TREM.ponto(D.xSaiBandeja, ult.z), TREM.saida());
  // concordancia tambem aqui: a bola nao vira de direcao num ponto ao deixar a chapa
  const limpos = pts.filter((q, i) => i === 0 || q.distanceTo(pts[i - 1]) > 0.5);
  b.rota = polyPath(arredonda(limpos, Math.min(D.rCurva, D.bolaR * 1.2), 8));
  b.s = 0;
  // a bola CHEGA com a velocidade que a queda deu. Zerar aqui apagaria 97 % dela num
  // quadro; o que se perde no impacto e o componente normal, nao tudo.
  b.v = Math.max(0, (vChegada || 0) * GEOM.calha.restImpacto.v);
  b.mesh.position.copy(b.rota.at(0));   // sem isto o quadro da troca mostra a pose velha
}

/* ---- soltura --------------------------------------------------------------- */
function soltar() {
  if (TIRO || !bolaNoBerco()) return;
  const jit = P.num('sim.macjit') ? rnd.normal(0, W.sigT) : 0;
  const ev = M.evalPress(W, tMaq, jit);
  const f = PH.flight(Object.assign({}, W.flightBase, { vx0: ev.v0 / 1000 }));
  // integracao ja feita pela engine: aqui so se le a trajetoria, em mm
  const path = f.path;
  TIRO = {
    ev, x0: ev.xRel - D.curso / 2, vImpacto: f.vImpact * 1000,
    pos(tau) {
      let i = 0; while (i < path.length - 2 && path[i + 1][2] < tau) i++;
      const a = path[i], b = path[i + 1];
      const fr = U.clamp((tau - a[2]) / Math.max(1e-9, b[2] - a[2]), 0, 1);
      return { x: 1000 * U.lerp(a[0], b[0], fr), y: 1000 * U.lerp(a[1], b[1], fr) };
    }
  };
  const bola = bolaNoBerco(); bola.st = 'voo';
  pintaHud();
}

/* ============================================================================
   VISTAS, TOGGLES E EXPLODIDA
   ========================================================================== */
function distParaEnquadrar(raio) {
  const fv = camera.fov * Math.PI / 360;
  const fh = Math.atan(Math.tan(fv) * Math.max(0.4, camera.aspect));
  return 1.12 * raio / Math.sin(Math.min(fv, fh));
}
function camerasPreset() {
  const meio = D.alturaExt / 2;
  const R = Math.hypot(D.lado / 2, D.lado / 2, meio);      // esfera do envelope
  const d = distParaEnquadrar(R);
  const xE = D.elevX, zE = D.elevZc, yE = (D.yElevTopo + D.yElevPe) / 2;
  const dir = (v, t) => ({ p: [t[0] + v[0] * d, t[1] + v[1] * d, t[2] + v[2] * d], t });
  const n = (a, b, c) => { const m = Math.hypot(a, b, c); return [a / m, b / m, c / m]; };
  return {
    // enquadra de uma vez: eixo B, furo, bandeja, calha, elevador, topo e eixo A
    APRESENTACAO: (() => {
      const t = [0, meio + D.lado / 6, 0], u = n(0.78, 0.38, 0.92), dd = d * 0.78;
      return { p: [t[0] + u[0] * dd, t[1] + u[1] * dd, t[2] + u[2] * dd], t };
    })(),
    FRONTAL_JOGADOR: dir([0, 0, 1], [0, meio, 0]),
    ISOMETRICA: dir(n(0.72, 0.48, 0.82), [0, meio, 0]),
    TOPO: dir([0, 1, 0.001], [0, meio, 0]),
    CORTE_LATERAL: dir([1, 0, 0], [0, meio, 0]),
    // segue o carro A: sem isto o detalhe da soltura so mostra o mecanismo
    // quando o carro passa por acaso na frente da camera
    DETALHE_SOLTURA: { p: [95, D.ySoltura + 25, D.zJogo + 265], t: [0, D.ySoltura - 15, D.zJogo], segue: 'A' },
    DETALHE_ELEVADOR: (() => {
      // enquadra a coluna INTEIRA mais a boca da concha: com o pe logo abaixo da
      // bandeja o alvo e curto, e o fator antigo punha a camera dentro do gabinete
      const t = [xE, yE, zE], dE = distParaEnquadrar((D.yElevTopo - D.yBocaConcha) * 0.75);
      const u = n(0.55, 0.18, 0.82);
      return { p: [t[0] + u[0] * dE, t[1] + u[1] * dE, t[2] + u[2] * dE], t };
    })()
  };
}
let vistaAtual = 'APRESENTACAO';
const SEGUE = { on: false, x: 0 };
function irPara(nome) {
  const c = camerasPreset()[nome]; if (!c) return;
  vistaAtual = nome;
  const dx = c.segue ? (c.segue === 'A' ? EIXO_A : EIXO_B).carro.position.x : 0;
  SEGUE.on = !!c.segue; SEGUE.x = dx;
  camera.position.set(c.p[0] + dx, c.p[1], c.p[2]);
  controls.target.set(c.t[0] + dx, c.t[1], c.t[2]);
  controls.update();
  vistaCotas();
  U.$$('#camBar .btn').forEach(b => b.classList.toggle('on', b.dataset.cam === nome));
}
const TOG = { gabinete: false, vidro: true, telas: true, eletronica: true, chicote: false, envelope: true, cotas: false };
function aplicaToggles() {
  Object.keys(SUB).forEach(k => {
    const t = SUB[k].tog, vis = t ? !!TOG[t] : true;
    G[k].visible = vis;
    G[k].traverse(o => { if (o.isCSS2DObject) o.visible = vis; });
  });
  mostraCotas = !!TOG.cotas;
  vistaCotas();
}
// cota so faz sentido na vista ortogonal a que ela foi desenhada
function vistaCotas() {
  const f = mostraCotas && vistaAtual === 'FRONTAL_JOGADOR', l = mostraCotas && vistaAtual === 'CORTE_LATERAL';
  [[GF, f], [GL, l]].forEach(([g2, v]) => {
    if (!g2) return;
    g2.visible = v; g2.traverse(o => { if (o.isCSS2DObject) o.visible = v; });
  });
}
function aplicaExplode() {
  const k = explode * GEOM.vista.explodeMax.v;
  Object.keys(G).forEach(n => G[n].position.copy(G[n].userData.dir).multiplyScalar(k));
}

/* ============================================================================
   PAINEIS
   ========================================================================== */
const el = (h, host) => { const d = document.createElement('div'); d.innerHTML = h; host.appendChild(d.firstElementChild); return host.lastElementChild; };
function linhaRange(host, rot, min, max, step, val, fmtv, onIn) {
  const r = el('<div class="row"><label>' + rot + '</label><input type="range"><span class="val"></span></div>', host);
  const inp = r.querySelector('input'), out = r.querySelector('.val');
  inp.min = min; inp.max = max; inp.step = step; inp.value = val;
  const upd = () => { out.textContent = fmtv(+inp.value); };
  inp.addEventListener('input', () => { upd(); onIn(+inp.value); });
  upd(); return { inp, out, upd };
}
function linhaSelect(host, rot, ops, val, onCh) {
  const r = el('<div class="row"><label>' + rot + '</label><select></select></div>', host);
  const sel = r.querySelector('select');
  ops.forEach(o => { const op = document.createElement('option'); op.value = o.v !== undefined ? o.v : o; op.textContent = o.t !== undefined ? o.t : o; sel.appendChild(op); });
  sel.value = val;
  sel.addEventListener('change', () => onCh(sel.value));
  return sel;
}
function linhaCheck(host, rot, val, onCh) {
  const r = el('<div class="row"><label>' + rot + '</label><input type="checkbox"></div>', host);
  const c = r.querySelector('input'); c.checked = val;
  c.addEventListener('change', () => onCh(c.checked));
  return c;
}

// velocidade de pico <-> periodo: a conversao vive em physics.js, nunca aqui
function cfgEixo(id) {
  return {
    stroke: P.num(id + '.stroke'), phaseDeg: P.num(id + '.phase'), profile: P.get(id + '.prof'),
    aPeak: P.num(id + '.aPeak'), jerk: P.num(id + '.jerk'), table: P.customTable()[id]
  };
}
function vPicoDe(id) { return PH.makeAxis(Object.assign(cfgEixo(id), { T: P.num(id + '.T') })).meta.vPeak / 1000; }
function setVPico(id, vms) {
  const d = P.def(id + '.T');
  P.set(id + '.T', U.clamp(PH.periodForPeakSpeed(cfgEixo(id), vms * 1000, d.min, d.max), d.min, d.max));
}

let refs = {};
function montaPainel() {
  const host = document.getElementById('left'); host.innerHTML = '';
  el('<h4>Parâmetros</h4>', host);
  const e = GEOM.eixo;
  ['A', 'B'].forEach(id => {
    refs['v' + id] = linhaRange(host, 'veloc. ' + id + ' (m/s)', e.vMin.v, e.vMax.v, 0.01, vPicoDe(id),
      v => U.fmt(v, 2) + ' m/s', v => { setVPico(id, v); depoisDeParam(true); });
    refs['T' + id] = el('<div class="kv"><span class="u">curso ' + id + ' (ida)</span><b>—</b></div>', host);
    linhaSelect(host, 'perfil ' + id, P.def(id + '.prof').o, P.get(id + '.prof'),
      v => { P.set(id + '.prof', v); refs['v' + id].inp.value = vPicoDe(id); refs['v' + id].upd(); depoisDeParam(true); });
  });
  const dPh = P.def('B.phase');
  linhaRange(host, 'defasagem (°)', dPh.min, dPh.max, dPh.step, P.num('B.phase'),
    v => U.fmt(v, 0) + '°', v => { P.set('B.phase', v); depoisDeParam(true); });
  const dH = P.def('geo.h');
  linhaRange(host, 'queda (mm)', 100, 600, dH.step, P.num('geo.h'),
    v => U.fmt(v, 0) + ' mm', v => {
      P.set('geo.h', v);
      if (refs.travaSep.checked) P.set('geo.sep', v + GEOM.eixo.recuoSup.v + GEOM.eixo.recuoInf.v);
      depoisDeParam(true);
    });
  refs.travaSep = linhaCheck(host, 'travar geo.sep', true, () => { });
  const dJ = P.def('rel.jit');
  linhaRange(host, 'jitter (ms)', dJ.min, Math.min(dJ.max, 20), dJ.step, P.num('rel.jit'),
    v => U.fmt(v, 2) + ' ms', v => { P.set('rel.jit', v); depoisDeParam(false); });
  const dD = P.def('ball.d');
  linhaRange(host, 'bola Ø (mm)', 20, 60, dD.step, P.num('ball.d'),
    v => U.fmt(v, 1) + ' mm', v => { P.set('ball.d', v); depoisDeParam(true); });
  linhaSelect(host, 'tela do campo', ['paisagem', 'retrato'], orientTela,
    v => { orientTela = v; depoisDeParam(true); });

  el('<h4>Peças</h4>', host);
  CT.CATALOG.forEach(c => linhaSelect(host, c.label.replace('Mecanismo de ', '').replace(' dos eixos', ''),
    c.options.map((o, i) => ({ v: i, t: o.name.split(' (')[0] })), CT.selected(c.id),
    v => { CT.select(c.id, +v); depoisDeParam(true); }));

  el('<h4>Vista</h4>', host);
  linhaSelect(host, 'modo de cor', [
    { v: 'procedencia', t: 'engenheiro — procedência' },
    { v: 'subsistema', t: 'engenheiro — subsistema' },
    { v: 'apresentacao', t: 'apresentação — material' }
  ], modoCor, v => { modoCor = v; aplicaModo(); });
  linhaRange(host, 'explodida', 0, 1, 0.01, explode, v => U.fmt(100 * v, 0) + ' %',
    v => { explode = v; aplicaExplode(); });
  Object.keys(TOG).forEach(k => linhaCheck(host, k, TOG[k], v => { TOG[k] = v; aplicaToggles(); }));
}
function depoisDeParam(geometria) {
  if (geometria) rebuild(); else W = M.buildWorld();
  ['A', 'B'].forEach(id => { if (refs['v' + id]) { refs['v' + id].inp.value = vPicoDe(id); refs['v' + id].upd(); } });
  pintaHud();
}

/* ============================================================================
   DEMONSTRACAO — a etapa exibida e LIDA do estado real da bola, nao de um
   roteiro paralelo. Se a maquina fizer outra coisa, a barra mostra outra coisa.
   ========================================================================== */
const ETAPAS = [
  { id: 'pronta', t: 'Escapement libera uma bola', sub: 'Magazine' },
  { id: 'desce', t: 'Desce o tubo de carga', sub: 'Magazine' },
  { id: 'retido', t: 'Espera o carro A na comporta', sub: 'Magazine' },
  { id: 'carga', t: 'Comporta abre e a bola rola para o berço', sub: 'Soltura' },
  { id: 'berco', t: 'Pino trava a bola e o carro A a carrega', sub: 'Soltura' },
  { id: 'voo', t: 'Voo livre até o eixo B', sub: 'Soltura' },
  { id: 'alvo', t: 'Passa pelo furo do alvo', sub: 'Buraco' },
  { id: 'trem', t: 'Cai na bandeja', sub: 'Retorno de bolas' },
  { id: 'calha', t: 'Percorre a calha', sub: 'Retorno de bolas' },
  { id: 'concha', t: 'Entra na concha do elevador', sub: 'Elevador' },
  { id: 'espera', t: 'Aguarda o copo no fundo da concha', sub: 'Elevador' },
  { id: 'captura', t: 'O copo varre a bola da concha', sub: 'Elevador' },
  { id: 'balde', t: 'Sobe presa entre o copo e a tampa', sub: 'Elevador' },
  { id: 'descarga', t: 'Copo tomba e entrega no magazine', sub: 'Magazine' },
  { id: 'mag', t: 'Volta para a fila', sub: 'Magazine' }
];
const DEMO = { on: false, bola: null, tPress: -1, etapa: '' };
let SUBDEST = null;

/* CAMERA AUTOMATICA — enquadra o mecanismo da etapa corrente. Nao orbita: so
   translada e aproxima, na mesma direcao de vista, para nao desorientar.
   Qualquer gesto do usuario desliga o modo automatico na hora, e ele so volta
   pelo botao. A camera nunca disputa o controle. */
const CAM = {
  auto: true,
  dir: new THREE.Vector3(0.62, 0.36, 0.70).normalize(),
  foco: new THREE.Vector3(), raio: 0, tau: 0.9
};
function camManual() {
  if (!CAM.auto) return;
  CAM.auto = false;
  document.getElementById('btnCam').classList.remove('on');
  document.getElementById('btnCam').hidden = false;
}
function camAuto(lig) {
  CAM.auto = lig;
  const b = document.getElementById('btnCam');
  b.classList.toggle('on', lig); b.hidden = !DEMO.on && !lig;
}
// alvo e raio de enquadramento de cada etapa: e aqui que se decide o que aparece
function focoDaEtapa(et, bola) {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const pb = bola ? bola.mesh.position : V(0, D.ySoltura, D.zJogo);
  const meioCampo = (D.ySoltura + D.yBoca) / 2;
  switch (et) {
    case 'mag': return { p: MAG.path.at(MAG.sSaida - MAG.passo * 2), r: 300 };
    case 'pronta': return { p: MAG.path.at(MAG.sSaida), r: 200 };
    case 'desce': return { p: pb, r: 260 };
    case 'retido': return { p: MAG.pComporta, r: 150 };
    case 'carga': return { p: pb.clone().lerp(V(MAG.xLoad, D.ySoltura, D.zJogo), 0.5), r: 150 };
    case 'berco': return { p: V(pb.x, D.ySoltura, D.zJogo), r: 260 };
    case 'voo': return { p: V(pb.x, meioCampo, D.zJogo), r: 300 };
    case 'alvo': return { p: V(pb.x, D.yBoca - GEOM.boca.gargantaAlt.v / 2, D.zJogo), r: 190 };
    case 'trem': return { p: pb, r: 300 };
    case 'calha': return { p: pb, r: 320 };
    case 'concha': return { p: ELEV.pEspera, r: 200 };
    case 'espera': return { p: ELEV.pEspera, r: 170 };
    case 'captura': return { p: ELEV.pEspera, r: 170 };
    case 'balde': return { p: V(ELEV.x, pb.y, ELEV.z - ELEV.R), r: 320 };
    case 'descarga': return { p: ELEV.entrega, r: 220 };
    default: return { p: V(0, D.alturaExt / 2, 0), r: D.alturaExt / 2 };
  }
}
function passoCamera(dt) {
  if (!DEMO.on || !CAM.auto) return;
  const f = focoDaEtapa(DEMO.etapa, DEMO.bola);
  const k = 1 - Math.exp(-dt / CAM.tau);
  CAM.foco.lerp(f.p, k);
  CAM.raio = CAM.raio ? U.lerp(CAM.raio, f.r, k) : f.r;
  controls.target.lerp(CAM.foco, 1);
  camera.position.lerp(
    CAM.foco.clone().addScaledVector(CAM.dir, distParaEnquadrar(CAM.raio)), k);
}

// instante de soltura que poe a bola no centro do furo. Usa a MESMA avaliacao do
// simulador: nao e um atalho de animacao, e a jogada perfeita calculada.
function melhorSoltura() {
  let melhor = null;
  for (let t = tMaq + 0.4; t < tMaq + 14; t += 0.008) {
    const d = Math.abs(M.evalPress(W, t, 0).delta);
    if (!melhor || d < melhor.d) melhor = { t, d };
  }
  return melhor && melhor.d < W.tol ? melhor.t : -1;
}
function demo(lig) {

}
function etapaDaBola(b) {
  if (!b) return '';
  // 'passa pelo furo' nao e um cronometro: e a bola estar entre o plano do alvo e
  // a saida da garganta. Termina quando ela de fato sai da passagem interna.
  if (b.st === 'trem' && ALVO && tMaq - ALVO.aceso < 4 &&
      b.mesh.position.y > ALVO.yGarganta) return 'alvo';
  if (b.st === 'assento') return 'carga';       // o assentamento e o fim da carga
  return b.st;
}
function passoDemo(dt) {
  if (!DEMO.on) return;
  // dispara a soltura no instante calculado
  if (DEMO.tPress > 0 && tMaq >= DEMO.tPress) {
    DEMO.tPress = -1; DEMO.bola = bolaNoBerco(); soltar(); aplicaDestaque();
  }
  // terminou o ciclo: prepara o proximo, sem intervencao
  // ciclo fechado: segura a ultima etapa no ar um instante antes de recomecar,
  // senao 'volta para a fila' passa sem ninguem ver
  if (DEMO.tPress < 0 && DEMO.bola && DEMO.bola.st === 'mag') {
    if (!DEMO.tFim) DEMO.tFim = tMaq;
    else if (tMaq - DEMO.tFim > 1.6 && bolaNoBerco()) {
      DEMO.tFim = 0; DEMO.bola = bolaNoBerco();
      DEMO.tPress = melhorSoltura(); aplicaDestaque();
    }
  }
  const et = etapaDaBola(DEMO.bola);
  if (et !== DEMO.etapa) {
    DEMO.etapa = et;
    const linha = ETAPAS.filter(e => e.id === et)[0];
    SUBDEST = linha ? linha.sub : null;
    aplicaDestaque(); pintaEtapas();
  }
}

const rayc = new THREE.Raycaster(), ptr = new THREE.Vector2();
const destaqueCache = {};
function matDestaque(base) {
  if (!destaqueCache[base.uuid]) {
    const m = base.clone();
    // destaque em cor quente: em modo procedencia quase tudo ja e ciano
    m.emissive = new THREE.Color(COR.sel).multiplyScalar(0.5);
    destaqueCache[base.uuid] = m;
  }
  return destaqueCache[base.uuid];
}
function pecaDoObjeto(o) {
  while (o) { if (o.userData && o.userData.p) return o.userData.p; o = o.parent; }
  return null;
}
function aplicaDestaque() {
  PARTS.forEach(p => {
    const marca = p === SEL || (SUBDEST && p.sub === SUBDEST);
    p.obj.traverse(m => {
      if (!m.isMesh || !m.userData.matBase) return;
      m.material = marca ? matDestaque(m.userData.matBase) : m.userData.matBase;
    });
  });
  BOLAS.forEach(b => {
    if (!b.mesh.userData.matBase) return;
    // na demonstracao so a bola acompanhada fica marcada: e ela que o espectador segue
    const marca = (DEMO.on && DEMO.bola === b) || (!DEMO.on && SEL && SEL.sub === 'Bolas');
    b.mesh.material = marca ? matDestaque(b.mesh.userData.matBase) : b.mesh.userData.matBase;
  });
}
function selecionar(p) {
  SEL = p || null; selNome = p ? p.nome : null;

}
function clicouEm(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  rayc.setFromCamera(ptr, camera);
  const hits = rayc.intersectObject(root, true).filter(h => h.object.isMesh);
  // vidro e acrílico ficam na frente de tudo: o clique atravessa e pega o mecanismo.
  // Se não houver nada opaco atrás, aí sim a peça transparente é a escolhida.
  const opaco = hits.filter(h => !h.object.material.transparent)[0];
  const alvo = opaco || hits[0];
  return alvo ? pecaDoObjeto(alvo.object) : null;
}

function tabelaPecas() {
  const agg = {};
  PARTS.forEach(p => {
    const k = p.sub + '|' + p.nome + '|' + p.dims + '|' + p.src;
    if (!agg[k]) agg[k] = { nome: p.nome, sub: p.sub, dims: p.dims, src: p.src, qtd: 0 };

    a.sub === b.sub ? a.nome.localeCompare(b.nome) : a.sub.localeCompare(b.sub));

const relogio = new THREE.Clock();
let tHud = 0, tPisca = 0, piscaOn = false;
function giraTransmissao(dt) {
  [[EIXO_A, 'axA'], [EIXO_B, 'axB']].forEach(([ex, ax]) => {
    if (!ex || !ex.trn.girantes.length) return;
    const v = W[ax].vel(tMaq), t = CT.geom('transmissao').d;
    const r = ex.trn.kind === 'correia' ? t.poliaDp.v / 2
      : ex.trn.kind === 'fuso' ? t.fusoD.v / 2 : t.pinhaoDp.v / 2;
    const ang = (v / r) * dt;
    ex.trn.girantes.forEach(g2 => g2.rotateOnAxis(new THREE.Vector3(0, 1, 0), ang));
  });
}
function moveCacambas() {
  if (!ELEV) return;
  const T = new THREE.Vector3(), OUT = new THREE.Vector3(), XL = new THREE.Vector3();
  const m4 = new THREE.Matrix4(), zona = 40;
  ELEV.cacambas.forEach((c, i) => {
    const s = U.frac((i * ELEV.passo + ELEV.v * tMaq) / ELEV.loop.total) * ELEV.loop.total;
    c.userData.s = s;
    c.position.copy(ELEV.loop.at(s));
    // a boca do copo aponta para FORA do laco: subindo fica para cima, e depois do
    // topo ela vira para a frente, que e o lado do magazine
    T.copy(ELEV.loop.tangente(s));
    OUT.set(0, T.z, -T.y).normalize();
    XL.crossVectors(T, OUT).normalize();
    c.quaternion.setFromRotationMatrix(m4.makeBasis(XL, T, OUT));
    c.userData.t = T.clone(); c.userData.out = OUT.clone();
    // em qual polia o copo esta, e quanto da curva ja entrou
    let cen = null, k = 0;
    if (s >= ELEV.sTopo0 - zona && s <= ELEV.sTopo1) {
      cen = new THREE.Vector3(ELEV.x, ELEV.y1, ELEV.z);
      k = U.clamp((s - (ELEV.sTopo0 - zona)) / zona, 0, 1);
    } else if (s >= ELEV.sFundo0 - zona || s <= zona) {
      cen = new THREE.Vector3(ELEV.x, ELEV.y0, ELEV.z);
      k = s <= zona ? 1 - s / zona : U.clamp((s - (ELEV.sFundo0 - zona)) / zona, 0, 1);
    }
    c.userData.cen = cen; c.userData.kArc = k;
  });
}
// alvo: anel aceso e portinhola aberta logo depois do acerto. E a confirmacao
// visual do acerto, independente do texto na interface.
const matAceso = new THREE.MeshBasicMaterial({ color: 0x6ef2a0 });
function animaAlvo() {
  if (!ALVO) return;
  const dtA = tMaq - ALVO.aceso, dur = GEOM.boca.acusoT.v;
  const on = dtA >= 0 && dtA < dur;
  const base = ALVO.anel.userData.matBase;
  if (base) ALVO.anel.material = on ? matAceso : base;
  const f = on ? Math.sin(Math.PI * U.clamp(dtA / (dur * 0.6), 0, 1)) : 0;
  ALVO.porta.rotation.x = -f * GEOM.boca.portaGiro.v * Math.PI / 180;
  ALVO.anel.scale.y = (P.num('geo.depth') / Math.max(P.num('geo.L'), P.num('geo.depth'))) * (1 + 0.25 * f);
}

/* Came do escapement: meia volta por bola liberada. Um dedo sai da frente da bola
   enquanto o outro entra na frente da seguinte — e isso que faz sair UMA. */
function animaEscape() {
  if (!MAG || !MAG.came) return;
  const f = U.clamp((tMaq - MAG.libera) / GEOM.magazine.tCame.v, 0, 1);
  MAG.came.rotation.z = (MAG.voltas || 0) + Math.PI * f * f * (3 - 2 * f);
  if (f >= 1 && MAG.liberaFeita !== MAG.libera) {
    MAG.liberaFeita = MAG.libera; MAG.voltas = MAG.came.rotation.z;
  }
}
/* Comporta de carga: chapa articulada na soleira do tubo. Fechada, e o batente da
   bola; aberta, deita e vira a rampa por onde ela rola para o berco. O comando vem
   da posicao do carro A, nao de um cronometro. */
function animaComporta(dt) {
  if (!MAG || !MAG.lamina) return;
  const m = GEOM.magazine, passo = dt / Math.max(1e-3, m.tComporta.v);
  MAG.gate = U.clamp(MAG.gate + U.clamp((MAG.cmd || 0) - MAG.gate, -passo, passo), 0, 1);
  MAG.lamina.position.y = MAG.yLamina - MAG.gate * m.comportaAlt.v;
}

/* Pino do berco: recolhido enquanto a bola nao chegou (senao ela nao entra),
   avancado assim que ela assenta, e recolhido de novo no instante da soltura.
   E esse pino que segura a bola durante todo o percurso do carro A. */
function animaPino() {
  if (!SOL.pino) return;
  const carregando = BOLAS.some(b => b.st === 'carga' || b.st === 'retido' || b.st === 'desce');
  const soltando = TIRO && tMaq - TIRO.ev.tRel > 0;
  const temBola = !!bolaNoBerco();
  // 0 = recolhido (passagem livre), 1 = avancado (bola travada)
  let alvo = temBola && !soltando ? 1 : 0;
  if (carregando && !temBola) alvo = 0;
  const assentou = SOL.travaEm ? U.clamp((tMaq - SOL.travaEm) / 0.18, 0, 1) : 1;
  alvo *= assentou;
  SOL.pinoF = U.lerp(SOL.pinoF === undefined ? alvo : SOL.pinoF, alvo, U.clamp(12 * 0.016, 0, 1));
  SOL.pino.position.z = SOL.pinoZ0 + SOL.pinoCurso * (1 - SOL.pinoF);
}

function piscaOfensores() {
  if (tMaq - tPisca < 0.4) return;
  tPisca = tMaq; piscaOn = !piscaOn;
  OFENSORES.forEach(o => o.p.obj.traverse(m => {
    if (!m.isMesh || o.p === SEL) return;
    if (!m.userData.matBase) m.userData.matBase = m.material;
    m.material = piscaOn ? matErr : m.userData.matBase;
  }));
}
function laco() {
  requestAnimationFrame(laco);
  const dt = Math.min(0.05, relogio.getDelta());
  if (rodando) tMaq += dt;
  setCarros(W.axA.pos(tMaq) - D.curso / 2, W.axB.pos(tMaq) - D.curso / 2);
  if (SEGUE.on) {
    const dx = EIXO_A.carro.position.x - SEGUE.x;
    camera.position.x += dx; controls.target.x += dx; SEGUE.x += dx;
  }
  passoBolas(dt); giraTransmissao(dt); moveCacambas(); piscaOfensores(); animaAlvo();
  passoDemo(dt); passoCamera(dt);
  animaPino(); animaComporta(dt); animaEscape();
  controls.update();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  if (tMaq - tHud > 0.12) { tHud = tMaq; pintaHud(); if (SEL) pintaFicha(); }
}

/* ============================================================================
   ENTRADA E BOOT
   ========================================================================== */
function ajusta() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
}
window.addEventListener('resize', ajusta);
window.addEventListener('keydown', ev => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (ev.code === 'Space') { ev.preventDefault(); soltar(); }
  if (ev.code === 'KeyP') rodando = !rodando;
  if (ev.code === 'KeyH') wrap.classList.toggle('sempaineis');
  if (ev.code === 'Escape') { selecionar(null); if (DEMO.on) demo(false); }
  if (ev.code === 'KeyD') demo(!DEMO.on);
  if (ev.code === 'ArrowUp' || ev.code === 'ArrowDown') {
    ev.preventDefault();
    sobeVista((ev.code === 'ArrowUp' ? 1 : -1) * D.alturaExt * 0.05);
  }
});
let down = null, tHover = 0;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
// cursor muda sobre peca clicavel: sem isso ninguem descobre que da para clicar
renderer.domElement.addEventListener('pointermove', e => {
  const ag = performance.now();
  if (down || ag - tHover < 70) return;
  tHover = ag;
  renderer.domElement.style.cursor = clicouEm(e) ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 4) {
    const p = clicouEm(e);
    if (p) selecionar(p); else { selecionar(null); soltar(); }
  }
  down = null;
});
document.getElementById('btnPaineis').addEventListener('click', () => wrap.classList.toggle('sempaineis'));
document.getElementById('btnDemo').addEventListener('click', () => demo(!DEMO.on));
document.getElementById('btnCam').addEventListener('click', () => camAuto(!CAM.auto));
// qualquer gesto de camera entrega o controle ao usuario e nao o disputa de volta
controls.addEventListener('start', camManual);
renderer.domElement.addEventListener('wheel', camManual, { passive: true });
document.getElementById('btnCsv').addEventListener('click', exportaCSV);
document.getElementById('btnGltf').addEventListener('click', exportaGLTF);
document.getElementById('btnCloseText').addEventListener('click', () => document.getElementById('textOverlay').classList.remove('open'));
document.getElementById('btnCopyText').addEventListener('click', () => U.copyText(document.getElementById('textOverlayBody').value));

const camBar = document.getElementById('camBar');
Object.keys(camerasPreset()).forEach(k => {
  const b = document.createElement('button');
  b.className = 'btn sm'; b.dataset.cam = k; b.textContent = k.replace(/_/g, ' ').toLowerCase();
  b.addEventListener('click', () => irPara(k));
  camBar.appendChild(b);
});
// subir/descer a vista sem girar: e o gesto que falta num objeto de 1,7 m de altura
[['▲', 1, 'subir a vista (Shift+roda ou seta ↑)'], ['▼', -1, 'descer a vista (Shift+roda ou seta ↓)']]
  .forEach(([txt, sinal, dica]) => {
    const b = document.createElement('button');
    b.className = 'btn sm'; b.textContent = txt; b.title = dica;
    b.addEventListener('click', () => sobeVista(sinal * D.alturaExt * 0.08));
    camBar.appendChild(b);
  });

document.getElementById('boot').remove();
// tela estreita: os paineis cobrem a cena, entao a maquina aparece primeiro e os
// paineis entram pelo botao
if (window.innerWidth < 860) wrap.classList.add('sempaineis');
rebuild();
montaPainel();
irPara('APRESENTACAO');
ajusta();
pintaHud();
laco();
})();
</script>
</body>
</html>
