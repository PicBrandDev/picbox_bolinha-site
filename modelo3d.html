/* ============================================================================
   REGISTRO DE PECAS — alimenta CSV, legenda de cor e verificacao de envelope
   ========================================================================== */
let PARTS = [];
function reg(mesh, nome, sub, src, dims, qtd) {
  mesh.userData.p = { nome, sub, src, dims, qtd: qtd || 1, obj: mesh };
  PARTS.push(mesh.userData.p);
  return mesh;
}
function dimsOf() {   // junta cotas em "a × b × c mm", cada uma pelo valor
  return Array.prototype.slice.call(arguments).map(x => U.fmt(x, 1).replace(/,0$/, '')).join(' × ') + ' mm';
}

function edges(m) {
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 28), matEdge);
  e.userData.isEdge = true; m.add(e); return m;
}
function box(w, h, d, src, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(w), Math.abs(h), Math.abs(d)), mat || matFor(src));
  return edges(m);
}
function cyl(dia, len, src, axis, mat, seg) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(dia / 2, dia / 2, len, seg || 28), mat || matFor(src));
  if (axis === 'x') m.rotation.z = Math.PI / 2;
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  return m;
}
function ball(dia) { return new THREE.Mesh(new THREE.SphereGeometry(dia / 2, 22, 16), matFor(EST)); }
function planoTela(c, a) { return new THREE.Mesh(new THREE.PlaneGeometry(c, a), matFor(CAT)); }
function at(m, x, y, z) { m.position.set(x || 0, y || 0, z || 0); return m; }
// Chapa horizontal com furo passante de cantos arredondados. E o unico jeito de
// ter FURO: quatro paredes em volta de um vazio nao sao um furo, sao quatro paredes.
function chapaComFuro(larg, prof, furoL, furoP, raio, esp, src) {
  const fora = new THREE.Shape();
  fora.moveTo(-larg / 2, -prof / 2); fora.lineTo(larg / 2, -prof / 2);
  fora.lineTo(larg / 2, prof / 2); fora.lineTo(-larg / 2, prof / 2); fora.closePath();
  const r = Math.min(raio, furoL / 2, furoP / 2);
  const a = furoL / 2 - r, b = furoP / 2 - r, furo = new THREE.Path();
  furo.moveTo(-a - r, -b);
  furo.lineTo(-a - r, b); furo.absarc(-a, b, r, Math.PI, Math.PI / 2, true);
  furo.lineTo(a, b + r); furo.absarc(a, b, r, Math.PI / 2, 0, true);
  furo.lineTo(a + r, -b); furo.absarc(a, -b, r, 0, -Math.PI / 2, true);
  furo.lineTo(-a, -b - r); furo.absarc(-a, -b, r, -Math.PI / 2, -Math.PI, true);
  fora.holes.push(furo);
  const g = new THREE.ExtrudeGeometry(fora, { depth: esp, bevelEnabled: false, curveSegments: 8 });
  g.rotateX(-Math.PI / 2);                       // do plano XY para o plano XZ
  const m = new THREE.Mesh(g, matFor(src));
  return edges(m);
}
// funil de secao quadrada: 4 faces convergindo, aberto em cima e embaixo
function funil(ladoTopo, ladoBase, alt, src) {
  const g = new THREE.CylinderGeometry(ladoTopo / Math.SQRT2, ladoBase / Math.SQRT2, alt, 4, 1, true);
  g.rotateY(Math.PI / 4);
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: COR.est, side: THREE.DoubleSide }));
}

// detalhe: malha filha da peca que ela detalha. Nao passa por reg(), logo nao vira
// linha no CSV nem peca nova — e o mesmo componente, desenhado com mais fidelidade.
function det(pai, filho) { pai.add(filho); return filho; }
// banda curva (abraco de correia numa polia); eixo local Y, como o cilindro
function banda(raio, larg, grausIni, graus, src) {
  const g = new THREE.CylinderGeometry(raio, raio, larg, 24, 1, true,
    grausIni * Math.PI / 180, graus * Math.PI / 180);
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: COR.est, side: THREE.DoubleSide }));
}
// mola helicoidal ao longo do eixo local Z
function mola(dia, comp, voltas, fio, src) {
  const n = Math.max(12, Math.round(voltas * 14)), pts = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * voltas * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * dia / 2, Math.sin(a) * dia / 2, -comp / 2 + comp * i / n));
  }
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n, fio / 2, 6, false), matFor(src));
}

/* ============================================================================
   GABINETE
   ========================================================================== */
function buildGabinete() {
  const g = GEOM.gabinete, p = g.parede.v, L = D.lado, H = D.alturaExt;
  const add = (m, nome, dims) => { G.gabinete.add(reg(m, nome, 'Gabinete', EST, dims)); return m; };

  add(at(box(L, p, L, EST), 0, p / 2, 0), 'Piso do gabinete', dimsOf(L, p, L));
  [-1, 1].forEach(s => add(at(box(p, H, L, EST), s * (L / 2 - p / 2), H / 2, 0),
    'Lateral do gabinete', dimsOf(p, H, L)));
  add(at(box(L - 2 * p, H, p, EST), 0, H / 2, -(L / 2 - p / 2)), 'Fundo do gabinete', dimsOf(L - 2 * p, H, p));
  add(at(box(L - 2 * p, H - D.yCampo1, p, EST), 0, (H + D.yCampo1) / 2, (L / 2 - p / 2)),
    'Testeira (fechamento frontal)', dimsOf(L - 2 * p, H - D.yCampo1, p));
  add(at(box(L - 2 * p, g.painelY0.v, p, EST), 0, g.painelY0.v / 2, (L / 2 - p / 2)),
    'Frente da coluna', dimsOf(L - 2 * p, g.painelY0.v, p));
  add(at(box(L, p, L, EST), 0, H - p / 2, 0), 'Teto do gabinete', dimsOf(L, p, L));
  // divisoria entre coluna e campo de jogo: fecha o campo por baixo
  // a divisoria para antes do painel de botoes: e ali que os corpos dos botoes
  // descem para dentro da coluna
  const cor = GEOM.eletronica.corredor.v;
  const bz = L / 2 - p - GEOM.botoes.dGrande.v - GEOM.botoes.corpoA.v;   // limite frontal util
  const divZ = bz + (L / 2 - p);
  add(at(box(L - 2 * p - cor, p, divZ, EST), -cor / 2, g.campoY0.v - p / 2, bz - divZ / 2),
    'Divisória campo/coluna', dimsOf(L - 2 * p - cor, divZ, p));
  buildTremonha();
}

/* ============================================================================
   TREMONHA — recebe a bola que entrou no buraco E a que errou, e concentra as
   duas na boca da calha. O caimento nao e escolhido: e a banda de 50 mm inteira,
   do lado oposto ate a saida.
   ========================================================================== */
let TREM = null;
function buildTremonha() {
  const t = GEOM.tremonha, g = GEOM.gabinete;
  const xIni = D.xIniBandeja, xFim = D.xBandejaFim;
  const zc = D.zBandeja, prof = D.profBandeja;
  const zFrente = zc + prof / 2, zTras = D.zSaiBandeja;
  const comp = (xFim - xIni) * Math.sqrt(1 + D.kxBandeja * D.kxBandeja);
  const profL = prof * Math.sqrt(1 + D.kzBandeja * D.kzBandeja);
  const add = (m, nome, dims) => { G.bandeja.add(reg(m, nome, 'Retorno de bolas', EST, dims)); return m; };

  /* A chapa cai em duas direcoes ao mesmo tempo. A orientacao nao e montada com dois
     angulos de Euler (a ordem mudaria o plano): sai da NORMAL do plano que D.ySupBandeja
     descreve, que e a mesma superficie em que a bola anda. Modelo e trajetoria nao podem
     divergir aqui — e nesta chapa que a bola rola. */
  const n = new THREE.Vector3(D.kxBandeja, 1, -D.kzBandeja).normalize();
  const gira = m => { m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n); return m; };
  const naChapa = (x, z, dy) => new THREE.Vector3(x, D.ySupBandeja(x, z) + (dy || 0), z);

  const pc = naChapa((xIni + xFim) / 2, zc, -t.parede.v / 2);
  add(gira(at(box(comp, t.parede.v, profL, EST), pc.x, pc.y, pc.z)),
    'Bandeja de captura (fundo inclinado)', dimsOf(comp, profL, t.parede.v));

  // borda da frente: inteira. Borda de tras: PARA antes do canto de +X, e aquela
  // abertura e a saida da bandeja para a calha de retorno.
  const abertura = D.magLarg + 2 * GEOM.calha.parede.v + g.folga.v;
  const compTras = (xFim - abertura) - xIni;
  [[zFrente, comp, (xIni + xFim) / 2], [zTras, compTras * Math.sqrt(1 + D.kxBandeja * D.kxBandeja),
    xIni + compTras / 2]].forEach(b => {
    const p = naChapa(b[2], b[0], t.borda.v / 2);
    add(gira(at(box(b[1], t.borda.v, t.parede.v, EST), p.x, p.y, p.z)),
      'Borda da bandeja', dimsOf(b[1], t.borda.v, t.parede.v));
  });
  // ponta alta e parede de +X. A de +X e funcional, nao e acabamento: e ela que poe a
  // bola na linha da coluna do elevador antes de a bandeja virar para tras.
  [[xIni, 'Borda da bandeja'], [xFim, 'Guia de saída da bandeja']].forEach(b => {
    const p = naChapa(b[0], zc, t.borda.v / 2);
    add(gira(at(box(t.parede.v, t.borda.v, profL, EST), p.x, p.y, p.z)),
      b[1], dimsOf(t.parede.v, profL, t.borda.v));
  });

  /* caminho da bola: ela cai em qualquer x, atravessa ate a parede de +X e desce por
     ela ate o canto de tras. Tudo sobre a mesma chapa — nao ha degrau em lugar nenhum. */
  TREM = {
    xIni, xFim, zc, prof, zTras, zFrente, yAlto: D.yBandeja1,
    ponto(x, z) {
      const zz = U.clamp(z === undefined ? zc : z, zTras, zFrente);
      const xx = U.clamp(x, xIni, D.xSaiBandeja);
      return new THREE.Vector3(xx, D.yBolaBandeja(xx, zz), zz);
    },
    saida() { return this.ponto(D.xSaiBandeja, zTras); }
  };
}

/* ============================================================================
   VIDRO DO CAMPO + FITA DE LED
   ========================================================================== */
function buildVidro() {
  const g = GEOM.gabinete, p = g.parede.v, alt = D.yCampo1 - g.campoY0.v;
  const vidro = at(box(D.lado - 2 * p, alt, g.vidroE.v, EST),
    0, (D.yCampo1 + g.campoY0.v) / 2, D.lado / 2 - p - g.vidroE.v / 2);
  G.vidro.add(reg(vidro, 'Vidro do campo de jogo', 'Gabinete', EST, dimsOf(D.lado - 2 * p, alt, g.vidroE.v)));

  // WS2812B contornando o campo, colada por dentro do vidro
  const zLed = vidro.position.z - g.vidroE.v / 2 - g.ledFitaE.v / 2;
  const wIn = D.lado - 2 * p - 2 * g.ledFitaL.v;
  [[wIn, g.ledFitaL.v, 0, D.yCampo1 - g.ledFitaL.v / 2], [wIn, g.ledFitaL.v, 0, g.campoY0.v + g.ledFitaL.v / 2],
   [g.ledFitaL.v, alt, -(wIn / 2 + g.ledFitaL.v / 2), (D.yCampo1 + g.campoY0.v) / 2],
   [g.ledFitaL.v, alt, (wIn / 2 + g.ledFitaL.v / 2), (D.yCampo1 + g.campoY0.v) / 2]
  ].forEach(s => G.led.add(reg(at(box(s[0], s[1], g.ledFitaE.v, CAT), s[2], s[3], zLed),
    'Fita WS2812B', 'Iluminação', CAT, dimsOf(Math.max(s[0], s[1]), g.ledFitaL.v, g.ledFitaE.v))));
}

/* ============================================================================
   EIXO LINEAR (x2) — trilho, carro, transmissao, motor, encoder, fim de curso
   id 'A' = eixo da bola (carro pendurado sob o trilho)
   id 'B' = eixo do buraco (carro sobre o trilho)
   ========================================================================== */
function buildEixo(id) {
  const e = GEOM.eixo, g = GEOM.gabinete, dt = GEOM.detalhe, grp = G['eixo' + id];
  const sup = id === 'A';
  const yRail = sup ? D.yTrilhoA : D.yTrilhoB;
  const sgn = sup ? -1 : 1;                       // lado do carro em relacao ao trilho
  const vigaAlt = sup ? D.vigaAltSup : D.vigaAltInf;
  const add = (m, nome, src, dims) => { grp.add(reg(m, nome, 'Eixo ' + id, src, dims)); return m; };

  const trilho = add(at(box(e.trilhoComp.v, e.trilhoAlt.v, e.trilhoLarg.v, CAT), 0, yRail, g.planoTrilhoZ.v),
    'Trilho linear MGN12 350 mm', CAT, dimsOf(e.trilhoComp.v, e.trilhoLarg.v, e.trilhoAlt.v));
  [-1, 1].forEach(sz => det(trilho, at(box(e.trilhoComp.v, dt.trilhoSulco.v, dt.trilhoSulco.v / 2, CAT),
    0, 0, sz * e.trilhoLarg.v / 2)));                       // canais das esferas
  if (vigaAlt > 0) add(at(box(e.trilhoComp.v, vigaAlt, e.vigaZ.v, EST),
    0, yRail - sgn * (e.trilhoAlt.v / 2 + vigaAlt / 2), g.planoTrilhoZ.v),
    'Viga de fixação do trilho', EST, dimsOf(e.trilhoComp.v, vigaAlt, e.vigaZ.v));
  [-1, 1].forEach(sx => add(at(box(e.suporteX.v, e.suporteY.v, e.vigaZ.v, EST),
    sx * (D.xRail + e.suporteX.v / 2), yRail, g.planoTrilhoZ.v),
    'Suporte de extremidade', EST, dimsOf(e.suporteX.v, e.suporteY.v, e.vigaZ.v)));
  // 2 sensores opticos de fim de curso, logo depois do curso util
  [-1, 1].forEach(sx => add(at(box(e.sensorOptC.v, e.sensorOptA.v, e.sensorOptL.v, EST),
    sx * (D.curso / 2 + e.sensorOptC.v), yRail - sgn * (e.trilhoAlt.v / 2 + e.sensorOptA.v / 2), g.planoTrilhoZ.v + e.vigaZ.v / 2),
    'Sensor óptico de fim de curso', EST, dimsOf(e.sensorOptC.v, e.sensorOptL.v, e.sensorOptA.v)));

  const carro = new THREE.Group();
  carro.position.set(0, yRail, g.planoTrilhoZ.v);
  grp.add(carro);
  const addc = (m, nome, src, dims) => { carro.add(reg(m, nome, 'Eixo ' + id, src, dims)); return m; };
  const carroM = addc(at(box(e.carroComp.v, e.carroAlt.v, e.carroLarg.v, CAT), 0, sgn * (e.trilhoAlt.v / 2 + e.carroAlt.v / 2), 0),
    'Carro MGN12H', CAT, dimsOf(e.carroComp.v, e.carroLarg.v, e.carroAlt.v));
  [-1, 1].forEach(sx => det(carroM, at(box(dt.carroTampa.v, e.carroAlt.v, e.carroLarg.v, CAT),
    sx * (e.carroComp.v / 2 - dt.carroTampa.v / 2), 0, 0)));   // tampas de vedacao

  const yPlaca = sgn * (e.trilhoAlt.v / 2 + e.carroAlt.v + e.placaE.v / 2);
  const paySrc = sup ? CT.geom('soltura') : null;
  // a placa do carro nao e cota escolhida: ela alcanca o plano de jogo e cobre o
  // que o carro carrega la
  // no eixo A a placa vai ate depois do acionador; no eixo B ela PARA antes da
  // garganta do buraco — e por baixo dela que a bola sai da passagem interna
  const payZ = sup
    ? D.zJogo + D.bolaR + g.folga.v + (paySrc.d.corpoC || paySrc.d.motorC).v + g.folga.v
    : D.zJogo - (P.num('geo.depth') / 2 + GEOM.boca.parede.v) - D.bolaR;
  const placaZ = payZ + e.carroLarg.v / 2;
  const placaM = addc(at(box(e.carroComp.v + 2 * g.folga.v, e.placaE.v, placaZ, EST),
    0, yPlaca, (payZ - e.carroLarg.v / 2) / 2),
    'Placa do carro montado', EST, dimsOf(e.carroComp.v + 2 * g.folga.v, placaZ, e.placaE.v));
  // aba que corta o feixe do fim de curso; e o que transforma o sensor em referencia
  // fina em Z: ela so precisa cortar o feixe, e no eixo B a garganta do buraco
  // passa logo a frente
  det(placaM, at(box(dt.abaE.v, dt.abaSensor.v, dt.abaE.v, EST),
    -(e.carroComp.v / 2), -sgn * dt.abaSensor.v / 2, e.vigaZ.v / 2 - (payZ - e.carroLarg.v / 2) / 2));

  const trn = buildTransmissao(grp, carro, yRail, sgn, id, D.trnZ(id));
  if (sup) buildSoltura(carro, yPlaca); else buildBoca(carro, yPlaca);
  return { grp, carro, yRail, trn, sgn };
}

/* Transmissao: a peca vem do catalogo, logo a malha tambem. */
function buildTransmissao(grp, carro, yRail, sgn, id, zT) {
  const e = GEOM.eixo, g = GEOM.gabinete, dt = GEOM.detalhe, t = CT.geom('transmissao'), d = t.d;
  const mot = CT.geom('motor'), md = mot.d;
  const add = (m, nome, src, dims) => { grp.add(reg(m, nome, 'Eixo ' + id, src, dims)); return m; };
  const addc = (m, nome, src, dims) => { carro.add(reg(m, nome, 'Eixo ' + id, src, dims)); return m; };
  const out = { kind: t.kind, girantes: [] };

  if (t.kind === 'correia') {
    [-1, 1].forEach(sx => {
      // a polia e cubo no diametro primitivo entre dois flanges: e o flange que
      // segura a correia no lugar, e o cubo que define o avanco por volta
      const pol = at(cyl(d.poliaDp.v, dt.poliaCubo.v, CAT, 'z'), sx * D.xRail, yRail, zT);
      [-1, 1].forEach(sf => det(pol, at(cyl(d.poliaFlange.v, (d.poliaL.v - dt.poliaCubo.v) / 2, CAT, 'y'),
        0, sf * (d.poliaL.v - (d.poliaL.v - dt.poliaCubo.v) / 2) / 2, 0)));
      add(pol, sx > 0 ? 'Polia GT2 20T (motora)' : 'Polia tensora GT2 20T', CAT,
        dimsOf(d.poliaDp.v, d.poliaFlange.v, d.poliaL.v));
      out.girantes.push(pol);
    });
    [-1, 1].forEach(sy => {
      const ramo = at(box(2 * D.xRail, d.correiaL.v, d.correiaE.v, CAT),
        0, yRail + sy * d.poliaDp.v / 2, zT);
      add(ramo, 'Correia GT2 6 mm', CAT, dimsOf(2 * D.xRail, d.correiaL.v, d.correiaE.v));
      if (sy > 0) [-1, 1].forEach(sx => {           // abraco fechando o laco nas polias
        const arc = banda(d.poliaDp.v / 2 + d.correiaE.v / 2, d.correiaL.v,
          sx > 0 ? -90 : 90, dt.correiaArco.v, CAT);
        arc.rotation.x = Math.PI / 2;
        det(ramo, at(arc, sx * D.xRail, -d.poliaDp.v / 2, 0));
      });
    });
    const garraZ = Math.abs(zT) - e.carroLarg.v / 2;   // do fundo do carro ate a correia
    addc(at(box(e.carroComp.v / 2, d.correiaL.v + 2 * g.folga.v, garraZ, EST),
      0, sgn * (e.trilhoAlt.v / 2 + e.carroAlt.v / 2), (zT - e.carroLarg.v / 2) / 2),
      'Garra de correia do carro', EST, dimsOf(e.carroComp.v / 2, garraZ, d.correiaL.v));
  } else if (t.kind === 'fuso') {
    const f = at(cyl(d.fusoD.v, 2 * D.xRail, CAT, 'x'), 0, yRail, zT);
    add(f, 'Fuso trapezoidal T8', CAT, dimsOf(2 * D.xRail, d.fusoD.v, d.fusoD.v));
    out.girantes.push(f);
    [-1, 1].forEach(sx => add(at(cyl(d.mancalD.v, e.suporteX.v, EST, 'x'), sx * D.xRail, yRail, zT),
      'Mancal do fuso', EST, dimsOf(d.mancalD.v, d.mancalD.v, e.suporteX.v)));
    addc(at(cyl(d.castanhaD.v, d.castanhaC.v, EST, 'x'), 0, sgn * (e.trilhoAlt.v / 2 + e.carroAlt.v / 2), zT),
      'Castanha do fuso', EST, dimsOf(d.castanhaC.v, d.castanhaD.v, d.castanhaD.v));
  } else {
    add(at(box(2 * D.xRail, d.barraA.v, d.barraE.v, EST), 0, yRail, zT),
      'Cremalheira', EST, dimsOf(2 * D.xRail, d.barraA.v, d.barraE.v));
    const pin = at(cyl(d.pinhaoDp.v, d.pinhaoL.v, EST, 'z'), 0,
      yRail + d.barraA.v / 2 + d.pinhaoDp.v / 2, zT);
    addc(pin, 'Pinhão do carro', EST, dimsOf(d.pinhaoDp.v, d.pinhaoDp.v, d.pinhaoL.v));
    out.girantes.push(pin);
  }

  // motor: sempre na extremidade +X, corpo atras do plano da transmissao
  const zMot = zT - (t.kind === 'correia' ? d.poliaL.v / 2 : GEOM.eixo.suporteX.v / 2) - g.folga.v;
  const corpoC = md.corpoC.v;
  if (mot.kind === 'dc') {
    add(at(cyl(md.corpoD.v, corpoC, EST, 'z'), D.xRail, yRail, zMot - corpoC / 2),
      'Motor DC 12 V do eixo', EST, dimsOf(md.corpoD.v, md.corpoD.v, corpoC));
    add(at(cyl(md.corpoD.v, md.potC.v, EST, 'z'), D.xRail, yRail, zMot - corpoC - md.potC.v / 2),
      'Potenciômetro linear de realimentação', EST, dimsOf(md.corpoD.v, md.corpoD.v, md.potC.v));
  } else {
    const src = md.flange.s;
    const corpo = at(box(md.flange.v, md.flange.v, corpoC, src), D.xRail, yRail, zMot - corpoC / 2);
    add(corpo, mot.kind === 'nema' ? 'Motor de passo NEMA 17' : 'Motor BLDC 42 mm', src,
      dimsOf(md.flange.v, md.flange.v, corpoC));
    det(corpo, at(cyl(dt.motorBoss.v, dt.motorBossE.v, dt.motorBoss.s, 'z'),
      0, 0, corpoC / 2 + dt.motorBossE.v / 2));                   // ressalto de centragem
    det(corpo, at(box(md.flange.v, md.flange.v, dt.motorTampa.v, EST),
      0, 0, -(corpoC / 2 + dt.motorTampa.v / 2)));                // tampa traseira
    add(at(cyl(md.eixoD.v, md.eixoC.v, src, 'z'), D.xRail, yRail, zMot + md.eixoC.v / 2),
      'Eixo do motor', src, dimsOf(md.eixoD.v, md.eixoD.v, md.eixoC.v));
  }
  // encoder AS5600 na extremidade livre: nao e peca com alternativa, cota em GEOM
  add(at(box(e.as5600.v, e.as5600.v, GEOM.soltura.pcbE.v, CAT), -D.xRail, yRail, zT - GEOM.soltura.pcbE.v),
    'Encoder AS5600 (PCB)', CAT, dimsOf(e.as5600.v, e.as5600.v, GEOM.soltura.pcbE.v));
  return out;
}

/* ============================================================================
   SOLTURA — berco, pino retratil, acionador (do catalogo), barreira, PCB
   Filho do carro do eixo A: viaja com ele, como na maquina.
   ========================================================================== */
function buildSoltura(carro, yPlaca) {
  const s = GEOM.soltura, e = GEOM.eixo, g = GEOM.gabinete, dt = GEOM.detalhe,
        so = CT.geom('soltura'), d = so.d;
  const yBola = -D.recuoSupReal;                       // centro da bola, relativo ao trilho
  const rExt = D.bolaR + g.folga.v + s.bercoParede.v;
  // todo o conjunto vive no plano de jogo, a frente do carro
  const conj = new THREE.Group(); conj.position.z = D.zJogo; carro.add(conj);
  const add = (m, nome, src, dims) => { conj.add(reg(m, nome, 'Soltura', src, dims)); return m; };

  // o braco desce da placa e avanca ate o plano de jogo
  add(at(box(s.bracoL.v, D.bracoH, s.bracoE.v, EST), 0, yPlaca - e.placaE.v / 2 - D.bracoH / 2,
    -(D.bolaR + g.folga.v + s.bracoE.v / 2)), 'Braço do berço', EST, dimsOf(s.bracoL.v, D.bracoH, s.bracoE.v));
  add(at(box(s.bracoL.v, s.bracoE.v, D.zJogo, EST), 0, yPlaca - e.placaE.v / 2 - D.bracoH,
    -D.zJogo / 2), 'Braço do berço', EST, dimsOf(s.bracoL.v, D.zJogo, s.bracoE.v));

  // berco: copo aberto embaixo. E o pino lateral que segura a bola, nao o fundo.
  const arco = s.bercoAbraco.v * Math.PI / 180;
  const berco = new THREE.Mesh(
    new THREE.CylinderGeometry(rExt, rExt, D.bolaR, 28, 1, true, Math.PI / 2 - arco / 2, arco),
    matFor(EST));
  const bercoM = add(at(berco, 0, yBola - D.bolaR / 2, 0), 'Berço da bola', EST,
    dimsOf(2 * rExt, 2 * rExt, D.bolaR));
  /* ABA INFERIOR — e o piso do copo, nao um anel decorativo: um anel de raio interno
     maior que a bola deixaria ela cair. Ela e um disco, e a face de cima dele fica na
     MESMA altura da rampa de carga: a bola rola de uma para a outra. */
  det(bercoM, at(cyl(2 * rExt, dt.bercoLabio.v, EST, 'y'), 0, -(D.bolaR + dt.bercoLabio.v) / 2, 0));

  const corpoC = (d.corpoC || d.motorC).v;
  const zCorpo = D.bolaR + g.folga.v + corpoC / 2;
  if (so.kind === 'solenoide') {
    const sol = at(box(corpoC, d.corpoA.v, d.corpoL.v, d.corpoC.s), 0, yBola, zCorpo);
    add(sol, 'Solenoide de tração 12 V', d.corpoC.s, dimsOf(corpoC, d.corpoL.v, d.corpoA.v));
    // haste e mola de retorno: e a mola que devolve o pino, o solenoide so puxa
    det(sol, at(cyl(d.pinoD.v, d.cursoPino.v * 2, EST, 'z'), 0, 0, -(d.corpoL.v / 2 + d.cursoPino.v)));
    const mo = mola(d.pinoD.v * 2.2, d.cursoPino.v * 1.6, dt.molaVoltas.v, dt.molaFio.v, EST);
    det(sol, at(mo, 0, 0, -(d.corpoL.v / 2 + d.cursoPino.v * 0.8)));
  } else if (so.kind === 'servo') {
    add(at(box(d.corpoC.v, d.corpoA.v, d.corpoL.v, d.corpoC.s), 0, yBola, zCorpo),
      'Servo de soltura', d.corpoC.s, dimsOf(d.corpoC.v, d.corpoL.v, d.corpoA.v));
    add(at(box(d.braco.v, d.pinoD.v, d.pinoD.v, EST), d.braco.v / 2, yBola, zCorpo - d.corpoL.v / 2),
      'Braço do servo', EST, dimsOf(d.braco.v, d.pinoD.v, d.pinoD.v));
  } else {
    add(at(cyl(d.motorD.v, d.motorC.v, EST, 'z'), 0, yBola, zCorpo),
      'Motor DC da came', EST, dimsOf(d.motorD.v, d.motorD.v, d.motorC.v));
    add(at(cyl(2 * d.cameR.v, d.cameE.v, EST, 'z'), 0, yBola, zCorpo - d.motorC.v / 2 - d.cameE.v / 2),
      'Came de soltura', EST, dimsOf(2 * d.cameR.v, 2 * d.cameR.v, d.cameE.v));
  }
  // pino retratil: fecha a distancia entre o acionador e a bola
  const pino = at(cyl(d.pinoD.v, d.cursoPino ? d.cursoPino.v + g.folga.v : g.folga.v * 2 + d.pinoD.v, EST, 'z'),
    0, yBola - D.bolaR / 2, D.bolaR + g.folga.v / 2);
  add(pino, 'Pino retrátil do berço', EST, dimsOf(d.pinoD.v, d.pinoD.v, d.cursoPino ? d.cursoPino.v : d.pinoD.v));
  SOL.pino = pino; SOL.pinoZ0 = pino.position.z;
  SOL.pinoCurso = d.cursoPino ? d.cursoPino.v : d.pinoD.v;

  /* barreira optica: ABAIXO do piso do copo, onde a bola passa quando o pino solta.
     Ali ela mede a saida de verdade — e fica fora da faixa da rampa de carga, que
     ocupa a altura do piso. */
  [-1, 1].forEach(sx => add(at(box(e.sensorOptL.v, e.sensorOptA.v, e.sensorOptC.v, EST),
    sx * (rExt + e.sensorOptL.v / 2),
    yBola - D.bolaR - dt.bercoLabio.v - e.sensorOptA.v / 2 - g.folga.v, 0),
    'Barreira óptica do lançador', EST, dimsOf(e.sensorOptC.v, e.sensorOptL.v, e.sensorOptA.v)));

  // eletronica embarcada no carro
  const yPcb = yPlaca - e.placaE.v / 2 - s.pcbE.v / 2;
  add(at(box(s.pcbC.v, s.pcbE.v, s.pcbL.v, EST), 0, yPcb, zCorpo + corpoC / 2 + s.pcbL.v / 2),
    'PCB do carro (MOSFET + capacitor)', EST, dimsOf(s.pcbC.v, s.pcbL.v, s.pcbE.v));
  add(at(cyl(s.capD.v, s.capA.v, EST, 'y'), -s.pcbC.v / 4, yPcb - s.capA.v / 2, zCorpo + corpoC / 2 + s.pcbL.v / 2),
    'Capacitor 2200 µF', EST, dimsOf(s.capD.v, s.capD.v, s.capA.v));
  add(at(box(s.mosfetC.v, s.mosfetA.v, s.mosfetL.v, EST), s.pcbC.v / 4, yPcb - s.mosfetA.v / 2,
    zCorpo + corpoC / 2 + s.pcbL.v / 2), 'MOSFET de potência', EST,
    dimsOf(s.mosfetC.v, s.mosfetL.v, s.mosfetA.v));
}

/* ============================================================================
   BOCA DO BURACO — filha do carro do eixo B
   ========================================================================== */
function buildBoca(carro, yPlaca) {
  const b = GEOM.boca, e = GEOM.eixo, g = GEOM.gabinete, det = CT.geom('deteccao'), dd = det.d;
  const L = P.num('geo.L'), dep = P.num('geo.depth'), h = D.bocaH;
  const yTop = e.recuoInf.v;                       // plano da boca, relativo ao trilho
  const conj = new THREE.Group(); conj.position.z = D.zJogo; carro.add(conj);
  const add = (m, nome, src, dims) => { conj.add(reg(m, nome, 'Buraco', src, dims)); return m; };

  // CHAPA-ALVO: a peca que o jogador tem que acertar. O furo e passante de verdade,
  // com a largura geo.L que o simulador usa como tolerancia de acerto.
  const chapaC = L + 2 * b.chapaSobra.v, chapaP = dep + 2 * b.chapaSobra.v;
  const chapa = chapaComFuro(chapaC, chapaP, L, dep, b.raioCanto.v, b.chapaE.v, EST);
  add(at(chapa, 0, yTop - b.chapaE.v, 0), 'Chapa-alvo do buraco', EST,
    dimsOf(chapaC, chapaP, b.chapaE.v) + ' · furo ' + U.fmt(L, 0) + ' × ' + U.fmt(dep, 0));

  // ANEL DO ALVO: marca a area de acerto e acende quando a bola entra
  const anel = new THREE.Mesh(
    new THREE.TorusGeometry((Math.max(L, dep) + b.anelFio.v) / 2, b.anelFio.v / 2, 8, 40),
    matFor(EST));
  anel.rotation.x = Math.PI / 2;
  anel.scale.set(1, dep / Math.max(L, dep), 1);    // acompanha o retangulo do furo
  add(at(anel, 0, yTop + b.anelFio.v / 2, 0), 'Anel indicador do alvo', EST,
    dimsOf(L + b.anelFio.v, dep + b.anelFio.v, b.anelFio.v));

  // CALHA DE SAIDA: a bola que passa pelo furo NAO pode descer em linha reta —
  // embaixo esta o carro linear. Ela e desviada para a frente e sai na cara do
  // jogador, que e tambem o angulo em que da para ver a bola sair.
  // GARGANTA: passagem interna sob o furo. E ela que faz a bola ENTRAR no
  // mecanismo em vez de so atravessar um plano: quatro paredes guiando a queda.
  const gAlt = b.gargantaAlt.v, gL = L + 2 * b.parede.v, gP = dep + 2 * b.parede.v;
  [-1, 1].forEach(sx => add(at(box(b.parede.v, gAlt, gP, EST),
    sx * (L / 2 + b.parede.v / 2), yTop - b.chapaE.v - gAlt / 2, 0),
    'Parede da garganta', EST, dimsOf(b.parede.v, gP, gAlt)));
  [-1, 1].forEach(sz => add(at(box(gL, gAlt, b.parede.v, EST),
    0, yTop - b.chapaE.v - gAlt / 2, sz * (dep / 2 + b.parede.v / 2)),
    'Parede da garganta', EST, dimsOf(gL, b.parede.v, gAlt)));

  // PORTINHOLA: dobradica logo abaixo do furo. A bola empurra ao atravessar —
  // e a prova mecanica, visivel, de que ela passou e nao raspou na chapa.
  const bolaD = P.num('ball.d');
  const porta = new THREE.Group();
  porta.add(at(box(L * 0.9, b.portaE.v, dep * 0.9, EST), 0, 0, dep * 0.45));
  porta.position.set(0, yTop - b.chapaE.v - gAlt + b.portaE.v, -dep * 0.45);
  add(porta, 'Portinhola do buraco', EST, dimsOf(L * 0.9, dep * 0.9, b.portaE.v));

  // suporte: leva a chapa-alvo do trilho ate o plano de jogo, por fora do carro
  const supZ = chapaP / 2 + D.zJogo;
  [-1, 1].forEach(sx => add(at(box(b.parede.v, h, supZ, EST),
    sx * (chapaC / 2 - b.parede.v / 2), yTop - h / 2, chapaP / 2 - supZ / 2),
    'Suporte da chapa-alvo', EST, dimsOf(b.parede.v, supZ, h)));

  // sensor que registra a passagem, do catalogo
  if (det.kind === 'optica') {
    [-1, 1].forEach(sx => add(at(box(dd.emissorL.v, dd.emissorA.v, dd.emissorC.v, EST),
      sx * (L / 2 + dd.emissorL.v), yTop - b.chapaE.v - dd.emissorA.v, 0),
      'Barreira óptica da boca', EST, dimsOf(dd.emissorC.v, dd.emissorL.v, dd.emissorA.v)));
  } else if (det.kind === 'indutivo') {
    add(at(cyl(dd.corpoD.v, dd.corpoC.v, dd.corpoD.s, 'x'),
      L / 2 + dd.corpoC.v / 2, yTop - b.chapaE.v - dd.corpoD.v, 0),
      'Sensor indutivo da boca', dd.corpoD.s, dimsOf(dd.corpoC.v, dd.corpoD.v, dd.corpoD.v));
  } else {
    add(at(box(dd.corpoC.v, dd.corpoA.v, dd.corpoL.v, dd.corpoC.s),
      L / 2 + dd.corpoC.v / 2, yTop - b.chapaE.v - dd.corpoA.v / 2, 0),
      'Microswitch da boca', dd.corpoC.s, dimsOf(dd.corpoC.v, dd.corpoL.v, dd.corpoA.v));
  }

  ALVO = {
    anel, porta, aceso: -1e9, yFuro: D.yBoca, chapaC, chapaP,
    yGarganta: D.yBoca - b.chapaE.v - gAlt      // onde a bola deixa a passagem interna
  };
}

/* ============================================================================
   CAMINHOS — poligonal com comprimento de arco, usada por magazine, calhas e
   elevador. A bola anda sobre o caminho; o canal e desenhado sobre ele.
   ========================================================================== */
function polyPath(pts) {
  const acc = [0];
  for (let i = 0; i < pts.length - 1; i++) acc.push(acc[i] + pts[i].distanceTo(pts[i + 1]));
  const total = acc[acc.length - 1];
  return {
    pts, total, acc,
    // direcao de marcha no ponto s: e ela que orienta a cacamba do elevador
    tangente(s) {
      const e = Math.max(1e-3, total / 5000);
      return this.at(Math.min(total, s + e)).sub(this.at(Math.max(0, s - e))).normalize();
    },
    at(s) {
      s = U.clamp(s, 0, total);
      let i = 0; while (i < acc.length - 2 && acc[i + 1] < s) i++;
      const f = (s - acc[i]) / Math.max(1e-9, acc[i + 1] - acc[i]);
      return pts[i].clone().lerp(pts[i + 1], f);
    }
  };
}
/* Concordancia nos cantos. Canto vivo nao existe em calha de bola: a esfera nao
   muda de direcao num ponto, e duas bolas em fila dobrando um canto de raio zero
   passam a ocupar o mesmo lugar — a distancia entre elas deixa de ser o passo da
   fila e vira a corda do canto. Cada vertice interno vira um arco tangente aos
   dois trechos.
   O raio pedido e limitado pela metade do menor trecho vizinho, senao os arcos de
   cantos seguidos se invadem. Raio minimo util: para passo p = d + folga, a corda
   entre duas bolas no arco e 2r·sen(p/2r), e ela so fica >= d a partir de
   r ~ 0,94·d — dai D.rCurva = Ø da bola. */
function arredonda(pts, raio, segs) {
  if (pts.length < 3) return pts.map(q => q.clone());
  const n = segs || 10, out = [pts[0].clone()];
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i];
    const va = pts[i - 1].clone().sub(p), vb = pts[i + 1].clone().sub(p);
    const la = va.length(), lb = vb.length();
    if (la < 1e-6 || lb < 1e-6) { out.push(p.clone()); continue; }
    va.divideScalar(la); vb.divideScalar(lb);
    const ang = Math.acos(U.clamp(va.dot(vb), -1, 1));   // angulo interno do canto
    if (ang > Math.PI - 1e-3) continue;                  // ja e reto: o vertice nao existe
    if (ang < 1e-3) { out.push(p.clone()); continue; }   // retorno sobre si: sem arco tangente
    const tg = Math.tan(ang / 2);
    const r = Math.min(raio, Math.min(la, lb) * 0.5 * tg);
    const rec = r / tg;                                  // recuo do vertice ate a tangencia
    const t0 = p.clone().add(va.clone().multiplyScalar(rec));
    const t1 = p.clone().add(vb.clone().multiplyScalar(rec));
    const c = p.clone().add(va.clone().add(vb).normalize().multiplyScalar(r / Math.sin(ang / 2)));
    const u = t0.clone().sub(c), w = t1.clone().sub(c);
    const eixo = u.clone().cross(w);
    if (eixo.lengthSq() < 1e-12) { out.push(t0, t1); continue; }
    eixo.normalize();
    const varre = u.angleTo(w);
    for (let k = 0; k <= n; k++) out.push(c.clone().add(u.clone().applyAxisAngle(eixo, varre * k / n)));
  }
  out.push(pts[pts.length - 1].clone());
  return out;
}

function segCanal(a, b, larg, alt, src, p) {
  const grp = new THREE.Group(), len = a.distanceTo(b);
  // o piso fica ABAIXO do plano da bola. Centrado em -alt/2, a metade de cima da
  // chapa entra na esfera: a bola afunda p/2 em toda calha da maquina.
  const piso = box(len, p, larg + 2 * p, src); piso.position.y = -alt / 2 - p / 2;
  grp.add(piso);
  [-1, 1].forEach(sz => { const w = box(len, alt, p, src); w.position.set(0, 0, sz * (larg / 2 + p / 2)); grp.add(w); });
  grp.position.copy(a).add(b).multiplyScalar(0.5);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), b.clone().sub(a).normalize());
  return grp;
}
function canalSobre(path, larg, alt, src, grupo, nome, sub, parede, vaosFinais, vaosIniciais) {
  for (let i = (vaosIniciais || 0); i < path.pts.length - 1 - (vaosFinais || 0); i++) {
    const a = path.pts[i], b = path.pts[i + 1];
    grupo.add(reg(segCanal(a, b, larg, alt, src, parede), nome, sub, src,
      dimsOf(a.distanceTo(b), larg + 2 * parede, alt)));
  }
}

/* ============================================================================
   MAGAZINE + ESCAPEMENT
   ========================================================================== */
let MAG = null;
function buildMagazine() {
  const m = GEOM.magazine, g = GEOM.gabinete;
  const bolaD = P.num('ball.d'), pw = m.tuboParede.v;
  const passo = D.magPasso, passeL = D.magPasseL;

  /* serpentina de N passes, entrando em cima do elevador. N impar termina do lado do
     berco. O ULTIMO passe e mais longo: vai ate a vertical da comporta de carga, e e
     o comprimento dele que da o caimento para a bola chegar lá rolando. */
  const serp = [];
  for (let i = m.passos.v - 1; i >= 0; i--) {
    const dir = (m.passos.v - 1 - i) % 2 === 0 ? -1 : 1;     // alterna o sentido
    const L = i === 0 ? D.magPasse0 : passeL;
    const xa = dir < 0 ? D.xMag : D.xMag - L;
    const y0 = D.yMagSai + m.dy.v * i;
    serp.push(new THREE.Vector3(xa, y0 + D.magDh(L), m.z.v));
    serp.push(new THREE.Vector3(xa + dir * L, y0, m.z.v));
  }
  // meia-volta com raio: o canto vivo punha duas bolas da fila a 23 mm uma da outra,
  // com 35 mm de diametro. arredonda() nao mexe nos extremos, entao a saida do
  // ultimo passe — que e o que a comporta e o ramo de carga usam — fica no lugar.
  const pts = arredonda(serp, D.rCurva, 10);
  const iSaida = pts.length - 1, saida = pts[iSaida];
  /* RAMO DE CARGA — dois trechos e nada mais:
     1) cai os poucos milimetros que separam a saida do magazine da altura de carga;
     2) atravessa o plano dos trilhos na horizontal, pela janela que existe entre o topo
        do acrilico da tela e a base do mancal do trilho A — a bola entra com a
        velocidade da queda e vence os 120 mm rolando;
     3) rola a rampa por dentro do berco. Este ultimo nao leva calha: e a rampa e a
        aba do berco que sustentam a bola, com 2 mm de vao entre as duas. */
  pts.push(new THREE.Vector3(D.xQueda, D.yCarga, m.z.v));         // queda curta
  pts.push(new THREE.Vector3(D.xQueda, D.yCarga, D.zJogo));       // <- comporta
  pts.push(new THREE.Vector3(D.xLoad, D.ySoltura, D.zJogo));      // <- fundo do berco
  const path = polyPath(pts);
  const iComporta = pts.length - 2;

  canalSobre(path, D.magLarg, bolaD, EST, G.magazine, 'Tubo do magazine', 'Magazine',
    pw, pts.length - 1 - iSaida);
  // o ramo de carga usa um tubo mais justo: a parede de +X dele tem que morrer no
  // limite do volume varrido pelo berco
  canalSobre(path, D.magLargCarga, bolaD, EST, G.magazine, 'Tubo de carga', 'Magazine',
    pw, 1, iSaida);

  // escapement: micro-servo + came, na saida do ultimo passe
  G.magazine.add(reg(at(box(m.servoC.v, m.servoA.v, m.servoL.v, m.servoC.s),
    saida.x + m.servoC.v, saida.y + m.servoA.v, m.z.v), 'Micro-servo SG90 (escapement)', 'Magazine',
    m.servoC.s, dimsOf(m.servoC.v, m.servoL.v, m.servoA.v)));
  const came = at(cyl(2 * m.cameR.v, m.cameE.v, EST, 'z'), saida.x + m.servoC.v, saida.y,
    m.z.v + m.servoL.v);
  // dois dedos defasados: um segura a fila enquanto o outro deixa passar uma bola
  [0, Math.PI].forEach(a => {
    const dedo = at(box(GEOM.detalhe.dedoEscape.v, passo, m.cameE.v, EST),
      Math.cos(a) * m.cameR.v, Math.sin(a) * m.cameR.v - passo / 2, 0);
    det(came, dedo);
  });
  G.magazine.add(reg(came, 'Came do escapement', 'Magazine', EST, dimsOf(2 * m.cameR.v, 2 * m.cameR.v, m.cameE.v)));
  G.magazine.add(reg(at(box(m.sensorNivel.v, m.sensorNivel.v, m.sensorNivel.v, EST),
    pts[0].x - passo, pts[0].y + m.sensorNivel.v, m.z.v), 'Sensor de nível do magazine', 'Magazine',
    EST, dimsOf(m.sensorNivel.v, m.sensorNivel.v, m.sensorNivel.v)));

  /* ESTACAO DE CARGA — a bola NAO aparece no berco. Ela para aqui, visivel, apoiada na
     rampa e encostada na lamina da comporta, e so entra quando o carro A inverte o
     curso logo ao lado. Todas as pecas daqui morrem em D.xComporta: um milimetro a
     mais e a estacao seria varrida pelo berco. */
  const yRampa = D.yCarga - D.bolaR;                       // face de rolamento
  const xIni = D.xQueda - D.magLargCarga / 2;
  const compR = D.xComporta - xIni;
  const rampa = at(box(compR, GEOM.calha.parede.v, D.magLargCarga, EST),
    (xIni + D.xComporta) / 2, yRampa - GEOM.calha.parede.v / 2 + m.rampaCarga.v / 2, D.zJogo);
  rampa.rotation.z = -Math.atan2(m.rampaCarga.v, compR);   // caimento para o berco
  G.magazine.add(reg(rampa, 'Rampa de carga', 'Magazine', EST,
    dimsOf(compR, D.magLargCarga, GEOM.calha.parede.v)));
  [-1, 1].forEach(sz => G.magazine.add(reg(at(box(compR, bolaD * 0.6, pw,  EST),
    (xIni + D.xComporta) / 2, yRampa + bolaD * 0.3, D.zJogo + sz * (D.magLargCarga + pw) / 2),
    'Guia lateral da rampa de carga', 'Magazine', EST, dimsOf(compR, bolaD * 0.6, pw))));

  // lamina da comporta: desce para abrir. Girar seria pior — a chapa aberta entraria
  // no volume do berco.
  const lam = at(box(m.comportaE.v, m.comportaAlt.v, D.magLargCarga, EST),
    D.xComporta - m.comportaE.v / 2, yRampa + m.comportaAlt.v / 2, D.zJogo);
  G.magazine.add(reg(lam, 'Comporta de carga', 'Magazine', EST,
    dimsOf(m.comportaE.v, D.magLargCarga, m.comportaAlt.v)));
  const so = CT.geom('soltura'), sd = so.d, solA = sd.corpoA ? sd.corpoA.v : 20;
  G.magazine.add(reg(at(box((sd.corpoC || sd.motorC).v, solA, sd.corpoL ? sd.corpoL.v : 20, EST),
    D.xComporta - (sd.corpoC || sd.motorC).v / 2,
    yRampa - solA / 2 - GEOM.calha.parede.v - GEOM.eixo.sensorOptA.v - 5 * g.folga.v,
    D.zJogo), 'Solenoide da comporta de carga', 'Magazine', EST,
    dimsOf((sd.corpoC || sd.motorC).v, sd.corpoL ? sd.corpoL.v : 20, solA)));

  MAG = {
    path, passo, capacidade: D.magPorPasse * m.passos.v, came, lamina: lam,
    xLoad: D.xLoad, passeL, pComporta: path.at(path.acc[iComporta]),
    iSaida, sSaida: path.acc[iSaida],
    iComporta, sComporta: path.acc[iComporta],
    gate: 0, cmd: 0, libera: -1e9, yLamina: lam.position.y
  };
  return MAG;
}

/* ============================================================================
   ELEVADOR DE ESTEIRA COM TALISCAS
   ========================================================================== */
let ELEV = null;
/* chapa curva com o eixo em X: usada na concha, na tampa e na capa do elevador.
   Feita de segmentos planos porque e assim que ela seria dobrada. */
function arcoChapa(raio, larg, esp, aIni, aFim, src) {
  const grp = new THREE.Group(), n = Math.max(4, Math.round(Math.abs(aFim - aIni) / 0.22));
  const seg = Math.abs(aFim - aIni) / n * (raio + esp / 2) * 1.04;
  for (let i = 0; i < n; i++) {
    const am = aIni + (aFim - aIni) * (i + 0.5) / n, r = raio + esp / 2;
    const b = at(box(larg, esp, seg, src), 0, r * Math.sin(am), r * Math.cos(am));
    b.rotation.x = Math.PI / 2 - am;
    grp.add(b);
  }
  return grp;
}
function buildElevador() {
  const e = GEOM.elevador, g = GEOM.gabinete, dt = GEOM.detalhe;
  const x = D.elevX, z = D.elevZc, y0 = D.yElevPe, y1 = D.yElevTopo;
  const R = D.elevR, rb = D.bolaRaio, rt = D.tampaRaio, pw = GEOM.calha.parede.v;
  const bolaD = P.num('ball.d');
  const add = (m, nome, src, dims) => { G.elevador.add(reg(m, nome, 'Elevador', src, dims)); return m; };
  const aDesp = e.despejoAng.v * Math.PI / 180, aConcha = e.conchaIni.v * Math.PI / 180;

  // laterais: fecham a coluna e sustentam os eixos das duas polias
  [-1, 1].forEach(sx => add(at(box(pw, y1 - y0 + 2 * rt, D.elevZ, EST),
    x + sx * (e.colunaX.v - pw) / 2, (y1 + y0) / 2, z), 'Lateral da coluna do elevador', EST,
    dimsOf(pw, D.elevZ, y1 - y0 + 2 * rt)));

  /* LACO DA ESTEIRA — sobe pelo ramo de TRAS e desce pela frente. E o unico sentido
     que entrega a bola do lado do magazine: o copo tomba depois do topo, para a
     frente, onde esta a boca do tubo. */
  const N = 30, pts = [];   // resolucao das curvas: com pouco segmento o copo gira aos saltos
  const pt = (y, a, r) => new THREE.Vector3(x, y + (r || R) * Math.sin(a), z + (r || R) * Math.cos(a));
  pts.push(pt(y0, Math.PI), pt(y1, Math.PI));                       // sobe atras
  for (let i = 1; i <= N; i++) pts.push(pt(y1, Math.PI * (1 - i / N)));   // curva de cima
  pts.push(pt(y0, 0));                                              // desce na frente
  for (let i = 1; i <= N; i++) pts.push(pt(y0, -Math.PI * i / N));  // curva de baixo
  const loop = polyPath(pts);
  const sTopo0 = loop.acc[1], sTopo1 = loop.acc[N + 1], sFundo0 = loop.acc[N + 2];

  [[y0, 'Polia inferior do elevador'], [y1, 'Polia superior do elevador']].forEach(pr => {
    const pol = add(at(cyl(e.poliaD.v, e.esteiraL.v, EST, 'x'), x, pr[0], z), pr[1], EST,
      dimsOf(e.poliaD.v, e.poliaD.v, e.esteiraL.v));
    det(pol, cyl(dt.eixoPolia.v, e.colunaX.v, EST, 'x'));
  });
  [-1, 1].forEach(sz => add(at(box(e.esteiraL.v, y1 - y0, e.esteiraE.v, EST),
    x, (y1 + y0) / 2, z + sz * R), 'Esteira do elevador', EST,
    dimsOf(e.esteiraL.v, y1 - y0, e.esteiraE.v)));

  /* CACAMBAS — copo em U fundo o bastante para CONTER a bola (não é prateleira):
     fundo, costas, duas laterais e uma aba na ponta. A aba é o que retém a bola na
     subida e o que a libera quando o copo passa da horizontal. */
  const bProf = D.baldeProf, bLarg = e.esteiraL.v, bAlt = e.taliscaL.v;
  const passo = bolaD * 2.4, n = Math.max(4, Math.round(loop.total / passo));
  const cacambas = [];
  for (let i = 0; i < n; i++) {
    const c = new THREE.Group();
    c.add(at(box(bLarg, e.taliscaE.v, bProf, EST), 0, 0, bProf / 2));                 // fundo
    c.add(at(box(bLarg, bAlt, e.taliscaE.v, EST), 0, bAlt / 2, 0));                   // costas
    [-1, 1].forEach(sx => c.add(at(box(e.taliscaE.v, bAlt, bProf, EST),
      sx * (bLarg / 2 - e.taliscaE.v / 2), bAlt / 2, bProf / 2)));                    // laterais
    det(c, at(box(bLarg, e.labio.v, e.taliscaE.v, EST), 0, e.labio.v / 2, bProf));    // aba
    reg(c, 'Caçamba do elevador', 'Elevador', EST, dimsOf(bLarg, bProf, bAlt));
    G.elevador.add(c); cacambas.push(c);
  }

  /* CASCA EXTERNA — é ela que impede a bola de cair do copo. Três trechos contínuos:
     concha no fundo (recebe e guarda a bola), tampa reta na subida, capa no topo que
     acaba no ângulo de despejo. Onde a capa acaba, a bola sai: a soltura é mecânica. */
  const concha = at(arcoChapa(rt, bolaD + 2 * pw, pw, -Math.PI, aConcha, EST), x, y0, z);
  add(concha, 'Concha de captação do elevador', EST,
    dimsOf(bolaD + 2 * pw, rt * (Math.PI + aConcha), pw));
  [-1, 1].forEach(sx => add(at(box(pw, rt, rt, EST),
    x + sx * (bolaD / 2 + pw / 2 + g.folga.v), y0 - rt / 2, z - rt / 2),
    'Lateral da concha de captação', EST, dimsOf(pw, rt, rt)));
  add(at(box(bolaD + 2 * pw, y1 - y0, pw, EST), x, (y1 + y0) / 2, z - rt - pw / 2),
    'Tampa de retenção do elevador', EST, dimsOf(bolaD + 2 * pw, y1 - y0, pw));
  const capa = at(arcoChapa(rt, bolaD + 2 * pw, pw, aDesp, Math.PI, EST), x, y1, z);
  add(capa, 'Capa do topo do elevador', EST, dimsOf(bolaD + 2 * pw, rt * (Math.PI - aDesp), pw));

  // motor na polia MOTORA, que e a de cima: no fundo ele bateria na prateleira da
  // eletronica e no corredor da calha de retorno
  add(at(cyl(e.motorD.v, e.motorC.v, EST, 'x'),
    x - e.colunaX.v / 2 - e.motorC.v / 2, y1, z), 'Motor DC 12 V do elevador', EST,
    dimsOf(e.motorC.v, e.motorD.v, e.motorD.v));

  /* PONTO DE ESPERA — fundo da concha, exatamente sobre a trajetória do copo:
     a bola não é "capturada", ela é varrida pelo copo que passa por ali. */
  const pEspera = pt(y0, -Math.PI / 2, rb);
  // rota curta dentro da concha: a bola entra pela boca da concha e ROLA até o fundo
  const rotaConcha = polyPath([pt(y0, D.aBocaConcha, rb), pt(y0, -Math.PI / 4, rb), pEspera]);

  /* CALHA DE ENTREGA — o copo tomba em aDesp e a bola cai nesta calha, que a conduz
     até a boca do tubo do magazine. Sem ela a bola sairia no ar. */
  const pDesp = new THREE.Vector3(x, y1 + rb * Math.sin(aDesp), z + rb * Math.cos(aDesp));
  const pEnt = MAG.path.at(0);
  const pBoca = new THREE.Vector3(x, pDesp.y - bolaD / 2 - pw, pDesp.z + bolaD * 0.45);
  const pFim = pEnt.clone().lerp(pBoca, 0.5);
  const rotaEntrega = polyPath([pDesp, pBoca, pFim, pEnt]);
  canalSobre(rotaEntrega, D.magLarg, bolaD, EST, G.elevador,
    'Calha de entrega do magazine', 'Elevador', pw, 1, 1);

  ELEV = {
    loop, v: D.elevV, cacambas, n, passo: loop.total / n, x, z, R, rb, rt, y0, y1,
    bProf, pEspera, rotaConcha, rotaEntrega, entrega: pBoca, aEspera: -Math.PI / 2,
    sTopo0, sTopo1, sFundo0,
    sDespejo: sTopo0 + R * (Math.PI - aDesp)
  };
  return ELEV;
}

/* ============================================================================
   CALHA DE RETORNO — bandeja -> boca da concha do elevador
   ========================================================================== */
let CAL = null;
function buildCalhas() {
  const g = GEOM.gabinete, bolaD = P.num('ball.d');
  /* A bandeja entrega no canto de tras com a bola ja andando em -Z. Dai ate o LABIO da
     concha e um trecho reto e curto: nenhuma curva fechada, nenhuma queda livre, nenhum
     ponto em que a bola troque de lugar sem percorrer. Onde a calha acaba, a chapa curva
     do elevador ja esta sob a bola. */
  const labio = ELEV.rotaConcha.pts[0], ini = TREM.saida();
  const dir = labio.clone().sub(ini).normalize();
  // ultimo pedaco fica sem calha: e a junta com a chapa da concha, que ocupa o mesmo
  // lugar. A bola nao fica sem apoio ali — quem a sustenta ja e a concha.
  const pFim = labio.clone().addScaledVector(dir, -D.bolaR);
  const path = polyPath([ini, pFim, labio]);
  canalSobre(path, D.magLarg, bolaD, EST,
    G.calhas, 'Calha de retorno', 'Retorno de bolas', GEOM.calha.parede.v, 1);
  /* FILA DE ESPERA — a concha sozinha tem menos de um diametro de comprimento. Quem
     chega e nao e varrido na hora encosta na bola anterior, e a fila cresce PARA TRAS,
     dentro da propria calha de retorno. E um caminho so: a calha emendada na concha. */
  ELEV.rotaFila = polyPath(path.pts.concat(ELEV.rotaConcha.pts.slice(1)));
  /* So a PRIMEIRA bola espera dentro da concha, que e o volume que o copo varre. A
     segunda para antes disso, ainda na calha, senao o copo passaria por dentro dela. */
  const rVarre = D.tampaRaio + D.bolaR + g.folga.v;
  let s1 = ELEV.rotaFila.total;
  while (s1 > 0) {
    const q = ELEV.rotaFila.at(s1);
    if (Math.hypot(q.y - ELEV.y0, q.z - ELEV.z) > rVarre) break;
    s1 -= 1;
  }
  ELEV.sFila1 = Math.max(0, s1);
  CAL = { path, v: GEOM.calha.vBola.v };
  return CAL;
}

/* ============================================================================
   PAINEL DE BOTOES (1050 -> 1100)
   ========================================================================== */
function buildBotoes() {
  const b = GEOM.botoes, g = GEOM.gabinete;
  const alt = g.campoY0.v - g.painelY0.v, larg = D.interna;
  // recuo do painel: sai da meia-diagonal do maior botao inclinado, para o corpo
  // dele nao encostar na frente da coluna
  const ri = b.incl.v * Math.PI / 180;
  const meiaZ = b.dGrande.v / 2 * Math.cos(ri) + b.corpoA.v / 2 * Math.sin(ri);
  const painel = at(box(larg, GEOM.eixo.placaE.v, alt / Math.cos(ri), EST),
    0, (g.campoY0.v + g.painelY0.v) / 2, D.lado / 2 - g.parede.v - meiaZ - g.folga.v);
  painel.rotation.x = ri;          // borda da frente mais baixa: olha para o jogador
  G.botoes.add(reg(painel, 'Painel de botões', 'Botões', EST, dimsOf(larg, alt, GEOM.eixo.placaE.v)));

  // espacamento simetrico: o grande no centro, os pequenos em passo igual
  const n = b.nPequenos.v, passo = larg / (n + 2);
  const y = painel.position.y, z = painel.position.z;
  // botao arcade: capa para CIMA, acima da chapa do painel, e corpo roscado para
  // baixo, dentro da coluna. E assim que ele fica instalado num painel de verdade.
  const cosI = Math.cos(ri), sinI = Math.sin(ri), offs = GEOM.eixo.placaE.v / 2 + b.capaE.v / 2;
  const bt = (dia, nome, x) => {
    const m = at(cyl(dia, b.capaE.v, EST, 'y'), x, y + offs * cosI, z + offs * sinI);
    m.rotation.x = ri;
    det(m, at(cyl(dia - 2 * b.aro.v, b.corpoA.v, EST, 'y'), 0, -(b.corpoA.v + b.capaE.v) / 2, 0));
    G.botoes.add(reg(m, nome, 'Botões', EST, dimsOf(dia, dia, b.capaE.v + b.corpoA.v)));
  };
  bt(b.dGrande.v, 'Botão arcade Ø60 iluminado (SOLTAR)', 0);
  for (let i = 0; i < n; i++) {
    const k = i - (n - 1) / 2;
    bt(b.dPequeno.v, 'Botão arcade Ø30 iluminado', k * passo + (k >= 0 ? passo / 2 : -passo / 2));
  }
}

/* ============================================================================
   TELAS — LCD do campo (orientacao e parametro) e barra da testeira
   ========================================================================== */
let TELA = null;
function buildTelas(orient) {
  const t = GEOM.telas, g = GEOM.gabinete;
  const ret = orient === 'retrato';
  const mc = ret ? t.campoMoldA.v : t.campoMoldC.v, ma = ret ? t.campoMoldC.v : t.campoMoldA.v;
  const ac = ret ? t.campoAtivaA.v : t.campoAtivaC.v, aa = ret ? t.campoAtivaC.v : t.campoAtivaA.v;
  // centrada na zona de queda, mas presa dentro do campo: o acrilico e maior que a
  // moldura e, solto, desce abaixo do plano da boca e bate no bocal do buraco
  const meia = ma / 2 + g.folga.v;
  const yc = U.clamp((D.ySoltura + D.yBoca) / 2,
    D.yBoca + GEOM.boca.parede.v + meia, D.yCampo1 - meia);
  const zFrente = g.planoTrilhoZ.v - t.campoRecuo.v;
  G.telas.add(reg(at(box(mc, ma, t.campoMoldE.v, CAT), 0, yc, zFrente - t.campoMoldE.v / 2),
    'LCD 15,6" do campo (moldura)', 'Telas', CAT, dimsOf(mc, ma, t.campoMoldE.v)));
  G.telas.add(reg(at(planoTela(ac, aa), 0, yc, zFrente + 0.2),
    'LCD 15,6" do campo (área ativa)', 'Telas', CAT, dimsOf(ac, aa, 0)));
  // sobra lateral so na largura: em altura ele acompanha a moldura, senao o topo dele
  // fecha a janela por onde o tubo de carga atravessa o plano dos trilhos
  G.telas.add(reg(at(box(mc + 2 * t.acrilicoFolga.v, ma, t.acrilicoE.v, EST),
    0, yc, zFrente + t.acrilicoE.v / 2 + g.folga.v), 'Acrílico de proteção da tela', 'Telas', EST,
    dimsOf(mc + 2 * t.acrilicoFolga.v, ma, t.acrilicoE.v)));

  const yBarra = (D.alturaExt + D.yCampo1) / 2, zBarra = D.lado / 2 - g.parede.v - t.barraMoldE.v / 2;
  G.telas.add(reg(at(box(t.barraMoldC.v, t.barraMoldA.v, t.barraMoldE.v, EST), 0, yBarra, zBarra),
    'Barra 12,6" da testeira (moldura)', 'Telas', EST, dimsOf(t.barraMoldC.v, t.barraMoldA.v, t.barraMoldE.v)));
  G.telas.add(reg(at(planoTela(t.barraAtivaC.v, t.barraAtivaA.v),
    0, yBarra, zBarra + t.barraMoldE.v / 2 + 0.2), 'Barra 12,6" da testeira (área ativa)', 'Telas', CAT,
    dimsOf(t.barraAtivaC.v, t.barraAtivaA.v, 0)));
  TELA = { orient, mc, ma, yc, zFrente };
}

/* ============================================================================
