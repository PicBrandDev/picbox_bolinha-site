<meta charset="utf-8">
<title>Elevador PICBOX 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Folha de desenho tecnico: carimbo em cima, vista 3D grande com os nomes das pecas, comandos da cabine embaixo */
:root{
  --paper:#eef1ee; --sheet:#fbfcfa; --ink:#1b231f; --muted:#5b6862; --rule:#cfd7d2;
  --accent:#2753d6; --pin:#c23b6b; --scene:#f4f6f4; --tag:#ffffffe8; --tag-ink:#1b231f; --tag-muted:#4e5b55; --tag-rule:#c9d1cc;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101412; --sheet:#161b18; --ink:#e1e8e3; --muted:#99a69f; --rule:#2b332f;
  --accent:#7f9dff; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#101412; --sheet:#161b18; --ink:#e1e8e3; --muted:#99a69f; --rule:#2b332f;
  --accent:#7f9dff; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;
  display:flex;flex-direction:column;gap:10px}
.carimbo{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);background:var(--sheet)}
.carimbo>div{padding:6px 12px;border-left:1px solid var(--ink);display:flex;flex-direction:column;min-width:0}
.carimbo>div:first-child{border-left:0;flex:1 1 260px}
.lbl{font:600 .72rem var(--f-disp);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:700 1.6rem/1.05 var(--f-disp);margin:0;text-wrap:balance}
.v{font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.vista{position:relative;flex:none;height:max(480px,82vh);border:1px solid var(--rule);background:var(--scene);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;display:flex;align-items:center;gap:6px;transform:translate(-4px,-50%);white-space:nowrap}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--pin);flex:none;box-shadow:0 0 0 2px var(--scene)}
.tag span{position:relative;background:var(--tag);border:1px solid var(--tag-rule);padding:2px 7px;font-size:.8rem;color:var(--tag-ink)}
.tag b{font-weight:600}
.tag small{color:var(--tag-muted);font-size:.74rem}
.tags.sem-desc small{display:none}
.tags[hidden]{display:none!important}
.dica{position:absolute;left:10px;bottom:8px;font-size:.75rem;color:var(--tag-muted);pointer-events:none}
.barra{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:8px 12px}
.campo{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0}
.campo input{flex:1;min-width:0;accent-color:var(--accent)}
.campo output{font-family:var(--f-mono);font-size:.82rem;min-width:9ch;text-align:right;font-variant-numeric:tabular-nums}
button{font:600 .8rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);padding:5px 10px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.estado{font-size:.82rem;color:var(--muted);flex-basis:100%}
@media (max-width:600px){ .tag small{display:none} h1{font-size:1.3rem} }
@media (prefers-reduced-motion:reduce){ #bt-anim{display:none} }
</style>

<div class="carimbo" role="group" aria-label="Carimbo">
  <div><span class="lbl">Desenho</span><h1>Elevador · PICBOX Compacta R2.2</h1></div>
  <div><span class="lbl">Vista</span><span class="v">sem a torre</span></div>
  <div><span class="lbl">Curso da cabine</span><span class="v" id="c-curso"></span></div>
  <div><span class="lbl">Unidade</span><span class="v">mm</span></div>
</div>

<div class="vista" id="vista">
  <canvas id="c3d" aria-label="Elevador em 3D: arraste para girar, role para aproximar"></canvas>
  <div class="tags" id="tags"></div>
  <div class="dica">Arraste para girar · role para aproximar · botão direito arrasta</div>
</div>

<div class="barra">
  <div class="campo"><label class="lbl" for="in-z">Cabine</label><input type="range" id="in-z" step="0.5"><output id="o-z"></output></div>
  <div class="btns">
    <button class="pri" id="bt-anim" type="button" aria-pressed="false">Animar subida</button>
    <button id="bt-img" type="button">Vista da imagem</button>
    <button id="bt-frente" type="button">Frente</button>
    <button id="bt-lado" type="button">Lado</button>
    <button id="bt-nomes" type="button" aria-pressed="true">Nomes</button>
  </div>
  <p class="estado" id="estado">O motor gira a polia de cima, a correia puxa a cabine e a bola sobe até o bolso.</p>
</div>

const $ = id => document.getElementById(id);
const dec = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const vista = $("vista"), cv = $("c3d");
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
const cena = new THREE.Scene();
const ESC = 235;
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -5000, 5000);
cam.up.set(0, 0, 1);
cena.add(new THREE.HemisphereLight(0xffffff, 0x8a9690, 0.75));
const sol = new THREE.DirectionalLight(0xffffff, 0.55); cena.add(sol);
const sol2 = new THREE.DirectionalLight(0xffffff, 0.25); sol2.position.set(-1, -0.6, 0.4); cena.add(sol2);

const andam = [];
for (const m of D.malhas) {
  const v = dec(m.v, Float32Array), t = dec(m.t, Uint32Array);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(v.slice(), 3));
  g.setIndex(new THREE.BufferAttribute(t, 1));
  g.computeVertexNormals();
  const op = m.op;
  const mat = new THREE.MeshStandardMaterial({ color: m.cor, roughness: 0.62, metalness: 0.08, transparent: op < 1, opacity: op,
    depthWrite: op >= 1, side: THREE.DoubleSide, flatShading: false });
  const me = new THREE.Mesh(g, mat);
  if (op < 1) me.renderOrder = 2;
  cena.add(me);
  if (m.dv) andam.push({ g, v0: v, dv: dec(m.dv, Float32Array) });
}
const matBola = new THREE.MeshStandardMaterial({ color: 0xd9dde3, roughness: 0.18, metalness: 0.85 });
const geoBola = new THREE.SphereGeometry(D.r, 40, 28);
const bolaCab = new THREE.Mesh(geoBola, matBola), bolaBolso = new THREE.Mesh(geoBola, matBola);
bolaBolso.position.set(...D.bola_bolso);
cena.add(bolaCab, bolaBolso);

// nomes
let els_i = 0;
const tags = $("tags");
const els = D.rot.map(([nome, desc]) => {
  const e = document.createElement("div"); e.className = "tag";
  e.innerHTML = `<i></i><span><b></b> <small></small></span>`;
  e.querySelector("b").textContent = nome; e.querySelector("small").textContent = "· " + desc;
  e.querySelector("span").style.top = (D.rot[els_i++][4] || 0) + "px";
  tags.appendChild(e); return e;
});

let zc = D.z0;
const zin = $("in-z");
zin.min = D.z0; zin.max = D.z1; zin.value = D.z0;
$("c-curso").textContent = (D.z1 - D.z0).toFixed(0) + " mm";

function poe(z) {
  zc = Math.min(D.z1, Math.max(D.z0, z));
  const k = zc - D.z0;
  for (const a of andam) {
    const p = a.g.attributes.position.array;
    for (let i = 0; i < p.length; i++) p[i] = a.v0[i] + a.dv[i] * k;
    a.g.attributes.position.needsUpdate = true;
    a.g.computeBoundingSphere();
  }
  bolaCab.position.set(D.bola_cab[0], D.bola_cab[1], D.bola_cab[2] + k);
  zin.value = zc;
  $("o-z").textContent = k.toFixed(0) + " / " + (D.z1 - D.z0).toFixed(0);
}

const ctl = new THREE.OrbitControls(cam, cv);
ctl.enableDamping = true; ctl.dampingFactor = 0.12; ctl.zoomSpeed = 1.1;
function olha(dir, zoom = 1) {
  const d = new THREE.Vector3(...dir).normalize();
  cam.position.copy(d.multiplyScalar(2000)); cam.zoom = zoom; cam.updateProjectionMatrix();
  ctl.target.set(0, 0, 0); ctl.update();
}
function tam() {
  const w = vista.clientWidth, h = vista.clientHeight, a = w / h;
  ren.setSize(w, h, false);
  cam.left = -ESC * a; cam.right = ESC * a; cam.top = ESC; cam.bottom = -ESC; cam.updateProjectionMatrix();
  tags.classList.toggle("sem-desc", w < 700);
}
new ResizeObserver(tam).observe(vista);

const vtmp = new THREE.Vector3();
function nomes() {
  if (tags.hidden) return;
  const w = vista.clientWidth, h = vista.clientHeight, k = zc - D.z0;
  D.rot.forEach((r, i) => {
    vtmp.set(r[2][0], r[2][1], r[2][2] + (r[3] ? k : 0)).project(cam);
    const e = els[i];
    e.style.left = ((vtmp.x + 1) / 2 * w) + "px"; e.style.top = ((1 - vtmp.y) / 2 * h) + "px";
  });
}

// animacao: N20 100 rpm x polia de 20 dentes (40 mm por volta) = 66,7 mm/s
const VEL = 100 / 60 * 40;
let anim = null;
function fase(txt) { $("estado").textContent = txt; }
const roteiro = [
  { ate: () => D.z1, dir: 1, txt: "Subindo: o N20 gira a polia de cima, a correia puxa a cabine (≈67 mm/s)." },
  { espera: 1.6, antes: () => { bolaCab.visible = false; bolaBolso.visible = true; }, txt: "Topo: o sensor de cima para o motor e a bola rola para o bolso." },
  { ate: () => D.z0, dir: -1, txt: "Descendo: o motor gira ao contrário até o sensor de baixo." },
  { espera: 1.6, antes: () => { bolaBolso.visible = false; bolaCab.visible = true; }, txt: "Embaixo: a comporta solta a próxima bola na cabine." }];
function liga(on) {
  $("bt-anim").setAttribute("aria-pressed", on); $("bt-anim").textContent = on ? "Parar" : "Animar subida";
  if (!on) { anim = null; return; }
  if (zc > D.z0 + 1) poe(D.z0);
  bolaCab.visible = true; bolaBolso.visible = false;
  anim = { i: 0, t: 0 }; fase(roteiro[0].txt);
}
let ult = performance.now();
function quadro(t) {
  const dt = Math.min(0.25, (t - ult) / 1000); ult = t;
  if (anim) {
    const f = roteiro[anim.i];
    let fim = false;
    if (f.espera) { anim.t += dt; fim = anim.t >= f.espera; }
    else { poe(zc + f.dir * VEL * dt); fim = f.dir > 0 ? zc >= f.ate() : zc <= f.ate(); }
    if (fim) { anim.i = (anim.i + 1) % roteiro.length; anim.t = 0; const g = roteiro[anim.i]; if (g.antes) g.antes(); fase(g.txt); }
  }
  ctl.update();
  sol.position.copy(cam.position).add(new THREE.Vector3(0, 0, 900));
  ren.setClearColor(css("--scene") || "#f4f6f4");
  ren.render(cena, cam);
  nomes();
  requestAnimationFrame(quadro);
}

zin.addEventListener("input", () => { if (anim) liga(false); bolaCab.visible = true; bolaBolso.visible = true; poe(+zin.value); });
$("bt-anim").onclick = () => liga(!anim);
$("bt-img").onclick = () => olha(D.cam);
$("bt-frente").onclick = () => olha([0, -1, 0.0001]);
$("bt-lado").onclick = () => olha([1, 0, 0.0001]);
$("bt-nomes").onclick = e => { tags.hidden = !tags.hidden; e.currentTarget.setAttribute("aria-pressed", !tags.hidden); };

tam(); olha(D.cam); poe(D.z0 + 150);
requestAnimationFrame(quadro);
