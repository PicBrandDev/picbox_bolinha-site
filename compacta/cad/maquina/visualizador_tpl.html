<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PICBOX Compacta R2 · Visualizador 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --panel2:#f2f5f8; --ink:#16202a; --muted:#5d6b78; --rule:#d7dee5; --rule2:#c4ced8;
  --accent:#1f6feb; --accent-ink:#ffffff; --sel:#ffb000; --hover:#59a6ff;
  --imp:#5b84c4; --anda:#e2893a; --metal:#a9b1b8; --correia:#2b2e31; --eva:#4d9a6a; --sensor:#d6246e; --nova:#d6246e; --alt:#f2a516;
  --vp1:#f7f9fb; --vp2:#d7dee6; --ok:#1f8a4c; --warn:#b26a00; --bad:#c0392b;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --panel:#161d23; --panel2:#1c252c; --ink:#e3e9ee; --muted:#93a1ad; --rule:#28333c; --rule2:#34414c;
  --accent:#5b9dff; --accent-ink:#0b1117; --vp1:#2a333b; --vp2:#12181d; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1418; --panel:#161d23; --panel2:#1c252c; --ink:#e3e9ee; --muted:#93a1ad; --rule:#28333c; --rule2:#34414c;
  --accent:#5b9dff; --accent-ink:#0b1117; --vp1:#2a333b; --vp2:#12181d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);overflow:hidden}
button{font:inherit;color:inherit}
.app{display:grid;height:100vh;height:100dvh;grid-template-rows:auto 1fr auto;grid-template-columns:320px minmax(0,1fr) 330px;
  grid-template-areas:"top top top" "left vp right" "bot bot bot"}
/* barra de cima */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--rule)}
.top .logo{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.top .logo b{font-size:15px;letter-spacing:.02em}
.top .logo span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font:500 12px var(--f);padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--rule);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--rule))}
.tbtn{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12.5px}
.tbtn:hover{border-color:var(--rule2);background:var(--panel2)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* paineis */
.left,.right{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.left{grid-area:left;border-right:1px solid var(--rule)}
.right{grid-area:right;border-left:1px solid var(--rule)}
.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--panel2)}
.tab{flex:1;border:0;background:none;padding:9px 4px;font:600 12px var(--f);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
.scroll{overflow:auto;min-height:0;flex:1;padding:10px 12px}
.sec-t{font:700 12px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px}
.sec-t:first-child{margin-top:2px}
/* arvore */
.grp{margin-bottom:6px}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:5px;font-weight:600}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--muted);font-size:11px;width:10px}
.grp[open]>summary::before{content:"▾"}
.grp>summary:hover{background:var(--panel2)}
.grp>summary .n{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.item{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 22px;border-radius:5px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.item:hover{background:var(--panel2)}
.item.sel{background:color-mix(in srgb,var(--sel) 22%,transparent)}
.item .sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.15)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .eye{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:13px;line-height:1}
.item.off .nm{color:var(--muted);text-decoration:line-through}
/* cartoes */
.card{border:1px solid var(--rule);border-radius:8px;padding:10px 11px;margin-bottom:8px;background:var(--panel);cursor:pointer}
.card:hover{border-color:var(--rule2)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card h4{margin:0 0 3px;font-size:13px;display:flex;gap:8px;align-items:center}
.card .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sensor);color:#fff;font:700 11px var(--f);flex:none}
.card p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.card p b{color:var(--ink);font-weight:600}
.badge{display:inline-block;font:600 12px var(--f);padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--rule);color:var(--muted)}
/* montagem */
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stepper .big{font:700 22px var(--f);min-width:58px;text-align:center}
.stepper input{flex:1}
.step-t{font-weight:600;margin:4px 0 6px}
.note{font-size:13px;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:9px 10px}
.plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.plist button{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.plist button:hover{border-color:var(--accent)}
/* propriedades */
.prop h2{margin:2px 0 4px;font-size:17px;line-height:1.3}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.ptxt{font-size:13px;margin:8px 0 0}
.ptxt b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border-bottom:1px solid var(--rule);padding:5px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
details.faq{border:1px solid var(--rule);border-radius:8px;padding:7px 10px;margin-bottom:6px}
details.faq summary{cursor:pointer;font-weight:600;font-size:13px}
details.faq p{font-size:12.5px;color:var(--muted);margin:6px 0 0}
ul.lst{padding-left:18px;margin:4px 0;font-size:12.5px}
ul.lst li{margin-bottom:4px}
/* viewport */
.vp{grid-area:vp;position:relative;min-width:0;min-height:0;background:linear-gradient(180deg,var(--vp1),var(--vp2));overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .grpb{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:7px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hud .grpb .tbtn{border:0;border-radius:0;border-right:1px solid var(--rule)}
.hud .grpb .tbtn:last-child{border-right:0}
.sect{display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:3px 8px;font-size:12px}
.sect.on{display:flex}
.sect input{width:140px}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--rule);
  border-radius:7px;padding:6px 9px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.axes{position:absolute;right:10px;bottom:10px;width:84px;height:84px;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--sensor);color:#fff;font:700 11px var(--f);box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.35);cursor:pointer;user-select:none}
.pin.on{transform:translate(-50%,-50%) scale(1.25)}
.pin span{position:absolute;left:26px;white-space:nowrap;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:5px;
  padding:1px 6px;font:500 12px var(--f);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:2px 7px;font-size:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.15);display:none;white-space:nowrap}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted)}
/* barra de baixo */
.bot{grid-area:bot;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:7px 14px;background:var(--panel);border-top:1px solid var(--rule);font-size:12px}
.bot .sl{display:flex;align-items:center;gap:6px}
.bot .sl label{color:var(--muted);font-weight:600}
.bot .sl input{width:120px}
.bot .sl output{font-family:var(--mono);font-size:12px;min-width:54px}
.mouse{margin-left:auto;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.mouse kbd{font:500 12px var(--mono);background:var(--panel2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
@media (max-width:1100px){.app{grid-template-columns:270px minmax(0,1fr) 280px}}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto auto;grid-template-areas:"top" "vp" "bot" "right" "left"}
  .left,.right{border:0;border-top:1px solid var(--rule);max-height:none}
  .scroll{overflow:visible}
  .mouse{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><b>PICBOX Compacta · R2</b><span>Máquina A · gabinete 440 × 430 × 230 · visualizador 3D</span></div>
    <div class="chips" id="chips"></div>
  </header>

  <aside class="left">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="arvore" aria-selected="true">Peças</button>
      <button class="tab" role="tab" data-t="sensores" aria-selected="false">Sensores</button>
      <button class="tab" role="tab" data-t="montagem" aria-selected="false">Montagem</button>
      <button class="tab" role="tab" data-t="r2" aria-selected="false">R2</button>
      <button class="tab" role="tab" data-t="info" aria-selected="false">Info</button>
    </div>
    <div class="scroll" id="lp"></div>
  </aside>

  <main class="vp" id="vp">
    <canvas id="cv" tabindex="0" aria-label="Máquina em 3D. Botão do meio gira, Ctrl + botão do meio move, roda aproxima, clique seleciona."></canvas>
    <div class="load" id="load">Carregando o modelo…</div>
    <div id="pins"></div>
    <div class="tip" id="tip"></div>
    <div class="hud">
      <div class="grpb" role="group" aria-label="Vistas">
        <button class="tbtn" data-v="frente" title="Frontal (Ctrl+1)">Frontal</button>
        <button class="tbtn" data-v="tras" title="Posterior (Ctrl+2)">Trás</button>
        <button class="tbtn" data-v="esq" title="Esquerda (Ctrl+3)">Esq.</button>
        <button class="tbtn" data-v="dir" title="Direita (Ctrl+4)">Dir.</button>
        <button class="tbtn" data-v="topo" title="Superior (Ctrl+5)">Topo</button>
        <button class="tbtn" data-v="iso" title="Isométrica (Ctrl+7)">Iso</button>
        <button class="tbtn" id="b-fit" title="Ajustar à tela (F)">Ajustar</button>
      </div>
      <div class="grpb" role="group" aria-label="Exibição">
        <button class="tbtn" id="b-arestas" aria-pressed="true" title="Arestas pretas, como no CAD">Arestas</button>
        <button class="tbtn" id="b-raiox" aria-pressed="false" title="Peças semitransparentes">Raio-X</button>
        <button class="tbtn" id="b-comp" aria-pressed="true" title="Mostrar peças compradas">Compradas</button>
        <button class="tbtn" id="b-sens" aria-pressed="true" title="Mostrar a posição dos sensores">Sensores</button>
        <button class="tbtn" id="b-corte" aria-pressed="false" title="Vista em corte">Corte</button>
      </div>
      <div class="sect" id="sect">
        <span>Corte</span>
        <button class="tbtn" data-ax="0">X</button><button class="tbtn" data-ax="1" aria-pressed="true">Y</button><button class="tbtn" data-ax="2">Z</button>
        <input type="range" id="sect-v" min="0" max="1000" value="600" aria-label="Posição do corte">
        <button class="tbtn" id="sect-inv" title="Inverter o lado">⇄</button>
      </div>
      <div class="grpb" role="group" aria-label="Mouse" style="margin-left:auto">
        <button class="tbtn" id="b-mouse" title="Trocar o jeito do mouse">Mouse: SolidWorks</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <canvas class="axes" id="axes" width="168" height="168"></canvas>
  </main>

  <aside class="right">
    <div class="tabs"><span class="tab" aria-selected="true" style="cursor:default">Propriedades</span></div>
    <div class="scroll" id="rp"></div>
  </aside>

  <footer class="bot">
    <button class="tbtn" id="b-anim" aria-pressed="false">▶ Simular jogada</button>
    <div class="sl"><label for="s-a">Carro A</label><input type="range" id="s-a" step="0.5"><output id="o-a"></output></div>
    <div class="sl"><label for="s-b">Carro B</label><input type="range" id="s-b" step="0.5"><output id="o-b"></output></div>
    <div class="sl"><label for="s-z">Cabine</label><input type="range" id="s-z" step="0.5"><output id="o-z"></output></div>
    <div class="sl"><label for="s-t">Comporta</label><input type="range" id="s-t" step="0.1"><output id="o-t"></output></div>
    <div class="mouse" id="mouse-hint"></div>
  </footer>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script>window.D = __DADOS__;</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const D = window.D, M = D.m;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const f1 = v => Number(v).toLocaleString("pt-BR", {maximumFractionDigits: 1});
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const POS = {"Z": "em pé, como monta", "Z-": "de cabeça para baixo", "+X": "deitada sobre a lateral direita",
  "-X": "deitada sobre a lateral esquerda", "+Y": "deitada de costas", "-Y": "em pé sobre a frente"};
const ANDA = new Set(["carro", "alavanca", "carroA", "carroB"]);
const SENSOR_PECAS = new Set(["Fim de curso", "Sensor de fenda", "Sensor do bolso", "LED IR / fototransistor 5 mm", "Bandeira"]);

/* ---------------------------------------------------------------- cena */
const cv = $("cv"), vp = $("vp");
const ren = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: false});
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.localClippingEnabled = true;
const sc = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 5, 20000);
cam.up.set(0, 0, 1);
sc.add(new THREE.HemisphereLight(0xffffff, 0x8892a0, 1.15));
const l1 = new THREE.DirectionalLight(0xffffff, 1.35); l1.position.set(-500, -800, 1000); sc.add(l1);
const l2 = new THREE.DirectionalLight(0xffffff, 0.45); l2.position.set(700, 600, 300); sc.add(l2);

const corpos = {mundo: new THREE.Group(), carro: new THREE.Group(), alavanca: new THREE.Group(), carroA: new THREE.Group(), carroB: new THREE.Group()};
const piv = new THREE.Group(); piv.position.set(...M.piv); piv.add(corpos.alavanca); sc.add(piv);
["mundo", "carro", "carroA", "carroB"].forEach(k => sc.add(corpos[k]));

const corte = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e5);
let corteOn = false;
const COR = {imp: css("--imp"), anda: css("--anda"), metal: css("--metal"), correia: css("--correia"), eva: css("--eva"),
  sensor: css("--sensor"), sel: css("--sel"), hover: css("--hover"), nova: css("--nova"), alt: css("--alt")};
const edgeMat = new THREE.LineBasicMaterial({color: 0x1b232b, transparent: true, opacity: .42, clippingPlanes: [corte]});

const objetos = [];          // {mesh, edges, peca, base, comprada, corpo}
function material(cor, metal) {
  return new THREE.MeshStandardMaterial({color: new THREE.Color(cor), roughness: metal ? .38 : .62, metalness: metal ? .55 : .04,
    side: THREE.DoubleSide, clippingPlanes: [corte], polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1});
}
function registra(mesh, peca, base, comprada, corpo, comAresta = true) {
  let edges = null;
  if (comAresta) {
    edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), edgeMat);
    mesh.add(edges);
  }
  mesh.userData = {peca};
  objetos.push({mesh, edges, peca, base, comprada, corpo, metal: mesh.material.metalness > .3});
}
const b64 = (s, T) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); };
const offCorpo = c => c === "carro" ? [0, 0, -M.zc[0]] : c === "alavanca" ? M.piv.map(v => -v) : [0, 0, 0];
const reais = new Set();
for (const o of D.malhas) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(b64(o.v, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(o.t, Uint32Array), 1));
  g.computeVertexNormals();
  reais.add(o.peca);
  const cor = SENSOR_PECAS.has(o.peca) ? COR.sensor : ANDA.has(o.corpo) ? COR.anda : COR.imp;
  for (const d of o.copias) {
    const me = new THREE.Mesh(g, material(cor, false));
    const off = offCorpo(o.corpo);
    me.position.set(d[0] + off[0], d[1] + off[1], d[2] + off[2]);
    corpos[o.corpo].add(me);
    registra(me, o.peca, cor, false, o.corpo);
  }
}
function geom(e) {
  if (e.t === "box") return new THREE.BoxGeometry(2 * e.s[0], 2 * e.s[1], 2 * e.s[2]);
  if (e.t === "cylinder") { const g = new THREE.CylinderGeometry(e.s[0], e.s[0], 2 * e.s[1], 32); g.rotateX(Math.PI / 2); return g; }
  const sh = new THREE.Shape(); sh.absarc(0, 0, e.s[1], 0, Math.PI * 2, false);
  const h = new THREE.Path(); h.absarc(0, 0, e.s[0], 0, Math.PI * 2, true); sh.holes.push(h);
  const g = new THREE.ExtrudeGeometry(sh, {depth: 2 * e.s[2], bevelEnabled: false, curveSegments: 40}); g.translate(0, 0, -e.s[2]); return g;
}
function corDe(e) {
  if (SENSOR_PECAS.has(e.peca)) return COR.sensor;
  if (e.cor === "correia") return COR.correia;
  if (e.cor === "eva") return COR.eva;
  const tp = (D.pecas[e.peca] || {}).tipo;
  if (tp === "impressa") return ANDA.has(e.c) ? COR.anda : COR.imp;
  return COR.metal;
}
for (const e of D.geo) {
  const tp = (D.pecas[e.peca] || {}).tipo;
  const cor = corDe(e);
  const me = new THREE.Mesh(geom(e), material(cor, cor === COR.metal));
  me.position.set(...e.p); me.quaternion.set(e.q[1], e.q[2], e.q[3], e.q[0]);
  (corpos[e.c] || corpos.mundo).add(me);
  registra(me, e.peca, cor, tp !== "impressa", e.c, e.cor !== "correia");
}
/* ramo da correia preso na cabine: o comprimento muda com a cabine */
const ida = [0, 1].map(() => {
  const me = new THREE.Mesh(new THREE.BoxGeometry(1.4, M.ida.y[1] - M.ida.y[0], 1), material(COR.correia, false));
  me.position.set(M.ida.x, (M.ida.y[0] + M.ida.y[1]) / 2, 0);

  if (id.startsWith("fenda")) { sZ.value = id === "fenda_cima" ? M.zc[1] : M.zc[0]; pose(); }
  if (id === "fdc_casa_A") { sA.value = M.cA[0] + M.dA; pose(); }
  if (id === "fdc_seg_A") { sA.value = M.cA[1] + M.dA; pose(); }
  if (id === "fdc_casa_B") { sB.value = M.cB[0]; pose(); }
  const p = sensorPos(s), d = id.startsWith("fdc") ? [.35, -1, .45] : id.startsWith("fenda") ? [.8, -.6, .45] : [-.4, -1, .6];
  const b = new THREE.Box3().setFromCenterAndSize(p, new THREE.Vector3(90, 90, 90));
  enquadra(b, d);
  painelSensores();
}
function pinos() {
  const box = $("pins");
  if (!pinsOn || etapaAtual !== null || isolada) { box.innerHTML = ""; return; }
  if (box.children.length !== D.sensores.length) box.innerHTML = D.sensores.map((s, i) => `<div class="pin" data-pin="${s.id}" title="${esc(s.nome)}">${i + 1}<span hidden></span></div>`).join("");
  const w = cv.clientWidth, h = cv.clientHeight;
  D.sensores.forEach((s, i) => {
    const el = box.children[i], v = sensorPos(s).project(cam);
    const fora = v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05;
    el.style.display = fora ? "none" : "grid";
    el.style.left = ((v.x + 1) / 2 * w) + "px"; el.style.top = ((1 - v.y) / 2 * h) + "px";
    el.classList.toggle("on", s.id === sensSel);
    const lab = el.querySelector("span"); lab.hidden = s.id !== sensSel; lab.textContent = s.nome;
  });
}
$("pins").addEventListener("click", ev => { const p = ev.target.closest("[data-pin]"); if (!p) return;
  document.querySelector('.tab[data-t="sensores"]').click(); focoSensor(p.dataset.pin); });
/* montagem */
function painelMontagem() {
  const i = D.etapas.findIndex(e => e.n === etapaAtual), e = D.etapas[i];
  $("lp").innerHTML = `<div class="sec-t">Montagem passo a passo</div>
    <div class="stepper"><button class="tbtn" id="m-ant" aria-label="Etapa anterior">◀</button>
      <span class="big">${i + 1}<span style="font-size:13px;color:var(--muted)">/${D.etapas.length}</span></span>
      <button class="tbtn" id="m-prox" aria-label="Próxima etapa">▶</button>
      <input type="range" id="m-sl" min="0" max="${D.etapas.length - 1}" value="${i}" aria-label="Etapa"></div>
    <div class="step-t">Etapa ${e.n} · ${esc(e.t)}</div>
    ${e.nota ? `<div class="note">${esc(e.nota)}</div>` : ""}
    <div class="sec-t">Peças desta etapa (amarelo no 3D)</div>
    <div class="plist">${e.pecas.map(p => `<button data-p="${esc(p)}">${esc(nomeBonito(p))}</button>`).join("") || "<span style='color:var(--muted)'>—</span>"}</div>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">O 3D mostra só o que já está montado até esta etapa. As etapas seguem a ordem em que a checagem conferiu o acesso da chave em cada parafuso.</p>
    <div class="sec-t">Todas as etapas</div>
    <ol style="padding-left:20px;margin:0;font-size:12.5px">${D.etapas.map((x, k) => `<li style="margin-bottom:3px;${k === i ? "font-weight:700" : ""}"><a href="#" data-k="${k}" style="color:inherit">${esc(x.t)}</a></li>`).join("")}</ol>`;
  const vai = k => { etapaAtual = D.etapas[Math.max(0, Math.min(D.etapas.length - 1, k))].n; estado(); painelMontagem(); focoEtapa(); };
  $("m-ant").onclick = () => vai(i - 1); $("m-prox").onclick = () => vai(i + 1);
  $("m-sl").oninput = ev => vai(+ev.target.value);
  $("lp").querySelectorAll("[data-k]").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); vai(+a.dataset.k); }));
  $("lp").querySelectorAll(".plist [data-p]").forEach(b => b.addEventListener("click", () => selecionar(b.dataset.p, false, true)));
}
function focoEtapa() {
  const e = D.etapas.find(x => x.n === etapaAtual); if (!e) return;
  const b = caixaVisivel(o => e.pecas.includes(o.peca));
  if (!b.isEmpty()) { b.expandByScalar(40); enquadra(b); }
}
/* R2 */
function painelR2() {
  const N = D.novo;
  $("lp").innerHTML = `<div class="sec-t">O que mudou na R2</div>
    <p style="font-size:12.5px;margin:0 0 8px">No 3D: <b style="color:${COR.alt}">amarelo</b> = impressa nova ou alterada, <b style="color:${COR.nova}">rosa</b> = comprada nova, o resto fica apagado.</p>
    ${N.focos.map((f, i) => `<div class="card" data-f="${i}" role="button" tabindex="0"><h4>${esc(f.nome)}</h4><p>${esc(f.txt)}</p></div>`).join("")}
    <div class="sec-t">Peças alteradas</div><div class="plist">${N.alteradas.map(p => `<button data-p="${esc(p)}">${esc(nomeBonito(p))}</button>`).join("")}</div>
    <div class="sec-t">Compradas novas</div><div class="plist">${N.compradas.map(p => `<button data-p="${esc(p)}">${esc(nomeBonito(p))}</button>`).join("")}</div>`;
  $("lp").querySelectorAll("[data-f]").forEach(c => c.addEventListener("click", () => {
    const f = N.focos[+c.dataset.f];
    sA.value = f.a; sB.value = f.b; if (f.z !== null && f.z !== undefined) sZ.value = f.z; pose();
    const alvo = new THREE.Vector3(...f.alvo), d = new THREE.Vector3(...f.dir).normalize();
    voa(alvo.clone().add(d.multiplyScalar(f.dist * 2.2)).toArray(), f.alvo);
    $("lp").querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === c));
  }));
  $("lp").querySelectorAll(".plist [data-p]").forEach(b => b.addEventListener("click", () => selecionar(b.dataset.p, false, true)));
}
/* info */
function painelInfo() {
  $("lp").innerHTML = `<div class="sec-t">Cabos (a eletrônica fica fora da caixa)</div>
    <table><thead><tr><th>Cabo</th><th>Caminho</th></tr></thead><tbody>${D.cabos.map(c => `<tr><td><b>${esc(c[0])}</b></td><td>${esc(c[1])}. ${esc(c[2])}</td></tr>`).join("")}</tbody></table>
    <div class="sec-t">Regras do programa</div><ul class="lst">${D.firmware.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="sec-t">Testar na bancada primeiro</div><ul class="lst">${D.riscos.map(r => `<li><b>${esc(r[0])}.</b> ${esc(r[1])}</li>`).join("")}</ul>
    <div class="sec-t">Perguntas e respostas</div>${D.faq.map(q => `<details class="faq"><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join("")}`;
}

/* ---------------------------------------------------------------- movimento */
const sA = $("s-a"), sB = $("s-b"), sZ = $("s-z"), sT = $("s-t");
sA.min = M.cA[0] + M.dA; sA.max = M.cA[1] + M.dA; sA.value = 0;
sB.min = M.cB[0]; sB.max = M.cB[1]; sB.value = 0;
sZ.min = M.zc[0]; sZ.max = M.zc[1]; sZ.value = M.zc[0];
sT.min = 0; sT.max = M.ang; sT.value = M.ang;
function pose() {
  $("o-a").textContent = "X " + f1(+sA.value); $("o-b").textContent = "X " + f1(+sB.value);
  $("o-z").textContent = "Z " + f1(+sZ.value); $("o-t").textContent = f1(+sT.value) + "°";
  corpos.carroA.position.x = +sA.value - M.dA;
  corpos.carroB.position.x = +sB.value;
  corpos.carro.position.z = +sZ.value;
  poseIda(+sZ.value);
  piv.rotation.y = THREE.MathUtils.degToRad(+sT.value);
  esteira("A", +sA.value - M.dA); esteira("B", +sB.value);
}
[sA, sB, sZ, sT].forEach(s => s.addEventListener("input", () => { pararAnim(); pose(); }));
let anim = false, t0 = 0;
const bA = $("b-anim");
function pararAnim() { anim = false; bA.setAttribute("aria-pressed", "false"); bA.textContent = "▶ Simular jogada"; caindo.visible = false; presa.visible = true; }
bA.addEventListener("click", () => { if (anim) return pararAnim(); anim = true; t0 = performance.now(); bA.setAttribute("aria-pressed", "true"); bA.textContent = "■ Parar"; });
function passo() {
  const t = (performance.now() - t0) / 1000, A = M.curso, wA = 2 * Math.PI / 2.4, wB = 2 * Math.PI / 3.1, ciclo = 6, tc = t % ciclo;
  sA.value = A * Math.sin(wA * t); sB.value = A * Math.sin(wB * t + 1.2);
  sZ.value = M.zc[0] + (M.zc[1] - M.zc[0]) * (.5 - .5 * Math.cos(2 * Math.PI * t / ciclo));
  const ts = 2;
  if (tc >= ts && tc < ts + .5) {
    const tau = tc - ts, x0 = A * Math.sin(wA * (t - tau)), v = A * wA * Math.cos(wA * (t - tau)), z = M.zs - 9806.65 / 2 * tau * tau;
    presa.visible = false;
    if (z > 60) { caindo.visible = true; caindo.position.set(x0 + v * tau, M.yb, z); } else caindo.visible = false;
  } else { caindo.visible = false; presa.visible = tc < ts || tc > ciclo - 1.2; }
  pose();
}

/* ---------------------------------------------------------------- legenda, chips, eixos */
$("legend").innerHTML = [["--imp", "impressa"], ["--anda", "impressa que anda"], ["--metal", "comprada"], ["--sensor", "sensor"],
  ["--correia", "correia / esteira"], ["--eva", "EVA"]].map(([k, t]) => `<span><i style="background:${css(k)}"></i>${t}</span>`).join("");
const R = D.resumo;
$("chips").innerHTML = `<span class="chip ok">${R.interf === 0 ? "0 interferências" : R.interf + " interferências"}</span>
  <span class="chip ok">${R.par_ok}/${R.par} parafusos</span><span class="chip ok">${R.stl_ok}/${R.stl} peças ok</span>
  <span class="chip">${R.mesas} mesas · ~${Math.round(R.horas)} h na SparkX i7</span>`;
const ax = $("axes").getContext("2d");
function eixos() {
  const W = 168, c = W / 2; ax.clearRect(0, 0, W, W);
  const q = cam.quaternion.clone().invert();
  [["X", 0xd64545, [1, 0, 0]], ["Y", 0x2f9e57, [0, 1, 0]], ["Z", 0x2f6fd6, [0, 0, 1]]].map(([n, c0, v]) => {
    const p = new THREE.Vector3(...v).applyQuaternion(q); return {n, c0, p}; }).sort((a, b) => a.p.z - b.p.z).forEach(({n, c0, p}) => {
    const x = c + p.x * 52, y = c - p.y * 52, col = "#" + c0.toString(16).padStart(6, "0");
    ax.strokeStyle = col; ax.lineWidth = 5; ax.beginPath(); ax.moveTo(c, c); ax.lineTo(x, y); ax.stroke();
    ax.fillStyle = col; ax.beginPath(); ax.arc(x, y, 13, 0, 7); ax.fill();
    ax.fillStyle = "#fff"; ax.font = "bold 16px IBM Plex Sans, sans-serif"; ax.textAlign = "center"; ax.textBaseline = "middle"; ax.fillText(n, x, y + 1);
  });
}

/* ---------------------------------------------------------------- loop */
function tamanho() {
  const w = vp.clientWidth, h = vp.clientHeight;
  ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(tamanho).observe(vp);
function loop() {
  requestAnimationFrame(loop);
  if (tween) {
    const k = Math.min(1, (performance.now() - tween.s) / tween.ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    cam.position.lerpVectors(tween.p0, tween.p1, e); ctl.target.lerpVectors(tween.t0, tween.t1, e);
    if (k >= 1) tween = null;
  }
  if (anim) passo();
  ctl.update();
  ren.render(sc, cam);
  pinos(); eixos();
}
tamanho(); pose(); estado(); propriedades(); arvore();
window.V = {cam, ctl, objetos, get sel() { return sel; }, get etapa() { return etapaAtual; }};
cam.position.set(-900, -1200, 950); ctl.target.set(0, 110, 215); ctl.update();
vista("iso");
$("load").remove();
loop();
</script>
