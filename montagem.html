<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICBOX — montagem guiada</title>
<style>
:root{
  --bg:#0e1113; --bg2:#15191c; --bg3:#1c2226; --line:#2a3238; --line2:#384249;
  --fg:#e6ecef; --fg2:#9aa7ae; --acc:#2ad3d3; --warn:#ffb020; --err:#ff5a4d; --ok:#7bd88f;
  --imp:#e0892b; --imp2:#2b8fe0; --cat:#9aa3ab;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow:hidden}
a{color:var(--acc)}
#top{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;
  background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#brand{font-weight:700;letter-spacing:.14em;font-size:15px;white-space:nowrap}
#brand span{color:var(--acc)}
#brand small{font-weight:400;letter-spacing:0;color:var(--fg2);font-size:12px;margin-left:6px}
.tabs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tab{font:inherit;font-size:12.5px;color:var(--fg2);background:transparent;border:1px solid transparent;
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--bg3)}
.tab.on{color:#06232a;background:var(--acc);font-weight:600}
.tsep{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);padding:0 4px 0 10px;align-self:center;white-space:nowrap;border-left:1px solid var(--line)}
.xlink{color:var(--acc);text-decoration:none;font-size:12px;white-space:nowrap;
  padding:5px 9px;border:1px solid var(--line2);border-radius:6px;background:var(--bg3)}
.xlink:hover{color:var(--fg);border-color:var(--acc)}
#main{position:absolute;top:48px;left:0;right:0;bottom:0;display:grid;
  grid-template-columns:280px 1fr 380px}
#passos{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg2)}
#passos .cab{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
#passos .cab h2{margin:0;font-size:16px}
#passos .cab p{margin:4px 0 0;color:var(--fg2);font-size:12.5px}
#passos .cab .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--fg2);white-space:nowrap}
.chip.comprado{color:#0e1113;background:var(--cat);border-color:var(--cat)}
.chip.impresso{color:#1a0f02;background:var(--imp);border-color:var(--imp)}
.chip.falta{color:#1a0f02;background:var(--warn);border-color:var(--warn)}
.chip.fixador{color:var(--fg)}
.chip.medir{color:var(--warn);border-color:var(--warn)}
.chip.est{color:var(--acc);border-color:var(--acc)}
ol.lista{list-style:none;margin:0;padding:6px 0}
ol.lista li{display:flex;gap:10px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;color:var(--fg2)}
ol.lista li:hover{background:var(--bg3);color:var(--fg)}
ol.lista li.on{border-left-color:var(--acc);background:var(--bg3);color:var(--fg)}
ol.lista li.feito{color:var(--fg2)}
ol.lista li .n{flex:0 0 24px;height:24px;border-radius:50%;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px}
ol.lista li.on .n{background:var(--acc);border-color:var(--acc);color:#06232a;font-weight:700}
ol.lista li.feito .n{border-color:var(--ok);color:var(--ok)}
#palco{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1b2227,#0c0f11)}
#palco canvas{display:block}
#hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.btn{font:inherit;font-size:12.5px;color:var(--fg2);background:rgba(28,34,38,.92);
  border:1px solid var(--line2);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--fg);border-color:var(--acc)}
.btn.on{color:#06232a;background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.pri{color:#06232a;background:var(--acc);border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
#nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;align-items:center}
#nav .pos{font-family:var(--mono);font-size:12px;color:var(--fg2);min-width:64px;text-align:center}
#nav .btn{padding:10px 18px;font-size:13.5px;border-radius:999px}
#carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg2);z-index:6;
  background:rgba(14,17,19,.6);pointer-events:none;transition:opacity .3s}
#card{border-left:1px solid var(--line);overflow-y:auto;background:var(--bg2);padding:16px}
#card h3{margin:0 0 4px;font-size:18px;line-height:1.3}
#card .num{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em}
#card .txt{margin:10px 0 0}
#card h4{margin:16px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);font-weight:600}
.caixa{border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px}
.caixa.at{background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.45)}
.caixa.cf{background:rgba(123,216,143,.07);border:1px solid rgba(123,216,143,.4)}
.caixa b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.caixa.at b{color:var(--warn)} .caixa.cf b{color:var(--ok)}
.caixa ul{margin:0;padding-left:18px}
.itens{display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.item:hover{border-color:var(--acc)}
.item .q{font-family:var(--mono);font-weight:700;color:var(--acc);min-width:30px}
.item .nm{flex:1;font-size:13px}
.ferr{display:flex;gap:6px;flex-wrap:wrap}
.ferr span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg3);border:1px solid var(--line2)}
#ficha{position:absolute;right:12px;top:12px;width:340px;max-height:calc(100% - 90px);overflow-y:auto;z-index:7;
  background:rgba(21,25,28,.97);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:none}
#ficha.on{display:block}
#ficha h3{margin:0 24px 6px 0;font-size:15px}
#ficha .fechar{position:absolute;right:8px;top:8px}
#ficha .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
#ficha .kv span:first-child{color:var(--fg2)}
#ficha ul{margin:6px 0;padding-left:18px;font-size:13px}
.dl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dl a{font-size:12px;text-decoration:none;padding:5px 9px;border-radius:6px;border:1px solid var(--acc)}
.lbl3{font-family:var(--mono);font-size:11px;color:#06232a;background:var(--acc);padding:2px 6px;border-radius:4px;
  white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lbl3.f{background:#e6ecef}
/* paginas de texto (visao geral, pecas, imprimir) */
#pagina{position:absolute;top:48px;left:0;right:0;bottom:0;overflow-y:auto;display:none;padding:22px 16px 60px}
#pagina.on{display:block}
#pagina .col{max-width:980px;margin:0 auto}
#pagina h1{font-size:24px;margin:0 0 6px}
#pagina h2{font-size:17px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
#pagina p{color:#cfd8dc;max-width:760px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cartao{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg2);cursor:pointer}
.cartao:hover{border-color:var(--acc)}
.cartao h3{margin:0 0 4px;font-size:15px}
.cartao p{margin:0;font-size:13px;color:var(--fg2)}
.cartao.prox{cursor:default;opacity:.55}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);font-weight:600;
  padding:6px 8px;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.q{font-family:var(--mono);color:var(--acc);font-weight:700;white-space:nowrap}
table.t tr:hover td{background:var(--bg2)}
.tbl{overflow-x:auto}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.aviso{border:1px solid rgba(255,176,32,.45);background:rgba(255,176,32,.08);border-radius:10px;padding:12px 14px;margin:12px 0}
.aviso h3{margin:0 0 4px;font-size:14px;color:var(--warn)}
.aviso p{margin:4px 0;font-size:13.5px}
/* pop-up de explicacao */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(6,8,9,.62);padding:18px}
#modal.on{display:flex}
#modal .caixaM{width:min(760px,100%);max-height:calc(100vh - 36px);overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);
  border-radius:12px;padding:20px 22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h2{margin:0 30px 4px 0;font-size:20px}
#modal .sub{color:var(--fg2);font-size:13px;margin-bottom:10px}
#modal h4{margin:18px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
#modal p{margin:6px 0;line-height:1.55}
#modal ul{margin:4px 0;padding-left:20px;line-height:1.55}
#modal .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
#modal .kv span:first-child{color:var(--fg2)}
#modal .fechar{position:absolute;right:12px;top:12px}
#modal .fio{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:1px;margin-right:6px;border:1px solid rgba(255,255,255,.25)}
/* marcadores "por que e assim" */
.pq{pointer-events:auto;cursor:pointer;width:24px;height:24px;border-radius:50%;background:#ffb020;color:#1a1000;font:700 13px/24px system-ui;
  text-align:center;box-shadow:0 0 0 3px rgba(255,176,32,.28),0 3px 10px rgba(0,0,0,.5)}
.pq:hover{transform:scale(1.15)}
.pqItem{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-radius:6px;margin-top:5px;cursor:pointer;background:var(--bg)}
.pqItem:hover{border-color:#ffb020}
.pqItem b.n{flex:0 0 22px;height:22px;border-radius:50%;background:#ffb020;color:#1a1000;text-align:center;line-height:22px;font-size:12px}
/* legenda da animacao */
#legenda{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;max-width:min(680px,calc(100% - 24px));
  background:rgba(10,14,16,.9);border:1px solid var(--acc);border-radius:10px;padding:9px 14px;font-size:14px;line-height:1.4;display:none;text-align:center}
#legenda.on{display:block}
#legenda .bar{height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
#legenda .bar i{display:block;height:100%;background:var(--acc);width:0}
.roteiro{counter-reset:r}
.roteiro div{padding:5px 8px 5px 30px;position:relative;border-radius:6px;color:var(--fg2);font-size:13px;cursor:pointer}
.roteiro div:before{counter-increment:r;content:counter(r);position:absolute;left:6px;top:5px;width:18px;height:18px;border-radius:50%;
  border:1px solid var(--line2);font:11px/18px var(--mono);text-align:center}
.roteiro div.on{background:var(--bg3);color:var(--fg)}
.roteiro div.on:before{background:var(--acc);color:#06232a;border-color:var(--acc)}
.lblCabo{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;color:#fff;background:rgba(10,14,16,.85);
  border-left:4px solid;white-space:nowrap;pointer-events:auto;cursor:pointer}
@media (max-width:980px){
  body{overflow:auto}
  #main{position:static;display:flex;flex-direction:column;height:auto}
  #passos{order:3;border-right:0;border-top:1px solid var(--line);max-height:none}
  #palco{order:1;height:56vh;min-height:320px}
  #card{order:2;border-left:0;border-top:1px solid var(--line)}
  #ficha{left:8px;right:8px;width:auto;top:8px}
  #nav{bottom:10px}
  #nav .btn{padding:8px 14px}
}
</style>
</head>
<body>
<div id="top">
  <div id="brand">PIC<span>BOX</span><small>montagem guiada</small></div>
  <div class="tabs" id="tabs"></div>
  <span style="margin-left:auto"></span>
  <a class="xlink" href="modelo3d.html">modelo 3D &#8599;</a>
  <a class="xlink" href="index.html">simulador &#8599;</a>
</div>

<div id="main">
  <aside id="passos"></aside>
  <section id="palco">
    <div id="hud">
      <button class="btn" id="bRepete" title="repete a animação do passo (R)">&#8635; repetir</button>
      <button class="btn" id="bExplode" title="afasta as peças já montadas (E)">explodir</button>
      <button class="btn" id="bFantasma" title="deixa as peças antigas transparentes (F)">destacar o passo</button>
      <button class="btn" id="bVista" title="volta a câmera para a vista do passo (V)">câmera do passo</button>
      <button class="btn" id="bPlay" hidden title="pausa/continua a animação (espaço)">❚❚ pausar</button>
      <button class="btn" id="bVel" hidden title="velocidade da animação">1×</button>
    </div>
    <div id="ficha"></div>
    <div id="legenda"><span id="legTxt"></span><div class="bar"><i id="legBar"></i></div></div>
    <div id="nav">
      <button class="btn" id="bAnt">&#9664; anterior</button>
      <span class="pos" id="pos">–</span>
      <button class="btn pri" id="bProx">próximo &#9654;</button>
    </div>
    <div id="carregando">carregando peças…</div>
  </section>
  <aside id="card"></aside>
</div>
<div id="pagina"><div class="col" id="paginaCol"></div></div>
<div id="modal"><div class="caixaM" id="modalC"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIPO = { comprado: 'comprado', falta: 'falta comprar', impresso: 'impresso', fixador: 'ferragem', cortar: 'cortar' };
const SRC = { cat: 'cota de catálogo', est: 'cota de projeto', medir: 'conferir com paquímetro' };

if (!window.THREE || !THREE.GLTFLoader) {
  $('#carregando').innerHTML = 'three.js não carregou (sem internet?). Esta página busca a biblioteca em cdn.jsdelivr.net.';
  return;
}

/* ------------------------------------------------------------- estado */
let G = null;               // guia.json
let MOD = null;             // modulo corrente
let passo = 0;
let explodido = false, fantasma = false;
const glbCache = {};        // peca -> Promise<THREE.Group>
const objs = {};            // instancia -> { obj, peca, base:Vector3, centro, mats }
let anim = null;            // animacao de entrada das pecas novas
let filme = null;           // animacao de funcionamento do passo (p.anim)
let cabosGrp = null;        // cabos do modulo (tubos clicaveis)
let camAnim = null;

/* ------------------------------------------------------------- cena */
const palco = $('#palco');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
palco.insertBefore(renderer.domElement, palco.firstChild);
const lblR = new THREE.CSS2DRenderer();
lblR.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none';
palco.appendChild(lblR.domElement);
const cena = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
cena.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
cena.add(new THREE.HemisphereLight(0xdfe9ef, 0x1a1f22, 0.35));
const sol = new THREE.DirectionalLight(0xffffff, 0.9); sol.position.set(300, 600, 400); cena.add(sol);
const cam = new THREE.PerspectiveCamera(35, 1, 1, 20000);
cam.position.set(500, 400, 600);
const ctl = new THREE.OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true; ctl.dampingFactor = 0.12;
ctl.addEventListener('start', () => { camAnim = null; });
const raiz = new THREE.Group(); cena.add(raiz);
const grade = new THREE.GridHelper(1200, 48, 0x2a3238, 0x1c2226); grade.material.opacity = 0.5; grade.material.transparent = true;
cena.add(grade);

function ajusta() {
  const r = palco.getBoundingClientRect();
  renderer.setSize(r.width, r.height); lblR.setSize(r.width, r.height);
  cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix();
}
window.addEventListener('resize', ajusta);

/* ------------------------------------------------------------- carga das pecas */
const loader = new THREE.GLTFLoader();
function carregaPeca(id) {
  if (!glbCache[id]) {
    glbCache[id] = new Promise((ok, falha) => loader.load('montagem/' + G.pecas[id].glb, g => {
      g.scene.traverse(o => {
        if (o.isLineSegments || (o.isLine && !o.isMesh)) { o.material = matAresta; o.userData.aresta = true; }
        if (o.isMesh) { o.material.side = THREE.FrontSide; }
      });
      ok(g.scene);
    }, undefined, falha));
  }
  return glbCache[id];
}
const matAresta = new THREE.LineBasicMaterial({ color: 0x0a0c0d, transparent: true, opacity: 0.55 });

async function montaModulo(m) {
  raiz.clear(); Object.keys(objs).forEach(k => delete objs[k]);
  $('#carregando').style.opacity = 1;
  const ids = [...new Set(m.instancias.map(i => i.peca))];
  let n = 0;
  await Promise.all(ids.map(id => carregaPeca(id).then(() => {
    n++; $('#carregando').textContent = `carregando peças… ${n}/${ids.length}`;
  })));
  for (const i of m.instancias) {
    const g = (await carregaPeca(i.peca)).clone(true);
    const mats = [];
    g.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); mats.push(o.material); } });
    const obj = new THREE.Group(); obj.add(g);
    const M = new THREE.Matrix4().fromArray(i.m);
    obj.matrixAutoUpdate = false;
    obj.userData.inst = i.id;
    raiz.add(obj);
    const proto = await carregaPeca(i.peca);
    if (!proto.userData.caixa) proto.userData.caixa = new THREE.Box3().setFromObject(proto);
    const box = proto.userData.caixa.clone().applyMatrix4(M);
    objs[i.id] = { obj, i, peca: G.pecas[i.peca], M, mats, centro: box.getCenter(new THREE.Vector3()), box, ctx: (m.contexto || []).includes(i.id),
      desl: new THREE.Vector3(), alvo: new THREE.Vector3(), vis: false, op: 1 };
  }
  // cabos: tubos ao longo dos pontos (referencial do CAD -> three: x, z, -y)
  cabosGrp = new THREE.Group(); raiz.add(cabosGrp);
  (m.cabos || []).forEach(c => {
    const pts = c.pts.map(q => new THREE.Vector3(q[0], q[2], -q[1]));
    const curva = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.3);
    // cor de capa de fio: fosca, sem reflexo do ambiente (senao o vermelho vira rosa)
    const mat = new THREE.MeshStandardMaterial({ color: c.cor, roughness: 0.85, metalness: 0, envMapIntensity: 0.15 });
    const tubo = new THREE.Mesh(new THREE.TubeGeometry(curva, Math.max(24, pts.length * 14), (c.raio || 1.6) * 1.4, 8, false), mat);
    tubo.userData.cabo = c; cabosGrp.add(tubo);
    const d = document.createElement('div'); d.className = 'lblCabo'; d.style.borderLeftColor = c.cor; d.textContent = c.rotulo || c.nome;
    d.onclick = () => abreCabo(c);
    const l = new THREE.CSS2DObject(d); l.position.copy(curva.getPoint(c.rotuloEm === undefined ? 0.5 : c.rotuloEm)); tubo.add(l);
    c._tubo = tubo; c._lbl = l;
  });
  // centro do modulo (para explodir)
  const b = new THREE.Box3(); Object.values(objs).forEach(o => b.union(o.box));
  m._centro = b.getCenter(new THREE.Vector3()); m._raio = b.getSize(new THREE.Vector3()).length() / 2;
  grade.position.y = b.min.y - 2;

}

/* ------------------------------------------------------------- passos */
function visiveisAte(k) {
  const p = MOD.passos[k];
  if (p.mostra === 'tudo') return new Set(Object.keys(objs).filter(id => !foiRemovido(id, k) && !objs[id].i.oculta));
  const s = new Set((p.base || []).concat((MOD.contexto || []).filter(id => !objs[id].i.oculta)));
  for (let j = 0; j <= k; j++) {
    const q = MOD.passos[j];
    if (q.mostra === 'tudo') continue;
    (q.base || []).forEach(id => s.add(id));
    (q.novos || []).forEach(id => s.add(id));
    (q.remove || []).forEach(id => s.delete(id));
  }
  return s;
}
function foiRemovido(id, k) {
  for (let j = 0; j <= k; j++) if ((MOD.passos[j].remove || []).includes(id)) return true;
  return false;
}
function novosDe(k) { const p = MOD.passos[k]; return new Set(p.mostra === 'tudo' ? [] : (p.novos || [])); }

// de onde a peca nova vem: parafuso sai do furo pelo eixo dele; o resto, de fora para dentro
function direcaoEntrada(o) {
  if (o.i.de) return new THREE.Vector3().fromArray(o.i.de).normalize();
  if (o.peca.tipo === 'fixador') {
    const d = new THREE.Vector3(0, 1, 0).transformDirection(o.M);
    return d.normalize();
  }
  const d = o.centro.clone().sub(MOD._centro); if (d.length() < 1) d.set(0, 1, 0);
  return d.normalize();
}

function aplicaPasso(k, animar) {
  passo = Math.max(0, Math.min(MOD.passos.length - 1, k));
  const p = MOD.passos[passo];
  const vis = visiveisAte(passo), novos = novosDe(passo);
  const expl = p.explode || (explodido ? 0.6 : 0);
  Object.values(objs).forEach(o => {
    o.vis = vis.has(o.i.id);
    o.novo = novos.has(o.i.id);
    o.obj.visible = o.vis;
    // explodido: afasta do centro do modulo
    o.alvo.set(0, 0, 0);
    if (expl && !o.ctx) o.alvo.copy(o.centro).sub(MOD._centro).multiplyScalar(expl * 0.9);
    o.entrada = direcaoEntrada(o).multiplyScalar(o.peca.tipo === 'fixador' ? 28 : 70);
  });
  limpaRotulos();
  anim = { t0: performance.now(), dur: animar ? 1300 : 0 };
  // animacao de funcionamento: as pecas da trilha ficam visiveis e seguem as chaves
  filme = null;
  if (p.anim) {
    filme = { a: p.anim, t0: performance.now(), pausa: null, vel: filme && filme.vel || 1, trilhas: {} };
    p.anim.trilhas.forEach(tr => {
      const o = objs[tr.id]; if (!o) return;
      o.vis = true; o.obj.visible = true; o.novo = false;
      filme.trilhas[tr.id] = tr.k.map(([t, m]) => { const M = new THREE.Matrix4().fromArray(m), P = new THREE.Vector3(), Q = new THREE.Quaternion(), S = new THREE.Vector3(); M.decompose(P, Q, S); return { t, P, Q, S }; });
    });
  }
  $('#bPlay').hidden = $('#bVel').hidden = !p.anim; $('#bPlay').textContent = '❚❚ pausar';
  $('#legenda').classList.toggle('on', !!p.anim);
  // transparencia pedida pelo passo (para ver o mecanismo por dentro)
  Object.values(objs).forEach(o => { o.transp = (p.transparentes || []).includes(o.i.id); });
  // cabos
  (MOD.cabos || []).forEach(c => { const v = p.cabos === true || (Array.isArray(p.cabos) && p.cabos.includes(c.id)); c._tubo.visible = v; c._lbl.visible = v; c._lbl.element.style.display = v ? '' : 'none'; });
  pintaCard(); pintaLista(); rotulos(); marcadores();
  enquadra(true);
  history.replaceState(null, '', '#' + MOD.id + '/' + (passo + 1));
}

function corDe(o, t) {
  // novo: pisca em ciano no fim da entrada; antigo com "destacar": transparente
  const destaque = o.novo ? Math.max(0, Math.sin(Math.min(1, t) * Math.PI)) * 0.55 : 0;
  // contexto (peca de outro modulo, so para situar) fica sempre translucida
  const op = o.ctx ? 0.22 : o.transp ? 0.28 : (fantasma && !o.novo && MOD.passos[passo].mostra !== 'tudo') ? 0.16 : 1;
  o.mats.forEach(m => {
    if (!m.userData.base) m.userData.base = { e: m.emissive.clone(), o: m.opacity, t: m.transparent };
    m.emissive.setRGB(0.06 * destaque * 4, 0.55 * destaque, 0.55 * destaque);
    const opac = Math.min(m.userData.base.o, op);
    m.opacity = opac; m.transparent = m.userData.base.t || opac < 1; m.depthWrite = opac >= 1;
  });
}

function quadroDoFilme(agora) {
  if (!filme) return;
  const a = filme.a, dur = a.dur * 1000;
  const tt = filme.pausa !== null ? filme.pausa : (agora - filme.t0) * filme.vel;
  const t = ((tt % dur) + dur) % dur / 1000;
  Object.keys(filme.trilhas).forEach(id => {
    const ks = filme.trilhas[id], o = objs[id];
    let j = 0; while (j < ks.length - 1 && ks[j + 1].t <= t) j++;
    const k0 = ks[j], k1 = ks[Math.min(j + 1, ks.length - 1)];
    const u = k1.t > k0.t ? Math.min(1, Math.max(0, (t - k0.t) / (k1.t - k0.t))) : 0;
    const P = k0.P.clone().lerp(k1.P, u), Q = k0.Q.clone().slerp(k1.Q, u), S = k0.S.clone().lerp(k1.S, u);
    o.obj.matrix.compose(P, Q, S); o.obj.matrixWorldNeedsUpdate = true;
    o.animPos = P;
  });
  // legenda corrente
  const leg = (a.leg || []).find(l => t >= l[0] && t < l[1]);
  const txt = leg ? leg[2] : '';
  if ($('#legTxt').textContent !== txt) {
    $('#legTxt').textContent = txt;
    document.querySelectorAll('.roteiro div').forEach((d, i) => d.classList.toggle('on', a.leg[i] === leg));
  }
  $('#legBar').style.width = (t / a.dur * 100).toFixed(1) + '%';
}
function passoAnim(agora) {
  quadroDoFilme(agora);
  if (!anim) return;
  const t = anim.dur ? (agora - anim.t0) / anim.dur : 1;
  const e = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  Object.values(objs).forEach(o => {
    if (!o.vis) return;
    if (filme && filme.trilhas[o.i.id]) { corDe(o, 0); return; }
    const d = new THREE.Vector3().copy(o.alvo);
    if (o.novo) d.addScaledVector(o.entrada, 1 - e(t));
    o.desl.lerp(d, o.novo ? 1 : 0.18);
    o.obj.matrix.copy(o.M).premultiply(new THREE.Matrix4().makeTranslation(o.desl.x, o.desl.y, o.desl.z));
    o.obj.matrixWorldNeedsUpdate = true;
    corDe(o, o.novo ? t : 0);
  });
  rotulosPos(); marcadoresPos();
}

/* ------------------------------------------------------------- camera */
const VISTA = {
  iso: [1, 0.75, 1.1], frente: [0.25, 0.3, 1], tras: [-0.3, 0.35, -1], cima: [0.15, 1, 0.45],
  baixo: [0.2, -0.9, 0.5], direita: [1, 0.3, 0.25], esquerda: [-1, 0.3, 0.25],
};
function enquadra(suave) {
  const p = MOD.passos[passo];
  const foco = (p.zoom && p.zoom.length) ? p.zoom : (p.mostra === 'tudo' ? null : (p.novos || []));
  const b = new THREE.Box3();
  const lista = foco && foco.length ? foco.map(id => objs[id]).filter(Boolean) : Object.values(objs).filter(o => o.vis && !o.ctx);
  lista.forEach(o => { const bb = o.box.clone(); bb.translate(o.alvo); b.union(bb); });
  if (b.isEmpty()) return;
  // contexto: o foco ocupa ~55 % da tela, mas nunca menos que 140 mm de vista
  const c = b.getCenter(new THREE.Vector3());
  const r = Math.max(70, b.getSize(new THREE.Vector3()).length() / 2);
  const dir = new THREE.Vector3().fromArray(VISTA[p.vista || 'iso'] || VISTA.iso).normalize();
  const dist = r / Math.sin(cam.fov * Math.PI / 360) * (cam.aspect < 1 ? 1.5 : 1.15);
  const pos = c.clone().addScaledVector(dir, dist);
  camAnim = { t0: performance.now(), dur: suave ? 900 : 0, p0: cam.position.clone(), a0: ctl.target.clone(), p1: pos, a1: c };
}
function passoCam(agora) {
  if (!camAnim) return;
  const t = camAnim.dur ? Math.min(1, (agora - camAnim.t0) / camAnim.dur) : 1;
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  cam.position.lerpVectors(camAnim.p0, camAnim.p1, e);
  ctl.target.lerpVectors(camAnim.a0, camAnim.a1, e);
  if (t >= 1) camAnim = null;
}

/* ------------------------------------------------------------- rotulos dos novos */
let rots = [];
function limpaRotulos() { rots.forEach(r => r.parent && r.parent.remove(r)); rots = []; }
function rotulos() {
  const p = MOD.passos[passo];

  (p.novos || []).forEach(id => { const o = objs[id]; if (!o) return; (grupos[o.i.peca] = grupos[o.i.peca] || []).push(o); });
  Object.keys(grupos).forEach(pid => {
    const g = grupos[pid], pc = G.pecas[pid];
    const d = document.createElement('div');
    d.className = 'lbl3' + (pc.tipo === 'fixador' ? ' f' : '');
    d.textContent = (g.length > 1 ? g.length + '× ' : '') + nomeCurto(pc.nome);
    const l = new THREE.CSS2DObject(d); l.userData.grupo = g; cena.add(l); rots.push(l);

function rotulosPos() {
  rots.forEach(l => {

}
function marcadoresPos() {

  const pc = G.pecas[pid];
  const qMod = MOD ? MOD.instancias.filter(i => i.peca === pid && !(MOD.contexto || []).includes(i.id)).length : 0;
  let h = `<button class="btn fechar" id="fFecha">✕</button><h3>${esc(pc.nome)}</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="chip ${pc.tipo}">${TIPO[pc.tipo] || pc.tipo}</span>
    <span class="chip ${pc.src}">${SRC[pc.src] || pc.src}</span></div>`;
  if (pc.dims) h += `<div class="kv"><span>medidas</span><span>${esc(pc.dims)}</span></div>`;
  if (qMod) h += `<div class="kv"><span>quantidade no módulo</span><span>${qMod}${MOD.espelhoA ? ' × 2 eixos' : ''}</span></div>`;
  if (pc.linha) h += `<div class="kv"><span>planilha de compras</span><span>linha ${pc.linha}</span></div>`;
  if (pc.ferramenta) h += `<div class="kv"><span>ferramenta</span><span>${esc(pc.ferramenta)}</span></div>`;
  if (pc.impressao) {
    const im = pc.impressao;
    h += `<div class="kv"><span>material</span><span>${esc(pc.material || 'PETG')}</span></div>
      <div class="kv"><span>preenchimento / paredes</span><span>${esc(im.preenchimento)} / ${esc(im.paredes)}</span></div>
      <div class="kv"><span>suportes</span><span>${esc(im.suportes)}</span></div>
      <div class="kv"><span>tempo estimado</span><span>${esc(im.tempo)}</span></div>`;
    if (pc.tamanhoMesa) h += `<div class="kv"><span>na mesa (X × Y × Z)</span><span>${pc.tamanhoMesa.join(' × ')} mm</span></div>`;
  }
  if (pc.conferir && pc.conferir.length) h += `<div class="caixa at"><b>Meça a sua peça</b><ul>${pc.conferir.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`;
  if (pc.notas && pc.notas.length) h += `<ul>${pc.notas.map(a => `<li>${esc(a)}</li>`).join('')}</ul>`;
  const dl = [];
  if (pc.stl) dl.push(`<a href="montagem/${pc.stl}" download>STL${pc.stlA ? ' (eixo B)' : ''}</a>`);
  if (pc.stlA) dl.push(`<a href="montagem/${pc.stlA}" download>STL espelhado (eixo A)</a>`);
  if (pc.step) dl.push(`<a href="montagem/${pc.step}" download>STEP</a>`);
  if (pc.link) dl.push(`<a href="${esc(pc.link)}" target="_blank" rel="noopener">onde comprar ↗</a>`);
  if (dl.length) h += `<div class="dl">${dl.join('')}</div>`;
  $('#ficha').innerHTML = h; $('#ficha').classList.add('on');
  $('#fFecha').onclick = () => $('#ficha').classList.remove('on');
}

/* clique numa peca abre a ficha */
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => { renderer.domElement._down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  const d = renderer.domElement._down; if (!d || Math.hypot(e.clientX - d[0], e.clientY - d[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, cam);
  const alvos = []; raiz.traverse(o => { if (o.isMesh && o.visible && (!o.parent || o.parent.visible)) alvos.push(o); });
  const hits = ray.intersectObjects(alvos, false);
  for (const h of hits) {
    if (h.object.userData.cabo) { if (h.object.visible) return abreCabo(h.object.userData.cabo); continue; }
    let o = h.object; while (o && !o.userData.inst) o = o.parent;
    if (!o || !o.visible) continue;
    const ob = objs[o.userData.inst];
    if (ob.ctx || ob.transp) continue;                        // clique atravessa o que esta translucido
    return abrePeca(ob.i.peca);
  }
});

/* ------------------------------------------------------------- paginas de texto */
function contagemModulo(m) {
  const c = {};
  m.instancias.forEach(i => { if (!(m.contexto || []).includes(i.id)) c[i.peca] = (c[i.peca] || 0) + 1; });
  return c;
}
function tabelaPecas(filtro) {
  const tot = {};
  G.modulos.filter(m => !m.didatico && m.id !== 'maquina').forEach(m => {
    const c = contagemModulo(m), mult = m.espelhoA ? 2 : 1;
    Object.keys(c).forEach(p => {
      tot[p] = tot[p] || { q: 0, mods: [] };
      tot[p].q += c[p] * mult; tot[p].mods.push(m.nome);
    });
  });
  const ord = { falta: 0, comprado: 1, impresso: 2, fixador: 3 };
  const ids = Object.keys(tot).filter(p => !filtro || G.pecas[p].tipo === filtro)
    .sort((a, b) => (ord[G.pecas[a].tipo] - ord[G.pecas[b].tipo]) || G.pecas[a].nome.localeCompare(G.pecas[b].nome));
  return `<div class="tbl"><table class="t"><thead><tr><th>qtd</th><th>peça</th><th>tipo</th><th>medidas</th><th>onde</th></tr></thead><tbody>
    ${ids.map(p => { const pc = G.pecas[p]; return `<tr><td class="q">${tot[p].q}</td><td>${esc(pc.nome)}${pc.src === 'medir' ? ' <span class="chip medir">medir</span>' : ''}</td>
      <td><span class="chip ${pc.tipo}">${TIPO[pc.tipo] || pc.tipo}</span></td><td>${esc(pc.dims || '')}</td>
      <td>${pc.link ? `<a href="${esc(pc.link)}" target="_blank" rel="noopener">link ↗</a>` : ''}${pc.stl ? ` <a href="montagem/${pc.stl}" download>STL</a>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}
function paginaGeral() {
  const C = G.conteudo || {};
  let h = `<h1>Montagem guiada da PICBOX</h1>
    <p>${C.intro || ''}</p>
    <h2>Módulos</h2><div class="grade">${G.modulos.map(m => `<div class="cartao" data-m="${m.id}"><h3>${esc(m.nome)}</h3>
      <p>${esc(m.resumo)}</p><p style="margin-top:8px"><span class="chip">${m.passos.length - 1} passos</span> <span class="chip">${esc(m.tempo || '')}</span></p></div>`).join('')}
      ${(C.proximos || []).map(n => `<div class="cartao prox"><h3>${esc(n.nome)}</h3><p>${esc(n.resumo)}</p><p style="margin-top:8px"><span class="chip">em preparação</span></p></div>`).join('')}</div>`;
  (C.avisos || []).forEach(a => { h += `<div class="aviso"><h3>${esc(a.titulo)}</h3>${a.texto}</div>`; });
  if (C.antes) h += `<h2>Antes de começar</h2>${C.antes}`;
  if (C.cores) h += `<h2>Como ler o 3D</h2>${C.cores}`;
  return h;
}
function paginaPecas(filtro) {
  return `<h1>Lista de peças</h1><p>Somatório de todos os módulos prontos (o eixo conta 2 vezes: A e B). Clique no link para comprar ou baixar.</p>
    <div class="filtros">${[['', 'tudo'], ['falta', 'falta comprar'], ['comprado', 'comprado'], ['impresso', 'impresso'], ['fixador', 'ferragens']]
      .map(([f, n]) => `<button class="btn ${f === (filtro || '') ? 'on' : ''}" data-f="${f}">${n}</button>`).join('')}</div>${tabelaPecas(filtro)}`;
}
function paginaImprimir() {
  const lista = Object.keys(G.pecas).filter(p => G.pecas[p].tipo === 'impresso' && !G.pecas[p].didatico);
  const qtd = {};
  G.modulos.filter(m => !m.didatico && m.id !== 'maquina').forEach(m => m.instancias.forEach(i => {
    if (G.pecas[i.peca].tipo === 'impresso' && !(m.contexto || []).includes(i.id)) qtd[i.peca] = (qtd[i.peca] || 0) + 1;
  }));
  const C = G.conteudo || {};
  return `<h1>Peças para imprimir</h1>${C.impressao || ''}
    <div class="tbl"><table class="t"><thead><tr><th>qtd</th><th>peça</th><th>na mesa (mm)</th><th>preench.</th><th>suporte</th><th>tempo</th><th>arquivos</th></tr></thead><tbody>
    ${lista.map(p => { const pc = G.pecas[p], im = pc.impressao || {}, m = G.modulos.find(x => x.instancias.some(i => i.peca === p && !(x.contexto || []).includes(i.id)));
      return `<tr><td class="q">${qtd[p]}${m && m.espelhoA && pc.stlA ? ' + ' + qtd[p] : ''}</td><td>${esc(pc.nome)}</td><td>${(pc.tamanhoMesa || []).join(' × ')}</td>
      <td>${esc(im.preenchimento || '')}</td><td>${esc(im.suportes || '')}</td><td>${esc(im.tempo || '')}</td>
      <td><a href="montagem/${pc.stl}" download>STL B</a>${pc.stlA ? ` · <a href="montagem/${pc.stlA}" download>STL A</a>` : ''} · <a href="montagem/${pc.step}" download>STEP</a></td></tr>`; }).join('')}
    </tbody></table></div>`;
}

/* ------------------------------------------------------------- navegacao */
function mostraPagina(nome, arg) {
  $('#pagina').classList.add('on'); $('#main').style.display = 'none';
  const col = $('#paginaCol');
  col.innerHTML = nome === 'geral' ? paginaGeral() : nome === 'pecas' ? paginaPecas(arg) : paginaImprimir();
  col.querySelectorAll('.cartao[data-m]').forEach(c => c.onclick = () => abreModulo(c.dataset.m, 0));
  col.querySelectorAll('.filtros .btn').forEach(b => b.onclick = () => { mostraPagina('pecas', b.dataset.f); history.replaceState(null, '', '#pecas'); });
  pintaTabs(nome);
  if (nome !== 'pecas' || !arg) history.replaceState(null, '', '#' + nome);
}
async function abreModulo(id, k) {
  MOD = G.modulos.find(m => m.id === id);
  if (!MOD) return mostraPagina('geral');
  $('#pagina').classList.remove('on'); $('#main').style.display = '';
  $('#ficha').classList.remove('on');
  pintaTabs(id); ajusta();
  await montaModulo(MOD);
  aplicaPasso(k || 0, true);
}
function pintaTabs(on) {
  const bt = ([id, n]) => `<button class="tab ${id === on ? 'on' : ''}" data-t="${id}">${esc(n)}</button>`;
  const ent = G.modulos.filter(m => m.didatico || m.id === 'maquina'), mon = G.modulos.filter(m => !m.didatico && m.id !== 'maquina');
  const curto = n => n.replace('Como funciona: ', '').replace('Alternativa: ', 'alt.: ');
  $('#tabs').innerHTML = bt(['geral', 'visão geral']) +
    `<span class="tsep">entender</span>` + ent.map(m => bt([m.id, curto(m.nome)])).join('') +
    `<span class="tsep">montar</span>` + mon.map(m => bt([m.id, m.nome])).join('') +
    `<span class="tsep">listas</span>` + bt(['pecas', 'peças']) + bt(['imprimir', 'imprimir']);
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    const id = b.dataset.t;
    if (['geral', 'pecas', 'imprimir'].includes(id)) mostraPagina(id); else abreModulo(id, 0);
  });
}

$('#bAnt').onclick = () => aplicaPasso(passo - 1, true);
$('#bProx').onclick = () => aplicaPasso(passo + 1, true);
$('#bRepete').onclick = () => aplicaPasso(passo, true);
$('#bVista').onclick = () => enquadra(true);
$('#bExplode').onclick = () => { explodido = !explodido; $('#bExplode').classList.toggle('on', explodido); aplicaPasso(passo, false); };
$('#bFantasma').onclick = () => { fantasma = !fantasma; $('#bFantasma').classList.toggle('on', fantasma); };
function tocaPausa() {
  if (!filme) return;
  if (filme.pausa === null) { filme.pausa = (performance.now() - filme.t0) * filme.vel; $('#bPlay').textContent = '▶ continuar'; }
  else { filme.t0 = performance.now() - filme.pausa / filme.vel; filme.pausa = null; $('#bPlay').textContent = '❚❚ pausar'; }
}
$('#bPlay').onclick = tocaPausa;
$('#bVel').onclick = () => {
  if (!filme) return;
  const agora = performance.now(), tt = filme.pausa !== null ? filme.pausa : (agora - filme.t0) * filme.vel;
  filme.vel = filme.vel === 1 ? 0.4 : filme.vel === 0.4 ? 2 : 1; $('#bVel').textContent = (filme.vel === 0.4 ? '0,4' : filme.vel) + '×';
  if (filme.pausa === null) filme.t0 = agora - tt / filme.vel;
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') fechaModal();
  if (!MOD || $('#pagina').classList.contains('on') || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') aplicaPasso(passo + 1, true);
  else if (e.key === 'ArrowLeft') aplicaPasso(passo - 1, true);
  else if (e.key === 'r' || e.key === 'R') aplicaPasso(passo, true);
  else if (e.key === 'e' || e.key === 'E') $('#bExplode').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFantasma').click();
  else if (e.key === 'v' || e.key === 'V') enquadra(true);
  else if (e.key === 'Escape') { fechaModal(); $('#ficha').classList.remove('on'); }
  else if (e.key === ' ') { e.preventDefault(); tocaPausa(); }
});

function laco(agora) {
  requestAnimationFrame(laco);
  passoAnim(agora); passoCam(agora); ctl.update();
  renderer.render(cena, cam); lblR.render(cena, cam);
}

fetch('montagem/guia.json', { cache: 'no-cache' }).then(r => r.json()).then(g => {
  G = g;
  ajusta(); requestAnimationFrame(laco);
  const h = location.hash.replace('#', '').split('/');
  if (G.modulos.some(m => m.id === h[0])) abreModulo(h[0], Math.max(0, (+h[1] || 1) - 1));
  else mostraPagina(['pecas', 'imprimir'].includes(h[0]) ? h[0] : 'geral');
}).catch(e => { $('#carregando').textContent = 'não consegui ler montagem/guia.json: ' + e.message; });
})();
</script>
