<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#eef0ec}canvas{display:block}</style>
<script src="node_modules/three/build/three.min.js"></script>
<script src="node_modules/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="node_modules/three/examples/js/exporters/GLTFExporter.js"></script>
<script src="node_modules/three/examples/js/environments/RoomEnvironment.js"></script>
</head><body>
<script>
'use strict';
// Cena: peças do CadQuery (saidas/montagem/maquina_a.glb) + gabinete de MDF do CAD antigo (só contexto).
const CAD_GLB = '../../saidas/montagem/maquina_a.glb';
const BASE = '../../../montagem/';
const GRUPOS = {
  g:   'Gabinete',
  B:   'Eixo B (buraco)',
  boca:'Boca e detecção',
  bj:  'Bandeja',
  elev:'Elevador de fuso',
  A:   'Eixo A (bola)',
  sol: 'Soltura (berço)',
  mag: 'Magazine e carga',
};
const POR_ID = { A09: 'boca', A10: 'sol', A11: 'sol', A36: 'sol', A12: 'bj', A13: 'bj',
  A15: 'mag', A16: 'mag', A17: 'mag', A18: 'mag', A19: 'mag', A26: 'mag',
  A20: 'elev', A21: 'elev', A22: 'elev', A23: 'elev', A24: 'elev', A25: 'elev', A27: 'elev' };
function grupoCad(nome) {
  // o GLTFLoader tira os pontos dos nomes: comprada_A.perfil chega como comprada_Aperfil
  if (/^comprada_A/.test(nome)) return /solenoide/.test(nome) ? 'sol' : 'A';
  if (/^comprada_B/.test(nome)) return 'B';
  if (nome.startsWith('bandeja_')) return 'bj';
  if (nome.startsWith('comprada_elev')) return 'elev';
  if (nome.startsWith('comprada_')) return 'mag';
  const id = nome.slice(0, 3);
  return POR_ID[id] || (nome.includes('eixoA') ? 'A' : 'B');
}

let W = 1600, H = 1200;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(1);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0xeef0ec, 1);
document.body.appendChild(renderer.domElement);
const cena = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
cena.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
cena.add(new THREE.HemisphereLight(0xdfe9ef, 0x1a1f22, 0.35));
const sol = new THREE.DirectionalLight(0xffffff, 0.9); sol.position.set(300, 600, 400); cena.add(sol);
const cam = new THREE.PerspectiveCamera(30, W / H, 60, 12000);
const raiz = new THREE.Group(); raiz.name = 'PICBOX_Cesta'; cena.add(raiz);
const grupos = {};
const matAresta = new THREE.LineBasicMaterial({ color: 0x0a0c0d, transparent: true, opacity: 0.5 });

const loader = new THREE.GLTFLoader();
const cache = {};
const carrega = url => cache[url] || (cache[url] = new Promise((ok, no) => loader.load(url, g => ok(g.scene), undefined, no)));

// mapa: nome do arquivo da peça (sem extensão) -> ID curto usado no painel (A01-B, A12-3...)
window.monta = async function (mapa = {}) {
  for (const k of Object.keys(GRUPOS)) { const gr = new THREE.Group(); gr.name = k; gr.userData.nome = GRUPOS[k]; grupos[k] = gr; raiz.add(gr); }
  // peças do CadQuery: cada nó do GLB é uma peça (impressa ou comprada) já na posição da máquina
  const cad = await carrega(CAD_GLB);
  for (const no of [...cad.children]) {
    const obj = new THREE.Group(); obj.name = no.name;
    obj.userData.peca = mapa[no.name] || no.name;
    const c = no.clone(true);
    c.traverse(o => {
      if (!o.isMesh) return;
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();   // o GLB do trimesh vem sem normais
      const ca = o.geometry.attributes.color;                                  // e com a cor em sRGB: glTF espera linear
      if (ca && !ca.userData?.linear) { const f = new Float32Array(ca.count * 3), k = new THREE.Color();
        for (let i = 0; i < ca.count; i++) { k.setRGB(ca.getX(i), ca.getY(i), ca.getZ(i)).convertSRGBToLinear(); f.set([k.r, k.g, k.b], i * 3); }
        o.geometry.setAttribute('color', new THREE.BufferAttribute(f, 3)); }
      const acril = /acrilico|comprada_tubo/.test(no.name);
      o.material = new THREE.MeshStandardMaterial({ vertexColors: !!o.geometry.attributes.color, color: o.geometry.attributes.color ? 0xffffff : 0xb9bfc4, roughness: acril ? 0.08 : 0.62, metalness: 0.02,
        transparent: acril, opacity: acril ? 0.28 : 1, depthWrite: !acril, side: acril ? THREE.DoubleSide : THREE.FrontSide });
      if (!no.name.startsWith('comprada_')) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 32), matAresta); o.add(e); }
    });
    obj.add(c);
    obj.matrixAutoUpdate = false; obj.userData.M = obj.matrix.clone();
    grupos[grupoCad(no.name)].add(obj);
  }
  // gabinete de MDF do CAD antigo, mesmas coordenadas (three: Y para cima, frente em +Z)
  const G = await (await fetch(BASE + 'guia.json')).json();
  const m = G.modulos.find(x => x.id === 'maquina');
  const gab = m.instancias.filter(i => i.id.startsWith('g_'));
  await Promise.all(gab.map(i => carrega(BASE + G.pecas[i.peca].glb)));
  for (const i of gab) {
    const proto = await carrega(BASE + G.pecas[i.peca].glb);
    const c = proto.clone(true);
    c.traverse(o => { if (o.isLineSegments || (o.isLine && !o.isMesh)) { o.material = matAresta; } if (o.isMesh) o.material.side = THREE.FrontSide; });
    const obj = new THREE.Group(); obj.add(c); obj.name = i.id; obj.userData.peca = 'gab:' + i.peca;
    obj.matrixAutoUpdate = false; obj.matrix.fromArray(i.m); obj.userData.M = obj.matrix.clone();
    grupos.g.add(obj);
  }
  raiz.updateMatrixWorld(true);
  for (const k in grupos) { const b = new THREE.Box3().setFromObject(grupos[k]); grupos[k].userData.box = b; grupos[k].userData.c0 = b.getCenter(new THREE.Vector3()); }
  return Object.fromEntries(Object.entries(grupos).map(([k, g]) => [k, { n: g.children.length, box: [g.userData.box.min.toArray().map(Math.round), g.userData.box.max.toArray().map(Math.round)] }]));
};

/* opts: {w,h, ocultar:[ids or groups], translucido:[ids], explode:{grupo:[dx,dy,dz]}, dir:[x,y,z], foco:[grupos], margem, rotulos:bool, alvo:[x,y,z], dist} */
window.quadro = function (o) {
  W = o.w || 1600; H = o.h || 1200;
  renderer.setSize(W, H); cam.aspect = W / H; cam.near = 10; cam.far = 50000; cam.updateProjectionMatrix();
  const ocultar = new Set(o.ocultar || []);
  const transl = new Set(o.translucido || []);
  for (const k in grupos) {
    const gr = grupos[k];
    gr.visible = !ocultar.has(k);
    const d = (o.explode && o.explode[k]) || [0, 0, 0];
    gr.position.set(d[0], d[1], d[2]);
    gr.children.forEach(ch => {
      ch.visible = !ocultar.has(ch.name);
      const t = transl.has(ch.name) || transl.has(k);
      ch.traverse(x => {
        if (x.isMesh) {
          if (!x.userData.m0) x.userData.m0 = x.material;
          if (t) { if (!x.userData.mt) { x.userData.mt = x.material.clone(); x.userData.mt.transparent = true; x.userData.mt.opacity = o.opac || 0.16; x.userData.mt.depthWrite = false; } x.material = x.userData.mt; }
          else x.material = x.userData.m0;
        }
        if (x.isLineSegments) x.visible = !t;
      });
    });
  }
  raiz.updateMatrixWorld(true);
  const b = new THREE.Box3();
  const foco = o.foco || Object.keys(grupos).filter(k => !ocultar.has(k));
  foco.forEach(k => { const gr = grupos[k]; gr.children.forEach(ch => { if (ch.visible) b.expandByObject(ch); }); });
  const c = o.alvo ? new THREE.Vector3().fromArray(o.alvo) : b.getCenter(new THREE.Vector3());
  const dir = new THREE.Vector3().fromArray(o.dir || [1, 0.55, 1.25]).normalize();
  // distancia que enquadra todos os cantos da caixa
  const pts = []; for (let i = 0; i < 8; i++) pts.push(new THREE.Vector3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z));
  // enquadra pelos vertices reais das pecas visiveis (busca binaria na distancia)
  const vs = [];
  foco.forEach(k => grupos[k].children.forEach(ch => { if (!ch.visible) return; ch.traverse(x => { if (x.isMesh && x.visible) { const p = x.geometry.attributes.position; const st = Math.max(1, Math.floor(p.count / 60)); for (let i = 0; i < p.count; i += st) vs.push(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(x.matrixWorld)); } }); }));
  const mx = o.margem || 0.9, my = o.margemY || mx;
  const cabe = d => { cam.position.copy(c).addScaledVector(dir, d); cam.lookAt(c); cam.updateMatrixWorld(true); cam.updateProjectionMatrix();
    let ax = 0, ay = 0, bx = 0, by = 0; for (const v of vs) { const q = v.clone().project(cam); if (q.z >= 1) return false; ax = Math.min(ax, q.x); bx = Math.max(bx, q.x); ay = Math.min(ay, q.y); by = Math.max(by, q.y); }
    return Math.max(-ax, bx) < mx && Math.max(-ay, by) < my; };
  let lo = 200, hi = 20000;
  for (let it = 0; it < 30; it++) { const mid = (lo + hi) / 2; if (cabe(mid)) hi = mid; else lo = mid; }
  // recentra: desloca o alvo para o centro da projecao
  cabe(hi);
  { let ax = 1e9, ay = 1e9, bx = -1e9, by = -1e9; for (const v of vs) { const q = v.clone().project(cam); ax = Math.min(ax, q.x); bx = Math.max(bx, q.x); ay = Math.min(ay, q.y); by = Math.max(by, q.y); }
    const q = new THREE.Vector3((ax + bx) / 2, (ay + by) / 2, new THREE.Vector3().copy(c).project(cam).z).unproject(cam);
    c.copy(q); lo = 200; hi = 20000; for (let it = 0; it < 30; it++) { const mid = (lo + hi) / 2; if (cabe(mid)) hi = mid; else lo = mid; } cabe(hi * (o.zoom ? 1 / o.zoom : 1)); }
  if (o.dist) { cam.position.copy(c).addScaledVector(dir, o.dist); cam.lookAt(c); }
  { const dd = cam.position.distanceTo(c); cam.near = dd * 0.35; cam.far = dd * 2.5; cam.updateProjectionMatrix(); }
  sol.position.copy(cam.position).add(new THREE.Vector3(-400, 900, 200));
  renderer.render(cena, cam);
  // compõe com rótulos
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);
  if (o.rotulos) {
    const fs = Math.round(W / 62);
    g.font = `600 ${fs}px "IBM Plex Sans","DejaVu Sans",sans-serif`; g.textBaseline = 'middle';
    o.rotulos.forEach(r => {
      const k = r.g, gr = grupos[k];
      if (ocultar.has(k)) return;
      const p = new THREE.Vector3().fromArray(r.p).add(gr.position).project(cam);
      const x = (p.x + 1) / 2 * W, y = (1 - p.y) / 2 * H;
      const off = [r.dx * W, r.dy * H];
      const lx = x + off[0], ly = y + off[1];
      g.strokeStyle = '#1c2321'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(lx, ly); g.stroke();
      g.fillStyle = '#1c2321'; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill();
      const t = r.t || GRUPOS[k], tw = g.measureText(t).width, pad = fs * 0.5;
      const bx = off[0] >= 0 ? lx : lx - tw - pad * 2;
      g.fillStyle = 'rgba(255,255,255,.94)'; g.strokeStyle = '#1c2321'; g.lineWidth = 1.5;
      g.beginPath(); g.roundRect(bx, ly - fs * 0.85, tw + pad * 2, fs * 1.7, fs * 0.35); g.fill(); g.stroke();
      g.fillStyle = '#1c2321'; g.fillText(t, bx + pad, ly + 1);
    });
  }
  return out.toDataURL('image/png');
};

window.exporta = function (ocultar) {
  // volta tudo ao lugar e exporta a cena inteira como um GLB
  window.quadro({ w: 64, h: 64, ocultar: [] });
  for (const k in grupos) grupos[k].position.set(0, 0, 0);
  raiz.traverse(x => { if (x.isMesh && x.userData.m0) x.material = x.userData.m0; if (x.isLineSegments) x.visible = true; });
  raiz.traverse(x => { if (x.userData.M) { x.matrix.copy(x.userData.M); x.matrix.decompose(x.position, x.quaternion, x.scale); } });
  // no GLB só vai o id da peça (extras.peca); o resto do userData é estado do render
  raiz.traverse(x => { const p = x.userData.peca, n = x.userData.nome; x.userData = {}; if (p) x.userData.peca = p; if (n) x.userData.nome = n; });
  return new Promise((ok, no) => new THREE.GLTFExporter().parse(raiz, r => {
    const b = new Uint8Array(r); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); ok(btoa(s));
  }, no, { binary: true, onlyVisible: false }));
};
</script>
</body></html>
